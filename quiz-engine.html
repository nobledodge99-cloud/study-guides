<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Engine — Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6ec;
    --surface: #fffdf8;
    --forest-dark: #2f5233;
    --forest: #3f7d52;
    --forest-light: #e8f0e6;
    --border: #ddd5c0;
    --ink: #2a2a22;
    --muted: #726f5f;
    --brick: #b3441e;
    --brick-light: #f5e6df;
    --gold: #ab7d2c;
    --shadow: 0 1px 2px rgba(47,82,51,0.06), 0 2px 8px rgba(47,82,51,0.05);
  }
.back-btn {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 1000;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--forest-dark);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--forest-light);
    box-shadow: var(--shadow);
  }
  .back-btn:hover { background: #dcebd9; }
  
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Lora', Georgia, 'Iowan Old Style', serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    letter-spacing: 0.02em;
  }

  #app {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ---------- Header ---------- */
  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 2px solid var(--forest-dark);
    padding-bottom: 14px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header.top .brand h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--forest-dark);
    letter-spacing: -0.01em;
  }
  header.top .brand .tag {
    margin-top: 2px;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  nav.tabs {
    display: flex;
    gap: 6px;
  }
  nav.tabs button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--forest-dark);
    padding: 7px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  nav.tabs button:hover { border-color: var(--forest); background: var(--forest-light); }
  nav.tabs button.active { background: var(--forest-dark); border-color: var(--forest-dark); color: var(--surface); }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 1.15rem;
    color: var(--forest-dark);
  }
  .card .sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin-bottom: 18px;
  }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .empty .glyph {
    font-size: 2rem;
    margin-bottom: 10px;
    color: var(--forest);
  }
  .empty h3 { color: var(--forest-dark); margin: 0 0 6px; }

  /* ---------- Topic picker ---------- */
  .topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }
  .topic-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    background: var(--cream);
    transition: all 0.12s ease;
  }
  .topic-item:hover { border-color: var(--forest); }
  .topic-item.checked { background: var(--forest-light); border-color: var(--forest); }
  .topic-item .name { font-size: 0.92rem; }
  .topic-item .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1px 7px;
  }
  .topic-item .box {
    width: 15px; height: 15px;
    border: 1.5px solid var(--forest);
    border-radius: 3px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .topic-item.checked .box { background: var(--forest); }
  .topic-item.checked .box::after {
    content: '✓';
    color: var(--surface);
    font-size: 10px;
    font-weight: bold;
  }

  .link-row {
    display: flex;
    gap: 14px;
    margin-bottom: 18px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--forest);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .row-split {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .stepper {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stepper button {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--forest);
    background: var(--surface);
    color: var(--forest-dark);
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
  }
  .stepper button:hover { background: var(--forest-light); }
  .stepper .n {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
    min-width: 28px;
    text-align: center;
  }
  .stepper .label { font-size: 0.82rem; color: var(--muted); margin-left: 4px; }

  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
  .toggle {
    width: 34px; height: 19px;
    border-radius: 20px;
    background: var(--border);
    position: relative;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .toggle.on { background: var(--forest); }
  .toggle .knob {
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--surface);
    position: absolute;
    top: 2px; left: 2px;
    transition: left 0.15s ease;
  }
  .toggle.on .knob { left: 17px; }

  .btn-primary {
    background: var(--forest-dark);
    color: var(--surface);
    border: none;
    padding: 12px 22px;
    border-radius: 7px;
    font-family: 'Lora', serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-primary:hover:not(:disabled) { background: var(--forest); }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  .btn-secondary {
    background: var(--surface);
    color: var(--forest-dark);
    border: 1.5px solid var(--forest-dark);
    padding: 11px 20px;
    border-radius: 7px;
    font-family: 'Lora', serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-secondary:hover { background: var(--forest-light); }

  .btn-danger {
    background: var(--surface);
    color: var(--brick);
    border: 1.5px solid var(--brick);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn-danger:hover { background: var(--brick-light); }

  /* ---------- Quiz screen ---------- */
  .quiz-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .quiz-meta .progress-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--forest-light);
    color: var(--forest-dark);
    border: 1px solid var(--forest);
    border-radius: 20px;
    padding: 3px 11px;
  }
  .progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: var(--forest);
    transition: width 0.25s ease;
  }

  .vignette {
    font-size: 1.02rem;
    line-height: 1.65;
    margin-bottom: 24px;
    white-space: pre-wrap;
  }

  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.12s ease;
    background: var(--surface);
  }
  .option:hover:not(.locked) { border-color: var(--forest); background: var(--forest-light); }
  .option.selected { border-color: var(--forest); background: var(--forest-light); }
  .option.locked { cursor: default; }
  .option.correct-answer { border-color: var(--forest); background: var(--forest-light); }
  .option.wrong-answer { border-color: var(--brick); background: var(--brick-light); }

  .bubble {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--forest);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--forest-dark);
    background: var(--surface);
    transition: all 0.12s ease;
  }
  .option.selected .bubble { background: var(--forest); color: var(--surface); }
  .option.correct-answer .bubble { background: var(--forest); color: var(--surface); border-color: var(--forest); }
  .option.wrong-answer .bubble { background: var(--brick); color: var(--surface); border-color: var(--brick); }
  .option .opt-text { padding-top: 3px; line-height: 1.5; }

  .explain-box {
    margin-top: 18px;
    padding: 16px 18px;
    background: var(--forest-light);
    border-left: 3px solid var(--forest);
    border-radius: 0 8px 8px 0;
    font-size: 0.92rem;
    line-height: 1.6;
  }
  .explain-box .head {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--forest-dark);
    margin-bottom: 6px;
    display: block;
  }

  .quiz-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
  }
  .quit-link {
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    background: none; border: none; font-family: 'Lora', serif;
  }

  /* ---------- Results ---------- */
  .score-hero {
    text-align: center;
    padding: 20px 0 8px;
  }
  .score-hero .big {
    font-size: 3rem;
    font-weight: 700;
    color: var(--forest-dark);
    line-height: 1;
  }
  .score-hero .pct { color: var(--muted); font-size: 1rem; margin-top: 6px; }

  .topic-breakdown { margin: 22px 0; }
  .breakdown-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .breakdown-row .t-name { flex: 1; }
  .breakdown-row .bar-track {
    flex: 2;
    height: 7px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .breakdown-row .bar-fill { height: 100%; background: var(--forest); }
  .breakdown-row .t-score { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--muted); width: 52px; text-align: right; }

  .review-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .review-head {
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--cream);
  }
  .review-head .snippet { font-size: 0.88rem; color: var(--ink); flex: 1; }
  .review-head .arrow { color: var(--muted); font-size: 0.75rem; flex-shrink: 0; }
  .review-body { padding: 16px; border-top: 1px solid var(--border); }

  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

  /* ---------- Manage bank ---------- */
  .stat-strip {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .stat {
    font-family: 'IBM Plex Mono', monospace;
  }
  .stat .num { font-size: 1.4rem; color: var(--forest-dark); font-weight: 600; }
  .stat .lbl { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 26px 18px;
    text-align: center;
    background: var(--cream);
    cursor: pointer;
    transition: all 0.15s ease;
    margin-bottom: 14px;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--forest);
    background: var(--forest-light);
  }
  .dropzone .dz-glyph {
    font-size: 1.6rem;
    color: var(--forest);
    margin-bottom: 6px;
  }
  .dropzone .dz-title {
    font-size: 0.92rem;
    color: var(--forest-dark);
    font-weight: 600;
    margin-bottom: 3px;
  }
  .dropzone .dz-sub {
    font-size: 0.76rem;
    color: var(--muted);
  }
  .dropzone .dz-filename {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--forest-dark);
    margin-top: 6px;
  }

  .or-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 14px 0;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  textarea.importbox {
    width: 100%;
    min-height: 130px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    padding: 12px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    background: var(--cream);
    color: var(--ink);
    resize: vertical;
  }
  textarea.importbox:focus { outline: none; border-color: var(--forest); }

  .import-status {
    font-size: 0.82rem;
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    white-space: pre-wrap;
  }
  .import-status.ok { color: var(--forest-dark); }
  .import-status.err { color: var(--brick); }

  details.format-help {
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  details.format-help summary { cursor: pointer; color: var(--forest); }
  details.format-help pre {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    font-size: 0.72rem;
    margin-top: 8px;
  }

  .bank-topic-group { margin-bottom: 18px; }
  .bank-topic-group h3 {
    font-size: 0.9rem;
    color: var(--forest-dark);
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .bank-q-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    font-size: 0.84rem;
    border-bottom: 1px dashed var(--border);
  }
  .bank-q-row .snippet { flex: 1; color: var(--ink); }
  .bank-q-row .sub-tag { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; }

  .danger-zone {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px dashed var(--brick);
  }
  .danger-zone .warn { font-size: 0.8rem; color: var(--muted); margin-bottom: 10px; }

  .loading, .toast {
    text-align: center;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    padding: 20px;
  }

  @media (max-width: 560px) {
    header.top { flex-direction: column; align-items: flex-start; }
    .row-split { flex-direction: column; align-items: stretch; }
    .actions-row .btn-primary, .actions-row .btn-secondary { width: 100%; }
  }

  /* ---------- Cumulative review additions ---------- */
  #app { padding-top: 68px; } /* keeps the fixed back button from covering the title */
  .summary-card { display:flex; align-items:center; justify-content:space-between; gap:14px 22px; flex-wrap:wrap; }
  .summary-stats { display:flex; gap:26px; flex-wrap:wrap; }
  .summary-note { width:100%; margin:-4px 0 0; font-size:0.8rem; color:var(--muted); }
  .filter-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .filter-row label { display:flex; flex-direction:column; gap:4px; font-family:'IBM Plex Mono',monospace; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); min-width:0; }
  select.sel { font-family:'Lora',serif; font-size:0.86rem; padding:8px 9px; border:1.5px solid var(--border); border-radius:7px; background:var(--cream); color:var(--ink); max-width:100%; text-transform:none; letter-spacing:0; }
  select.sel:focus { outline:none; border-color:var(--forest); }
  .seg { display:inline-flex; border:1.5px solid var(--forest); border-radius:7px; overflow:hidden; }
  .seg button { background:var(--surface); border:none; padding:7px 13px; font-family:'IBM Plex Mono',monospace; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--forest-dark); cursor:pointer; }
  .seg button.on { background:var(--forest-dark); color:var(--surface); }
  .chip-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .chip-row .lbl { font-family:'IBM Plex Mono',monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-right:4px; }
  .chip { font-family:'IBM Plex Mono',monospace; font-size:0.72rem; border:1px solid var(--border); background:var(--cream); color:var(--forest-dark); border-radius:14px; padding:3px 11px; cursor:pointer; }
  .chip:hover, .chip.on { border-color:var(--forest); background:var(--forest-light); }
  .block-label { grid-column:1 / -1; font-family:'IBM Plex Mono',monospace; font-size:0.68rem; color:var(--gold); text-transform:uppercase; letter-spacing:0.09em; margin-top:8px; }
  .block-label:first-child { margin-top:0; }
  .tbl-wrap { overflow-x:auto; }
  table.data { width:100%; border-collapse:collapse; font-size:0.85rem; }
  table.data th { text-align:left; font-family:'IBM Plex Mono',monospace; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--forest-dark); background:var(--forest-light); padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.data td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.data tr:last-child td { border-bottom:none; }
  table.data td.num, table.data th.num { text-align:right; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  table.data td.muted { color:var(--muted); }
  .badge { font-family:'IBM Plex Mono',monospace; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.05em; border-radius:10px; padding:2px 8px; white-space:nowrap; border:1px solid; }
  .badge.ok { color:var(--forest-dark); background:var(--forest-light); border-color:var(--forest); }
  .badge.warn { color:var(--gold); background:#f6eedb; border-color:var(--gold); }
  .badge.bad { color:var(--brick); background:var(--brick-light); border-color:var(--brick); }
  .meter { position:relative; height:9px; min-width:90px; background:var(--border); border-radius:5px; }
  .meter .fill { height:100%; background:var(--forest); border-radius:5px; }
  .meter .tick { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--brick); }
  .meter-cell { display:flex; align-items:center; gap:8px; min-width:150px; }
  .meter-cell .meter { flex:1; }
  .meter-cell .pct { font-family:'IBM Plex Mono',monospace; font-size:0.74rem; width:40px; text-align:right; color:var(--muted); }
  .legend { font-size:0.78rem; color:var(--muted); margin:10px 0 0; line-height:1.55; }
  .legend .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:4px; }
  .day-chart { display:flex; align-items:flex-end; gap:6px; height:100px; margin-top:6px; }
  .day-col { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; height:100%; min-width:0; }

  function uid(prefix) {

  // Actually proves localStorage works in this browser/context — writes a
  // throwaway value, reads it back, and confirms it round-trips, rather than
  // assuming it works just because the API object exists (some browsers expose
  // window.localStorage for file:// pages but throw or silently no-op on use).
  function checkStorageAvailability() {
    const probeKey = '__quiz_engine_storage_probe__';
    const probeVal = String(Date.now());
    try {
      localStorage.setItem(probeKey, probeVal);
      const readBack = localStorage.getItem(probeKey);
      localStorage.removeItem(probeKey);
      return readBack === probeVal;
    } catch (e) {
      return false;
    }
  }

  async function loadBank() {
    storageAvailable = checkStorageAvailability();

    if (!storageAvailable) {
      bank = SEED_QUESTIONS.slice();
      normalizeBank();
      selectedTopics = new Set(getTopics());
      render();
      return;
    }

    loadProgress();
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        bank = JSON.parse(raw);
        if (normalizeBank()) await saveBank();
      } else {
        bank = SEED_QUESTIONS.slice();
        normalizeBank();
        await saveBank();
      }
    } catch (e) {
      // Corrupted stored value, or storage failed after all despite the probe passing
      bank = SEED_QUESTIONS.slice();
      normalizeBank();
      try { await saveBank(); } catch (e2) { /* non-fatal */ }
    }
    selectedTopics = new Set(getTopics());
    render();
  }

  async function saveBank() {
    if (!storageAvailable) return; // don't pretend to save when we already know it won't work
    try {
      const payload = JSON.stringify(bank);
      localStorage.setItem(STORAGE_KEY, payload);
      // Verify the write actually landed — some browsers accept the call but
      // silently cap/ignore it (e.g. quota exceeded in certain private modes).
      const confirmRead = localStorage.getItem(STORAGE_KEY);
      if (confirmRead !== payload) {
        storageAvailable = false;
      }
    } catch (e) {
      console.error('Storage save failed', e);
      storageAvailable = false;
    }
  }

  function getTopics() {
    const set = new Set();
    bank.forEach(q => set.add(q.topic));
    return Array.from(set).sort();

  function countForTopic(t) {
    return bank.filter(q => q.topic === t).length;

  function shuffleArr(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---------------- JSON sanitizing / import parsing ----------------
     Defends against real-world paste/download mangling: BOM characters,
     leading/trailing whitespace, and stray text appended before or after
     the actual JSON payload (e.g. from a browser extension, clipboard
     manager, or "select all" grabbing surrounding page chrome). We find
     the first opening bracket and the last closing bracket in the text
     and slice to that span before ever calling JSON.parse.
  ------------------------------------------------------------------- */

  // Depth-aware, quote-aware boundary scanner. Walks the text the way a real
  // JSON parser would — tracking string state and escape characters — so that
  // brackets appearing inside quoted strings, or stray brackets in garbage
  // text before/after the payload, never get mistaken for the true start/end.
  // This is what makes drag-and-drop/paste resilient to whatever a browser
  // extension, clipboard manager, or "select all" happens to have tacked on.
  function findJsonBoundary(text) {
    const firstBracket = text.search(/[\[{]/);
    if (firstBracket === -1) return null;

    const openChar = text[firstBracket];
    const closeChar = openChar === '[' ? ']' : '}';
    let depth = 0;
    let inString = false;
    let escaped = false;

    for (let i = firstBracket; i < text.length; i++) {
      const ch = text[i];
      if (inString) {
        if (escaped) { escaped = false; }
        else if (ch === '\\') { escaped = true; }
        else if (ch === '"') { inString = false; }
        continue;
      }
      if (ch === '"') { inString = true; continue; }
      if (ch === '[' || ch === '{') depth++;
      else if (ch === ']' || ch === '}') {
        depth--;
        if (depth === 0) return { start: firstBracket, end: i + 1, openChar, closeChar };
      }
    }
    return null; // depth never returned to 0 — the payload itself is incomplete
  }

  function sanitizeJsonText(raw) {
    if (typeof raw !== 'string') return { cleaned: raw, truncated: false, noBracket: false };
    let text = raw.replace(/^\uFEFF/, ''); // strip BOM if present
    text = text.trim();
    if (!text) return { cleaned: text, truncated: false, noBracket: true };

    const bounds = findJsonBoundary(text);
    if (!bounds) {
      // Either no bracket at all, or an opening bracket with no matching close —
      // both mean the JSON payload itself is incomplete, not just surrounded by junk.
      const hasBracket = /[\[{]/.test(text);
      return { cleaned: text, truncated: hasBracket, noBracket: !hasBracket };
    }
    return { cleaned: text.slice(bounds.start, bounds.end), truncated: false, noBracket: false };
  }

  function describeParseError(originalText, cleanResult, err) {
    if (cleanResult.truncated) {
      return 'This file looks incomplete — the JSON never closes properly (a closing ] or } is missing). ' +
             'This usually means the download or copy got cut off partway through. Try re-downloading the file ' +
             '(ideally in an incognito/private window, in case a browser extension is interfering) and import it again.';
    }
    if (cleanResult.noBracket) {
      return 'No JSON array or object was found in this file/text at all — it may be empty, or not a JSON file.';
    }
    const text = cleanResult.cleaned;
    const m = /position (\d+)/i.exec(err.message);
    if (!m) return 'Could not parse JSON: ' + err.message;
    const pos = parseInt(m[1], 10);
    const start = Math.max(0, pos - 30);
    const end = Math.min(text.length, pos + 30);
    const context = text.slice(start, end).replace(/\s+/g, ' ');
    return 'Could not parse JSON: ' + err.message + '\nNear: …' + context + '…';
  }

  function validateQuestion(q) {
    if (!q || typeof q !== 'object') return 'not an object';
    if (!q.topic || typeof q.topic !== 'string') return 'missing topic';
    if (!q.vignette || typeof q.vignette !== 'string') return 'missing vignette';
    if (!Array.isArray(q.options) || q.options.length < 2) return 'options must be an array of 2+ strings';
    if (typeof q.correctIndex !== 'number' || q.correctIndex < 0 || q.correctIndex >= q.options.length) return 'correctIndex out of range';
    if (!q.explanation || typeof q.explanation !== 'string') return 'missing explanation';
    return null;
  }

  // Core import routine — shared by the paste box and the file/drag-drop path.
  async function importFromText(rawText, sourceLabel) {
    const cleanResult = sanitizeJsonText(rawText);

    if (cleanResult.truncated || cleanResult.noBracket) {
      importStatus = { ok: false, msg: describeParseError(rawText, cleanResult, { message: '' }) };
      render();
      return;
    }

    let parsed;
    try {
      parsed = JSON.parse(cleanResult.cleaned);
    } catch (e) {
      importStatus = { ok: false, msg: describeParseError(rawText, cleanResult, e) };
      render();
      return;
    }

    let incoming = [];
    if (Array.isArray(parsed)) {
      // could be flat array of questions, or array of {topic, questions:[...]}
      parsed.forEach(item => {
        if (item && Array.isArray(item.questions)) {
          item.questions.forEach(q => incoming.push(Object.assign({ topic: item.topic }, q)));
        } else {
          incoming.push(item);
        }
      });
    } else if (parsed && Array.isArray(parsed.questions)) {
      parsed.questions.forEach(q => incoming.push(Object.assign({ topic: parsed.topic }, q)));
    } else {
      importStatus = { ok: false, msg: 'Expected a JSON array of question objects (see format below).' };
      render();
      return;
    }

    let added = 0, updated = 0, errors = [];
    incoming.forEach((q, idx) => {
      const err = validateQuestion(q);
      if (err) { errors.push('Item ' + (idx + 1) + ': ' + err); return; }
      q.id = qid(q); // content-based id: re-importing a file never duplicates questions or loses progress
      if (!q.block && sourceLabel) { const mm = /^(.*?)\s*Question Bank\.json$/i.exec(sourceLabel); if (mm) q.block = mm[1]; }
      const existingIdx = bank.findIndex(b => b.id === q.id);
      if (existingIdx >= 0) { bank[existingIdx] = q; updated++; }
      else { bank.push(q); added++; }
    });

    if (added || updated) await saveBank();
    selectedTopics = new Set(getTopics());

    const sourceNote = sourceLabel ? ` (from ${sourceLabel})` : '';
    if (errors.length && !added && !updated) {
      importStatus = { ok: false, msg: 'No questions imported' + sourceNote + '. ' + errors.slice(0, 3).join('; ') + (errors.length > 3 ? ' …' : '') };
    } else if (errors.length) {
      importStatus = { ok: true, msg: `Added ${added}, updated ${updated}${sourceNote}. ${errors.length} item(s) skipped (invalid).` };
      importText = '';
    } else {
      importStatus = { ok: true, msg: `Added ${added}, updated ${updated} question(s)${sourceNote}.` };
      importText = '';
    }
    importFileName = null;
    render();
  }

  /* ---------------- Actions ---------------- */

  function toggleTopic(t) {
    if (selectedTopics.has(t)) selectedTopics.delete(t); else selectedTopics.add(t);
    render();
  }
  function selectAllTopics() { visibleTopics().forEach(t => selectedTopics.add(t)); render(); }
  function selectNoneTopics() { visibleTopics().forEach(t => selectedTopics.delete(t)); render(); }

  function availableCount() {
    return filteredPool().length;
  }

  function launch(qs) {
    quizQuestions = qs;
    quizIndex = 0;
    quizAnswers = [];
    selectedOptionThisQ = null;
    locked = false;
    view = 'quiz';
    render();
    window.scrollTo(0, 0);
  }

  function startQuiz() {
    const pool = filteredPool();
    const n = Math.min(quizCount, pool.length);
    const picked = strategy === 'smart' ? smartOrder(pool) : (shuffleOn ? shuffleArr(pool) : pool);
    const chosen = picked.slice(0, n);
    launch(shuffleOn ? shuffleArr(chosen) : chosen);
  }

  // Priority: due for review (oldest first) -> never seen -> not yet due (soonest first)
  function smartOrder(pool) {
    const t0 = Date.now();
    const due = [], fresh = [], rest = [];
    pool.forEach(q => {
      const p = progress[q.id];
      if (!p) fresh.push(q); else if (p.due <= t0) due.push(q); else rest.push(q);
    });
    due.sort((x, y) => progress[x.id].due - progress[y.id].due);
    rest.sort((x, y) => progress[x.id].due - progress[y.id].due);
    return due.concat(shuffleArr(fresh), rest);
  }

  function startSmartAll(n) {
    if (!bank.length) return;
    launch(shuffleArr(smartOrder(bank).slice(0, n)));
  }
  function startDue() {
    const t0 = Date.now();
    const pool = bank.filter(q => progress[q.id] && progress[q.id].due <= t0)
                     .sort((x, y) => progress[x.id].due - progress[y.id].due).slice(0, 25);
    if (pool.length) launch(shuffleArr(pool));
  }
  function startMissedAll() {
    const pool = bank.filter(q => progress[q.id] && !progress[q.id].ok);
    if (pool.length) launch(shuffleArr(pool).slice(0, 50));
  }
  function startTopic(topic) {
    const pool = bank.filter(q => q.topic === topic);
    if (pool.length) launch(shuffleArr(smartOrder(pool).slice(0, 10)));
  }

  function retryMissed() {
    const missedIds = quizAnswers.filter(a => !a.correct).map(a => a.qId);
    const pool = bank.filter(q => missedIds.includes(q.id));
    quizQuestions = shuffleArr(pool);
    quizIndex = 0;
    quizAnswers = [];
    selectedOptionThisQ = null;
    locked = false;
    view = 'quiz';
    render();
  }

  function pickOption(i) {
    if (locked) return;
    selectedOptionThisQ = i;
    render();
  }

  function submitAnswer() {
    if (selectedOptionThisQ === null || locked) return;
    const q = quizQuestions[quizIndex];
    const correct = selectedOptionThisQ === q.correctIndex;
    quizAnswers.push({ qId: q.id, chosenIndex: selectedOptionThisQ, correct });
    recordAttempt(q, correct);
    locked = true;
    render();
  }

  function nextQuestion() {
    if (quizIndex + 1 < quizQuestions.length) {
      quizIndex++;
      selectedOptionThisQ = null;
      locked = false;
      render();
    } else {
      view = 'results';
      render();
    }
  }

  function quitQuiz() {
    if (confirm('End this quiz early? Your progress on this attempt will be lost.')) {
      view = 'home';
      render();
    }
  }

  function backToHome() {
    view = 'home';
    render();
  }

  function goManage() {
    view = 'manage';
    importStatus = null;
    render();
  }

  function toggleTopicExpand(t) {
    if (expandedTopics.has(t)) expandedTopics.delete(t); else expandedTopics.add(t);
    render();
  }
  function toggleReviewExpand(id) {
    if (expandedReview.has(id)) expandedReview.delete(id); else expandedReview.add(id);
    render();
  }

  async function doImport() {
    await importFromText(importText, null);
  }

  function handleFile(file) {
    if (!file) return;
    if (!/\.json$/i.test(file.name) && file.type !== 'application/json') {
      importStatus = { ok: false, msg: 'That file doesn\'t look like a .json file (' + file.name + '). Choose a .json question bank file.' };
      render();
      return;
    }
    importFileName = file.name;
    const reader = new FileReader();
    reader.onload = (e) => {
      importFromText(String(e.target.result), file.name);
    };
    reader.onerror = () => {
      importStatus = { ok: false, msg: 'Could not read that file — try again, or use the paste box instead.' };
      render();
    };
    reader.readAsText(file);
  }

  function exportBank() {
    const dataStr = JSON.stringify(bank, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'question-bank-export.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function deleteQuestion(id) {
    bank = bank.filter(q => q.id !== id);
    await saveBank();
    selectedTopics = new Set(getTopics());
    render();
  }

  async function clearAllQuestions() {
    if (!confirm('Delete the ENTIRE question bank? This cannot be undone.')) return;
    if (!confirm('Really sure? All questions across every topic will be permanently removed.')) return;
    bank = [];
    await saveBank();
    selectedTopics = new Set();
    render();
  }

  /* ---------------- Render ---------------- */

  function render() {
    app.innerHTML = '';
    app.appendChild(renderHeader());
    if (!storageAvailable) app.appendChild(renderStorageWarning());
    if (view === 'home') app.appendChild(renderHome());
    else if (view === 'quiz') app.appendChild(renderQuiz());
    else if (view === 'results') app.appendChild(renderResults());
    else if (view === 'manage') app.appendChild(renderManage());
    else if (view === 'progress') app.appendChild(renderProgress());
    else if (view === 'blueprint') app.appendChild(renderBlueprint());
    attachHandlers();
  }

          <br><br>
          <strong>Workaround:</strong> after importing, go to Manage Bank and click <strong>Export Bank (JSON)</strong> to save a backup file. Next time you open this page, import that exported file again — it's the same as re-doing the drag-and-drop, just a bit more often than you'd like.

  function renderResults() {
    const total = quizAnswers.length;
    const correct = quizAnswers.filter(a => a.correct).length;
    const pct = total ? Math.round((correct / total) * 100) : 0;

    const byTopic = {};
    quizQuestions.forEach((q, i) => {
      const a = quizAnswers[i];
      if (!byTopic[q.topic]) byTopic[q.topic] = { correct: 0, total: 0 };
      byTopic[q.topic].total++;
      if (a && a.correct) byTopic[q.topic].correct++;
    });

    const wrap = el(`<div></div>`);
    const card = el(`
      <div class="card">
        <div class="score-hero">
          <div class="big">${correct}/${total}</div>
          <div class="pct">${pct}% correct</div>
        </div>
        <div class="topic-breakdown" id="breakdown"></div>
        <div class="actions-row">
          <button class="btn-primary" id="new-quiz">New Quiz</button>
          ${correct < total ? '<button class="btn-secondary" id="retry-missed">Retry Missed Only</button>' : ''}
        </div>
      </div>
    `);
    const bd = card.querySelector('#breakdown');
    Object.keys(byTopic).sort().forEach(t => {

      const p = Math.round((s.correct / s.total) * 100);
      bd.appendChild(el(`

    });
    wrap.appendChild(card);

    if (correct < total) {
      const reviewCard = el(`<div class="card"><h2>Review missed questions</h2><div class="sub">Tap a question to see the full explanation.</div><div id="review-list"></div></div>`);

                  else if (oi === a.chosenIndex) cls += ' wrong-answer';
                  return `<div class="${cls}"><div class="bubble">${String.fromCharCode(65 + oi)}</div><div class="opt-text">${esc(opt)}</div></div>`;

        const file = e.target.files && e.target.files[0];
        if (file) handleFile(file);
        fileInput.value = '';
      });
      dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!dragActive) { dragActive = true; render(); }
      });
      dropzone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        if (dragActive) { dragActive = false; render(); }
      });
      dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dragActive = false;
        const file = e.dataTransfer.files && e.dataTransfer.files[0];

  /* ---------------- Cumulative review: ids, meta, progress ---------------- */

  function fnv(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h;
  }
  function qid(q) {
    return 'q' + fnv(q.topic + '|' + q.vignette).toString(36) + fnv(q.vignette.split('').reverse().join('')).toString(36).slice(0, 3);
  }
  // Re-keys every question by content and collapses exact duplicates (e.g. a file imported twice by the old engine).
  function normalizeBank() {
    const map = new Map();
    let changed = false;
    bank.forEach(q => {
      const id = qid(q);
      if (q.id !== id) { q.id = id; changed = true; }
      if (map.has(id)) changed = true;
      map.set(id, q);
    });
    bank = Array.from(map.values());
    return changed;
  }
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }

  function topicMeta(topic, q) {
    const base = TOPIC_MAP[topic] || {};
    const ov = overrides[topic] || {};
    return {
      block: base.block || (q && q.block) || 'Other / unassigned',
      system: ov.system || base.system || 'unmapped',
      discipline: ov.discipline || base.discipline || 'unmapped',
      domain: ov.domain || base.domain || 0
    };
  }
  function sysLabel(k) {
    const f = SYSTEMS.concat(SYSTEM_EXTRA).find(s => s[0] === k);
    return f ? f[1] : k;
  }
  function presentBlocks() {
    const set = new Set(bank.map(q => topicMeta(q.topic, q).block));
    const known = BLOCK_ORDER.filter(b => set.has(b));
    const other = Array.from(set).filter(b => !BLOCK_ORDER.includes(b)).sort();
    return known.concat(other);
  }

  function passesStatic(q) {
    const m = topicMeta(q.topic, q);
    if (fBlock !== 'all' && m.block !== fBlock) return false;
    if (fSystem !== 'all' && m.system !== fSystem) return false;
    if (fDiscipline !== 'all' && m.discipline !== fDiscipline) return false;
    if (fGuide !== 'all' && TOPIC_GUIDE[q.topic] !== fGuide) return false;
    return true;
  }
  function passesStatus(q) {
    if (fStatus === 'all') return true;
    const p = progress[q.id];
    if (fStatus === 'unseen') return !p;
    if (fStatus === 'missed') return !!p && !p.ok;
    if (fStatus === 'due') return !!p && p.due <= Date.now();
    return true;
  }
  function poolCounts() {
    const c = {};
    bank.forEach(q => { if (passesStatic(q) && passesStatus(q)) c[q.topic] = (c[q.topic] || 0) + 1; });
    return c;
  }
  function visibleTopics() {
    const c = poolCounts();
    return getTopics().filter(tp => c[tp] > 0);
  }
  function filteredPool() {
    return bank.filter(q => selectedTopics.has(q.topic) && passesStatic(q) && passesStatus(q));
  }

  function loadProgress() {
    try {
      const r = localStorage.getItem(PROGRESS_KEY);
      if (r) { const d = JSON.parse(r); progress = d.progress || {}; days = d.days || {}; }
    } catch (e) { progress = {}; days = {}; }
    try {
      const r = localStorage.getItem(OVERRIDE_KEY);
      if (r) overrides = JSON.parse(r) || {};
    } catch (e) { overrides = {}; }
  }
  function saveProgress() {
    if (!storageAvailable) return;
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify({ progress: progress, days: days })); }
    catch (e) { console.error('Progress save failed', e); }
  }
  function saveOverrides() {
    if (!storageAvailable) return;
    try { localStorage.setItem(OVERRIDE_KEY, JSON.stringify(overrides)); }
    catch (e) { console.error('Override save failed', e); }
  }
  function dayKey(ts) {
    const d = new Date(ts);
    const p = n => (n < 10 ? '0' : '') + n;
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  // Leitner boxes: a miss drops the question to box 0 (due immediately); each correct answer moves it up a box.
  function recordAttempt(q, correct) {
    const t0 = Date.now();
    const p = progress[q.id] || { n: 0, c: 0, box: 0 };
    p.n++;
    if (correct) p.c++;
    p.last = t0;
    p.ok = correct;
    p.box = correct ? Math.min(5, (p.box || 0) + 1) : 0;
    p.due = t0 + INTERVAL_DAYS[p.box] * 86400000;
    progress[q.id] = p;
    const k = dayKey(t0);
    const d = days[k] || [0, 0];
    d[0]++; if (correct) d[1]++;
    days[k] = d;
    saveProgress();
  }

  function exportProgress() {
    const blob = new Blob([JSON.stringify({ version: 1, progress: progress, days: days, overrides: overrides }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'quiz-progress-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function importProgressText(text) {
    try {
      const cleaned = sanitizeJsonText(text).cleaned;
      const d = JSON.parse(cleaned);
      if (!d || typeof d.progress !== 'object') throw new Error('not a progress backup');
      let merged = 0;
      Object.keys(d.progress).forEach(id => {
        const inc = d.progress[id];
        if (!progress[id] || (inc.last || 0) > (progress[id].last || 0)) { progress[id] = inc; merged++; }
      });
      Object.keys(d.days || {}).forEach(k => {
        const inc = d.days[k];
        if (!days[k] || inc[0] > days[k][0]) days[k] = inc;
      });
      Object.keys(d.overrides || {}).forEach(tp => { if (!overrides[tp]) overrides[tp] = d.overrides[tp]; });
      saveProgress(); saveOverrides();
      progStatus = { ok: true, msg: 'Merged ' + merged + ' question record(s) from the backup (newer attempt wins).' };
    } catch (e) {
      progStatus = { ok: false, msg: 'Could not read that file as a progress backup: ' + e.message };
    }
    render();
  }
  function resetProgress() {
    if (!confirm('Erase ALL progress (attempts, due dates, daily history)? Your question bank is not affected.')) return;
    if (!confirm('Really erase progress? This cannot be undone — export a backup first if unsure.')) return;
    progress = {}; days = {};
    saveProgress();
    progStatus = { ok: true, msg: 'Progress erased.' };
    render();
  }

  /* ---------------- Progress tab ---------------- */

  function accPct(c, n) { return n ? Math.round(c / n * 100) : null; }

  function renderProgress() {
    const wrap = el(`<div></div>`);
    const t0 = Date.now();
    let seen = 0, n = 0, c = 0, due = 0, missed = 0;
    const topicAgg = {}, sysAgg = {}, discAgg = {};
    const add = (o, k, p) => { const a = o[k] || (o[k] = { n: 0, c: 0, q: 0 }); a.n += p.n; a.c += p.c; a.q++; };
    bank.forEach(q => {
      const p = progress[q.id];
      if (!p) return;
      seen++; n += p.n; c += p.c;
      if (p.due <= t0) due++;
      if (!p.ok) missed++;
      const m = topicMeta(q.topic, q);
      add(topicAgg, q.topic, p); add(sysAgg, m.system, p); add(discAgg, m.discipline, p);
    });

    const firstQ = {};
    bank.forEach(q => { if (!firstQ[q.topic]) firstQ[q.topic] = q; });

    const top = el(`
      <div class="card">
        <h2>Your progress</h2>
        <div class="sub">Everything is tracked per question, across every block in your bank.</div>
        <div class="stat-strip">
          <div class="stat"><div class="num">${seen}<span style="font-size:0.9rem;color:var(--muted);"> / ${bank.length}</span></div><div class="lbl">Questions seen</div></div>
          <div class="stat"><div class="num">${n ? accPct(c, n) + '%' : '—'}</div><div class="lbl">Accuracy (${n} attempts)</div></div>
          <div class="stat"><div class="num">${due}</div><div class="lbl">Due now</div></div>
          <div class="stat"><div class="num">${missed}</div><div class="lbl">Last answer missed</div></div>
        </div>
        <div class="actions-row" style="margin-top:0;">
          <button class="btn-primary" id="start-due" ${due ? '' : 'disabled'}>Review due now${due ? ' (' + Math.min(25, due) + ')' : ''}</button>
          <button class="btn-secondary" id="start-missed" ${missed ? '' : 'disabled'}>Quiz my missed${missed ? ' (' + Math.min(50, missed) + ')' : ''}</button>
        </div>
      </div>
    `);
    wrap.appendChild(top);

    if (!n) {
      wrap.appendChild(el(`<div class="card"><div class="empty"><div class="glyph">◎</div><h3>No attempts yet</h3><p>Take a quiz and your weak topics, system breakdown and review queue show up here.</p></div></div>`));
    } else {
      // weak topics
      const weak = Object.keys(topicAgg).filter(k => topicAgg[k].n >= 3)
        .sort((a, b) => (topicAgg[a].c / topicAgg[a].n) - (topicAgg[b].c / topicAgg[b].n)).slice(0, 12);
      const weakCard = el(`<div class="card"><h2>Weakest topics</h2><div class="sub">Lowest accuracy first, topics with at least 3 attempts. “Quiz” builds a 10-question smart set from that topic.</div><div class="tbl-wrap"><table class="data"><thead><tr><th>Topic</th><th>Block</th><th>Accuracy</th><th class="num">Right / tries</th><th></th></tr></thead><tbody id="weak-body"></tbody></table></div></div>`);
      const wb = weakCard.querySelector('#weak-body');
      if (!weak.length) wb.appendChild(el(`<tr><td colspan="5" class="muted">Not enough attempts per topic yet — keep going.</td></tr>`));
      weak.forEach(k => {
        const a = topicAgg[k]; const pct = accPct(a.c, a.n);
        wb.appendChild(el(`<tr>
          <td>${esc(k)}</td>
          <td class="muted">${esc(topicMeta(k, firstQ[k]).block)}</td>
          <td><div class="meter-cell"><div class="meter"><div class="fill" style="width:${pct}%;${pct < 60 ? 'background:var(--brick);' : ''}"></div></div><span class="pct">${pct}%</span></div></td>
          <td class="num">${a.c}/${a.n}</td>
          <td style="white-space:nowrap;"><button class="mini-btn" data-quiz-topic="${escAttr(k)}">Quiz</button> ${guideMini(k)}</td>
        </tr>`));
      });
      wrap.appendChild(weakCard);

      // by system / discipline
      const breakdown = (title, agg, labelFn) => {
        const keys = Object.keys(agg).sort((a, b) => (agg[a].c / agg[a].n) - (agg[b].c / agg[b].n));
        const card = el(`<div class="card"><h2>${title}</h2><div class="tbl-wrap"><table class="data"><thead><tr><th>Name</th><th>Accuracy</th><th class="num">Right / tries</th><th class="num">Questions seen</th></tr></thead><tbody></tbody></table></div></div>`);
        const body = card.querySelector('tbody');
        keys.forEach(k => {
          const a = agg[k]; const pct = accPct(a.c, a.n);
          body.appendChild(el(`<tr><td>${esc(labelFn(k))}</td><td><div class="meter-cell"><div class="meter"><div class="fill" style="width:${pct}%;${pct < 60 ? 'background:var(--brick);' : ''}"></div></div><span class="pct">${pct}%</span></div></td><td class="num">${a.c}/${a.n}</td><td class="num">${a.q}</td></tr>`));
        });
        return card;
      };
      wrap.appendChild(breakdown('By system', sysAgg, sysLabel));
      wrap.appendChild(breakdown('By discipline', discAgg, k => k === 'unmapped' ? 'Unmapped' : k));

      // last 14 days
      const keys = [];
      for (let i = 13; i >= 0; i--) keys.push(dayKey(t0 - i * 86400000));
      const maxN = Math.max(1, ...keys.map(k => (days[k] || [0])[0]));
      const chart = el(`<div class="card"><h2>Last 14 days</h2><div class="sub">Questions answered per day.</div><div class="day-chart" id="day-chart"></div></div>`);
      const dc = chart.querySelector('#day-chart');
      keys.forEach(k => {
        const d = days[k] || [0, 0];
        const label = k.slice(5).replace('-', '/');
        dc.appendChild(el(`<div class="day-col" title="${k}: ${d[0]} answered, ${d[0] ? accPct(d[1], d[0]) : 0}% correct"><span class="day-n">${d[0] || ''}</span><div class="day-bar" style="height:${Math.round(d[0] / maxN * 70)}px;${d[0] ? '' : 'background:var(--border);'}"></div><span class="day-lbl">${label}</span></div>`));
      });
      wrap.appendChild(chart);
    }

    wrap.appendChild(el(`
      <div class="card">
        <h2>Backup &amp; transfer</h2>
        <div class="sub">Progress lives in this browser only. Export it to back it up or move it to another device, then import it there (the newer attempt wins per question).</div>
        <div class="actions-row" style="margin-top:0;">
          <button class="btn-secondary" id="prog-export">Export progress</button>
          <button class="btn-secondary" id="prog-import">Import progress</button>
          <input type="file" id="prog-file" accept=".json,application/json" style="display:none;">
        </div>
        ${progStatus ? `<div class="import-status ${progStatus.ok ? 'ok' : 'err'}">${esc(progStatus.msg)}</div>` : ''}
        <div class="danger-zone"><div class="warn">Erase all attempts, due dates and daily history. Questions stay.</div><button class="btn-danger" id="prog-reset">Reset progress</button></div>
      </div>
    `));
    return wrap;
  }

  /* ---------------- Blueprint tab ---------------- */

  function renderBlueprint() {
    const wrap = el(`<div></div>`);
    const sAgg = {}, dAgg = {};
    bank.forEach(q => {
      const m = topicMeta(q.topic, q);
      const p = progress[q.id];
      [[sAgg, m.system], [dAgg, m.domain]].forEach(pair => {
        const o = pair[0], k = pair[1];
        const a = o[k] || (o[k] = { q: 0, seen: 0, n: 0, c: 0 });
        a.q++;
        if (p) { a.seen++; a.n += p.n; a.c += p.c; }
      });
    });

    wrap.appendChild(el(`

    `));

    // Dimension 2
    const mappedTotal = SYSTEMS.reduce((s, r) => s + (sAgg[r[0]] || blank).q, 0);
    const shares = SYSTEMS.map(r => mappedTotal ? (sAgg[r[0]] || blank).q / mappedTotal * 100 : 0);
    const scale = Math.max(15, ...shares, ...SYSTEMS.map(r => r[2])) * 1.08;
    const d2 = el(`<div class="card"><h2>Dimension 2 — Clinical presentations</h2><div class="sub">${mappedTotal} of ${bank.length} questions map to a single system.</div><div class="tbl-wrap"><table class="data"><thead><tr><th>Presentation</th><th class="num">Exam %</th><th>Your bank</th><th class="num">Qs</th><th class="num">Seen</th><th class="num">Acc.</th><th>Status</th></tr></thead><tbody></tbody></table></div></div>`);
    const d2b = d2.querySelector('tbody');
    SYSTEMS.forEach((r, i) => {
      const a = sAgg[r[0]] || blank;
      const share = shares[i];
      let badge;
      if (a.q === 0) badge = '<span class="badge bad">No questions yet</span>';

    const dShares = DOMAINS.map(r => domTotal ? (dAgg[r[0]] || blank).q / domTotal * 100 : 0);
    const dScale = Math.max(15, ...dShares, ...DOMAINS.map(r => r[2])) * 1.08;
    const d1 = el(`<div class="card"><h2>Dimension 1 — Competency domains</h2><div class="sub">Approximate: each topic is assigned one domain (OMM topics → 1, exam/skills topics → 2, most science and clinical-knowledge topics → 3). Domains 4–7 are mostly tested through vignettes your science blocks don't cover yet.</div><div class="tbl-wrap"><table class="data"><thead><tr><th>Domain</th><th class="num">Exam %</th><th>Your bank</th><th class="num">Qs</th><th class="num">Seen</th><th class="num">Acc.</th></tr></thead><tbody></tbody></table></div></div>`);
    const d1b = d1.querySelector('tbody');
    DOMAINS.forEach((r, i) => {
      const a = dAgg[r[0]] || blank;
      d1b.appendChild(el(`<tr>
        <td>${r[0]}. ${esc(r[1])}</td>
        <td class="num">${r[2]}%</td>
        <td><div class="meter-cell"><div class="meter"><div class="fill" style="width:${dShares[i] / dScale * 100}%"></div><div class="tick" style="left:${r[2] / dScale * 100}%"></div></div><span class="pct">${Math.round(dShares[i])}%</span></div></td>
        <td class="num">${a.q}</td><td class="num">${a.seen}</td><td class="num">${a.n ? accPct(a.c, a.n) + '%' : '—'}</td>
      </tr>`));
    });
    if (dAgg[0]) d1b.appendChild(el(`<tr><td class="muted">Unmapped</td><td class="num muted">—</td><td class="muted">not counted above</td><td class="num">${dAgg[0].q}</td><td class="num">${dAgg[0].seen}</td><td class="num">${dAgg[0].n ? accPct(dAgg[0].c, dAgg[0].n) + '%' : '—'}</td></tr>`));
    wrap.appendChild(d1);

    wrap.appendChild(guideCoverageCard());

    // mapping editor
    const topics = getTopics();
    const firstQ = {};
    bank.forEach(q => { if (!firstQ[q.topic]) firstQ[q.topic] = q; });
    const order = presentBlocks();
    topics.sort((a, b) => {
      const ba = order.indexOf(topicMeta(a, firstQ[a]).block), bb = order.indexOf(topicMeta(b, firstQ[b]).block);
      return ba - bb || a.localeCompare(b);
    });
    const unmappedCount = topics.filter(tp => topicMeta(tp, firstQ[tp]).system === 'unmapped').length;
    const sysOpts = (cur) => SYSTEMS.concat(SYSTEM_EXTRA).map(s => `<option value="${s[0]}" ${s[0] === cur ? 'selected' : ''}>${esc(s[1])}</option>`).join('');
    const discOpts = (cur) => DISCIPLINES.concat(['unmapped']).map(d => `<option value="${escAttr(d)}" ${d === cur ? 'selected' : ''}>${d === 'unmapped' ? 'Unmapped' : esc(d)}</option>`).join('');
    const domOpts = (cur) => [[0, 'Unmapped']].concat(DOMAINS.map(d => [d[0], d[0] + '. ' + d[1]])).map(d => `<option value="${d[0]}" ${d[0] === cur ? 'selected' : ''}>${esc(d[1])}</option>`).join('');
    const editor = el(`
      <div class="card">
        <h2>Topic mapping</h2>
        <div class="sub">${unmappedCount ? `<strong style="color:var(--brick);">${unmappedCount} topic(s) are unmapped</strong> — assign them below so they count toward coverage. ` : ''}Changes apply instantly and are saved in this browser.</div>
        <details class="map-editor" id="map-details" ${mapOpen || unmappedCount ? 'open' : ''}>
          <summary>Edit mapping (${topics.length} topics)</summary>
          <div class="tbl-wrap" style="margin-top:10px;"><table class="data"><thead><tr><th>Topic</th><th>System</th><th>Discipline</th><th>Domain</th></tr></thead><tbody id="map-body"></tbody></table></div>
        </details>
      </div>
    `);
    const mb = editor.querySelector('#map-body');
    topics.forEach(tp => {
      const m = topicMeta(tp, firstQ[tp]);
      mb.appendChild(el(`<tr>
        <td>${esc(tp)}<div class="sub-tag mono" style="font-size:0.66rem;color:var(--muted);">${esc(m.block)}</div></td>
        <td><select class="sel" data-ov="system" data-topic="${escAttr(tp)}">${sysOpts(m.system)}</select></td>
        <td><select class="sel" data-ov="discipline" data-topic="${escAttr(tp)}">${discOpts(m.discipline)}</select></td>
        <td><select class="sel" data-ov="domain" data-topic="${escAttr(tp)}">${domOpts(m.domain)}</select></td>
      </tr>`));
    });
    wrap.appendChild(editor);
    return wrap;
  }

  /* ---------------- Extra event handlers ---------------- */

  function attachHandlers2() {
    const bind = (sel, ev, fn) => { const e = app.querySelector(sel); if (e) e.addEventListener(ev, fn); };
    bind('#f-block', 'change', e => { fBlock = e.target.value; render(); });
    bind('#f-system', 'change', e => { fSystem = e.target.value; render(); });
    bind('#f-disc', 'change', e => { fDiscipline = e.target.value; render(); });
    bind('#f-status', 'change', e => { fStatus = e.target.value; render(); });
    bind('#f-guide', 'change', e => { fGuide = e.target.value; render(); });
    bind('#gap-only', 'change', e => { gapOnly = e.target.checked; render(); });
    app.querySelectorAll('[data-strategy]').forEach(b => b.addEventListener('click', () => { strategy = b.getAttribute('data-strategy'); render(); }));
    app.querySelectorAll('[data-count]').forEach(b => b.addEventListener('click', () => { quizCount = parseInt(b.getAttribute('data-count'), 10); render(); }));
    bind('#smart-all', 'click', () => startSmartAll(25));
    bind('#start-due', 'click', startDue);
    bind('#start-missed', 'click', startMissedAll);
    app.querySelectorAll('[data-quiz-topic]').forEach(b => b.addEventListener('click', () => startTopic(b.getAttribute('data-quiz-topic'))));
    bind('#prog-export', 'click', exportProgress);
    bind('#prog-import', 'click', () => { const f = app.querySelector('#prog-file'); if (f) f.click(); });
    bind('#prog-file', 'change', e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => importProgressText(String(ev.target.result));
      reader.readAsText(file);
    });
    bind('#prog-reset', 'click', resetProgress);
    bind('#map-details', 'toggle', e => { mapOpen = e.target.open; });
    app.querySelectorAll('select[data-ov]').forEach(s => s.addEventListener('change', () => {
      const tp = s.getAttribute('data-topic'), field = s.getAttribute('data-ov');
      const ov = overrides[tp] || (overrides[tp] = {});
      ov[field] = field === 'domain' ? parseInt(s.value, 10) : s.value;
      saveOverrides();
      mapOpen = true;
      render();
    }));
  }


  /* ---------------- Study-guide links & coverage ---------------- */
  function guideHref(h) { return h.split('/').map(encodeURIComponent).join('/'); }
  function guideFor(topic) {
    const h = TOPIC_GUIDE[topic];
    if (!h) return null;
    const g = GUIDES.find(x => x[0] === h);
    return g ? { href: guideHref(h), title: g[1] } : null;
  }
  function guideLinkHtml(topic) {
    const g = guideFor(topic);
    return g ? `<div class="guide-link"><a href="${escAttr(g.href)}" target="_blank" rel="noopener">Review in guide: ${esc(g.title)} ↗</a></div>` : '';
  }
  function guideMini(topic) {
    const g = guideFor(topic);
    return g ? `<a class="mini-link" href="${escAttr(g.href)}" target="_blank" rel="noopener">Guide ↗</a>` : '';
  }
  function guidesWithQuestions() {
    const have = new Set(bank.map(q => TOPIC_GUIDE[q.topic]).filter(Boolean));
    return GUIDES.filter(g => have.has(g[0]));
  }
  function guideCoverageCard() {
    const agg = {};
    bank.forEach(q => {
      const h = TOPIC_GUIDE[q.topic];
      if (!h) return;
      const a = agg[h] || (agg[h] = { q: 0, seen: 0, n: 0, c: 0 });
      a.q++;
      const p = progress[q.id];
      if (p) { a.seen++; a.n += p.n; a.c += p.c; }
    });
    const lecture = GUIDES.filter(g => !g[3]);
    const covered = lecture.filter(g => agg[g[0]]).length;
    const noGuide = Array.from(new Set(bank.filter(q => !TOPIC_GUIDE[q.topic]).map(q => q.topic)));
    const card = el(`
      <div class="card">
        <h2>Study-guide coverage</h2>
        <div class="sub"><strong>${covered} of ${lecture.length}</strong> lecture guides have questions in your bank. Cheat sheets, master tables and tools are listed as references and don't need their own questions.${noGuide.length ? ` ${noGuide.length} topic(s) aren't linked to a guide yet: ${esc(noGuide.join(', '))}.` : ''}</div>
        <label class="toggle-row" style="margin-bottom:12px;cursor:pointer;"><input type="checkbox" id="gap-only" ${gapOnly ? 'checked' : ''}> <span>Only show lecture guides with no questions yet</span></label>
        <div class="tbl-wrap"><table class="data"><thead><tr><th>Guide</th><th class="num">Qs</th><th class="num">Seen</th><th class="num">Acc.</th><th>Status</th></tr></thead><tbody></tbody></table></div>
      </div>`);
    const body = card.querySelector('tbody');
    let lastGroup = null, shown = 0;
    GUIDES.forEach(g => {
      const a = agg[g[0]] || { q: 0, seen: 0, n: 0, c: 0 };
      if (gapOnly && (g[3] || a.q)) return;
      if (g[2] !== lastGroup) { body.appendChild(el(`<tr class="grp"><td colspan="5">${esc(g[2])}</td></tr>`)); lastGroup = g[2]; }
      let badge;
      if (a.q) badge = '<span class="badge ok">Has questions</span>';
      else if (g[3]) badge = '<span class="badge ref">Reference</span>';
      else badge = '<span class="badge bad">No questions yet</span>';
      body.appendChild(el(`<tr>
        <td><a href="${escAttr(guideHref(g[0]))}" target="_blank" rel="noopener" style="color:var(--forest-dark);">${esc(g[1])}</a></td>
        <td class="num">${a.q || '—'}</td><td class="num">${a.q ? a.seen : '—'}</td><td class="num">${a.n ? accPct(a.c, a.n) + '%' : '—'}</td><td>${badge}</td>
      </tr>`));
      shown++;
    });
    if (!shown) body.appendChild(el(`<tr><td colspan="5" class="muted">Every lecture guide has questions.</td></tr>`));
    return card;
  }

  loadBank();
})();
</script>
</body>
</html>
