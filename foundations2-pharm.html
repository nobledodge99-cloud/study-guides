<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pharmacology Study Guide</title>
<style>
  :root{
    --ink:#1b2b26;
    --paper:#f7f5ef;
    --panel:#ffffff;
    --line:#dcd6c6;
    --accent:#3a6b5c;
    --accent-dim:#e7efe9;
    --wrong:#a63d40;
    --wrong-dim:#f7e6e6;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --serif: 'Source Serif 4', Georgia, serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.55;
    padding:0 0 80px 0;
  }
  header.masthead{
    border-bottom:3px solid var(--ink);
    padding:28px 24px 18px;
    max-width:900px;
    margin:0 auto;
  }
  header.masthead .kicker{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent);
  }
  header.masthead h1{
    font-size:2.1rem;
    margin:.15em 0 .1em;
    letter-spacing:-.01em;
  }
  header.masthead .sub{
    font-family:var(--mono);
    font-size:12.5px;
    color:#5c5c52;
  }
  nav#toc{
    max-width:900px;
    margin:20px auto 0;
    padding:0 24px;
  }
  nav#toc .toc-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#8a8578;
    margin-bottom:6px;
  }
  nav#toc ol{
    margin:0;
    padding-left:1.2em;
    font-family:var(--mono);
    font-size:13.5px;
  }
  nav#toc .toc-link{color:var(--ink); text-decoration:none; border-bottom:1px dotted var(--accent); cursor:pointer;}
  nav#toc .toc-link:hover{color:var(--accent);}

  main{max-width:900px; margin:0 auto; padding:0 24px;}

  section.lecture{
    margin-top:48px;
    padding-top:8px;
  }
  section.lecture > h2{
    font-size:1.5rem;
    border-bottom:2px solid var(--ink);
    padding-bottom:8px;
    margin-bottom:4px;
  }
  section.lecture > .lecture-meta{
    font-family:var(--mono);
    font-size:11.5px;
    color:#8a8578;
    margin-bottom:22px;
  }

  article.topic{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:22px 24px 24px;
    margin-bottom:22px;
    position:relative;
  }
  article.topic .topic-num{
    font-family:var(--mono);
    font-size:11px;
    color:var(--accent);
    letter-spacing:.08em;
  }
  article.topic h3{
    margin:2px 0 4px;
    font-size:1.15rem;
  }
  article.topic .flag{
    display:inline-block;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:var(--accent-dim);
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:20px;
    padding:2px 9px;
    margin-bottom:10px;
  }
  article.topic p.body{
    font-size:15.5px;
    margin:8px 0 16px;
  }
  article.topic ul.body-list{
    margin:8px 0 16px;
    padding-left:1.3em;
    font-size:15.5px;
  }
  article.topic ul.body-list li{margin-bottom:4px;}
  article.topic strong.term{color:var(--accent);}

  .formula{
    font-family:var(--mono);
    font-size:15px;
    background:var(--accent-dim);
    border-left:3px solid var(--accent);
    padding:9px 14px;
    margin:10px 0 16px;
    border-radius:0 4px 4px 0;
    color:var(--ink);
  }
  .formula .fx-label{
    color:var(--accent);
    font-weight:700;
    margin-right:6px;
  }

  table.data-table{
    width:100%;
    border-collapse:collapse;
    margin:10px 0 18px;
    font-size:14px;
  }
  table.data-table caption{
    text-align:left;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#8a8578;
    margin-bottom:6px;
  }
  table.data-table th, table.data-table td{
    border:1px solid var(--line);
    padding:7px 10px;
    text-align:left;
    vertical-align:top;
  }
  table.data-table th{
    background:var(--accent-dim);
    color:var(--accent);
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
  }
  table.data-table tr:nth-child(even) td{background:#fbfaf6;}

  .qs-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:#8a8578;
    border-top:1px dashed var(--line);
    padding-top:14px;
    margin-top:4px;
    margin-bottom:12px;
  }

  .question{
    margin-bottom:18px;
  }
  .question:last-child{margin-bottom:0;}
  .qtext{
    font-size:15px;
    margin-bottom:8px;
    font-weight:600;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:9px 12px;
    font-family:var(--serif);
    font-size:14.5px;
    color:var(--ink);
    cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  .opt:hover:not(:disabled){
    border-color:var(--accent);
  }
  .opt .bubble{
    flex:0 0 auto;
    width:16px;
    height:16px;
    border-radius:50%;
    border:1.5px solid #9a9587;
    background:#fff;
  }
  .opt.correct{
    background:var(--accent-dim);
    border-color:var(--accent);
  }
  .opt.correct .bubble{
    background:var(--accent);
    border-color:var(--accent);
  }
  .opt.incorrect{
    background:var(--wrong-dim);
    border-color:var(--wrong);
  }
  .opt.incorrect .bubble{
    background:var(--wrong);
    border-color:var(--wrong);
  }
  .opt:disabled{cursor:default;}
  .feedback{
    font-family:var(--mono);
    font-size:12.5px;
    margin-top:7px;
    min-height:1.2em;
  }
  .feedback.correct{color:var(--accent);}
  .feedback.incorrect{color:var(--wrong);}

  footer.eod{
    max-width:900px;
    margin:56px auto 0;
    padding:18px 24px 0;
    border-top:1px solid var(--line);
    font-family:var(--mono);
    font-size:11.5px;
    color:#8a8578;
  }

  /* ---- Side tab navigation ---- */
  #side-toggle{
    position:fixed;
    top:50%;
    right:0;
    transform:translateY(-50%);
    z-index:20;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    padding:14px 8px;
    writing-mode:vertical-rl;
    text-orientation:mixed;
    cursor:pointer;
    border-radius:6px 0 0 6px;
  }
  #side-toggle:hover{background:var(--accent);}

  #side-nav{
    position:fixed;
    top:0;
    right:0;
    height:100%;
    width:300px;
    background:var(--panel);
    border-left:1px solid var(--line);
    box-shadow:-6px 0 18px rgba(0,0,0,.06);
    transform:translateX(100%);
    transition:transform .22s ease;
    z-index:19;
    overflow-y:auto;
    padding:22px 0 40px;
  }
  #side-nav.open{transform:translateX(0);}

  #side-nav .side-head{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#8a8578;
    padding:0 20px 12px;
    border-bottom:1px solid var(--line);
    margin-bottom:6px;
  }
  #side-nav .side-lecture-label{
    font-family:var(--mono);
    font-size:11.5px;
    font-weight:700;
    color:var(--ink);
    padding:14px 20px 4px;
  }
  #side-nav .side-link{
    display:block;
    padding:6px 20px 6px 28px;
    font-size:13px;
    color:#4a483f;
    text-decoration:none;
    border-left:2px solid transparent;
    cursor:pointer;
  }
  #side-nav .side-link:hover{
    color:var(--accent);
    background:var(--accent-dim);
  }
  #side-nav .side-link.active{
    color:var(--accent);
    border-left-color:var(--accent);
    font-weight:600;
    background:var(--accent-dim);
  }

  #side-scrim{
    position:fixed;
    inset:0;
    background:rgba(27,43,38,.15);
    z-index:18;
    display:none;
  }
  #side-scrim.open{display:block;}

  @media (max-width:640px){
    #side-nav{width:82%;}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="kicker">Running Course Document</div>
  <h1>Pharmacology Study Guide</h1>
  <div class="sub">Updated lecture by lecture — click an answer choice to check yourself</div>
</header>

<nav id="toc">
  <div class="toc-label">Contents</div>
  <ol id="toc-list"></ol>
</nav>

<main id="lectures"></main>

<footer class="eod">Send the next lecture's guide to add another section.</footer>

<button id="side-toggle" aria-label="Toggle section navigation">Sections</button>
<div id="side-scrim"></div>
<nav id="side-nav">
  <div class="side-head">Jump to a section</div>
  <div id="side-nav-body"></div>
</nav>

<script>
// ---------------------------------------------------------------
// DATA: one object per lecture. Add new lectures by pushing a new
// object onto this array with the same shape.
// ---------------------------------------------------------------
const LECTURES = [
  {
    id: "lec1",
    title: "General Principles of Pharmacology",
    meta: "Lecture 1 — Dr. Waller",
    topics: [
      {
        num: "1",
        title: "Drug Nomenclature: Generic vs. Brand Names",
        flag: "USMLE / COMLEX — testable",
        html: `<p class="body">Every drug has one generic (nonproprietary) name but often many brand/trade names. Pharmacology faculty and all board exams (USMLE/COMLEX) use generic names; practicing clinicians often use brand names instead. A single generic ingredient (e.g., acetaminophen) can appear in dozens of differently-branded OTC products, which is a real-world overdose risk if patients don't realize they're doubling up.</p>`,
        questions: [
          {
            q: "On board exams, drugs are almost always referred to by their _____ name.",
            options: ["Brand name", "Generic name", "Chemical name", "Trade name"],
            correct: 1
          },
          {
            q: "Tylenol, Panadol, and FeverAll all share which generic ingredient?",
            options: ["Ibuprofen", "Aspirin", "Acetaminophen (paracetamol)", "Naproxen"],
            correct: 2
          },
          {
            q: "Pseudoephedrine is the generic name for Sudafed.",
            options: ["True", "False"],
            correct: 0
          }
        ]
      },
      {
        num: "2",
        title: "Core Definitions: Pharmacology, Toxicology, PK vs. PD",
        html: `<p class="body">Pharmacology is the study of substances that interact with living systems through chemical processes; medical pharmacology specifically covers substances used to prevent, diagnose, and treat disease. Toxicology is the branch dealing with undesirable/harmful effects of chemicals. Medical pharmacology splits into two domains:</p>
        <ul class="body-list">
          <li><strong class="term">Pharmacokinetics (PK)</strong> — "what the body does to the drug": Absorption, Distribution, Metabolism, Excretion (ADME).</li>
          <li><strong class="term">Pharmacodynamics (PD)</strong> — "what the drug does to the body": receptor interactions, mechanism of action, therapeutic effect.</li>
        </ul>
        <p class="body">PK and PD intersect at the drug concentration achieved at the receptor/site of action.</p>`,
        questions: [
          {
            q: "Which term means \u201cwhat the body does to the drug\u201d?",
            options: ["Pharmacodynamics", "Toxicology", "Pharmacokinetics", "Biotransformation"],
            correct: 2
          },
          {
            q: "Which term means \u201cwhat the drug does to the body\u201d?",
            options: ["Pharmacokinetics", "Pharmacodynamics", "Pharmacognosy", "Posology"],
            correct: 1
          },
          {
            q: "What do the four letters in ADME stand for?",
            options: [
              "Absorption, Distribution, Metabolism, Excretion",
              "Activation, Diffusion, Metabolism, Elimination",
              "Absorption, Delivery, Modification, Excretion",
              "Absorption, Distribution, Modification, Elimination"
            ],
            correct: 0
          },
          {
            q: "Where do PK and PD conceptually \u201cmeet\u201d?",
            options: [
              "In the liver during first-pass metabolism",
              "At the drug concentration at the site of action/receptor",
              "At the moment of drug excretion",
              "During absorption in the GI tract"
            ],
            correct: 1
          }
        ]
      },
      {
        num: "3",
        title: "Case Study Framework",
        flag: "recurring example — used in upcoming lectures",
        html: `<p class="body">3-year-old male hospitalized for bacterial pneumonia, with asthma and Type 1 diabetes, on:</p>
        <ul class="body-list">
          <li>IV ampicillin (weak acid, pKa 2.5)</li>
          <li>SC insulin (small protein, ~5.8 kDa)</li>
          <li>Inhaled/nebulized albuterol (weak base, pKa 9.3)</li>
          <li>Oral dexamethasone (corticosteroid)</li>
          <li>Oral acetaminophen (weak acid, pKa 9.5)</li>
        </ul>
        <p class="body">Note which properties are given for each drug since these drive absorption/distribution concepts in upcoming pharmacokinetics lectures.</p>`,
        questions: [
          {
            q: "Which drug in the case is described as a weak base?",
            options: ["Ampicillin", "Acetaminophen", "Albuterol (pKa 9.3)", "Insulin"],
            correct: 2
          },
          {
            q: "Which two drugs in the case are described as weak acids?",
            options: [
              "Ampicillin and acetaminophen",
              "Albuterol and dexamethasone",
              "Insulin and ampicillin",
              "Acetaminophen and albuterol"
            ],
            correct: 0
          },
          {
            q: "Why might molecular weight matter for insulin's route of administration?",
            options: [
              "It's too large to fit in an oral capsule",
              "As a small protein, it would be degraded in the GI tract, so it's given parenterally (SC) instead",
              "It reacts with stomach acid to form a toxic byproduct",
              "It has no bearing on route of administration"
            ],
            correct: 1
          }
        ]
      },
      {
        num: "4",
        title: "Routes of Drug Administration vs. Dosage Formulation",
        html: `<ul class="body-list">
          <li><strong class="term">Enteral:</strong> via GI tract — oral, rectal, sublingual. Oral (PO) is most common. PO = "per os," Latin for "by way of the opening" (mouth).</li>
          <li><strong class="term">Parenteral:</strong> by injection — IV, IM, SC, intradermal.</li>
          <li><strong class="term">Local routes:</strong> topical, transdermal, inhalation, nasal, vaginal, eye drops, epidural, otic.</li>
        </ul>
        <p class="body"><strong class="term">Key distinction:</strong> route of administration is not the same as dosage formulation. A dosage form is the physical form the drug is manufactured/given in (tablet, capsule, powder, solution, patch, ointment, etc.), and one drug can exist in multiple formulations across multiple routes.</p>`,
        questions: [
          {
            q: "What does \u201cPO\u201d stand for, and what does it mean?",
            options: [
              "Post-operative — given after surgery",
              "Per os — by way of the mouth",
              "Parenteral only — given by injection",
              "Prior order — given as previously prescribed"
            ],
            correct: 1
          },
          {
            q: "Which of the following is a parenteral route?",
            options: ["Oral", "Sublingual", "Intramuscular (IM)", "Rectal"],
            correct: 2
          },
          {
            q: "Route of administration and dosage form are interchangeable terms.",
            options: [
              "True",
              "False — route is how/where it's given; dosage form is the physical form"
            ],
            correct: 1
          }
        ]
      },
      {
        num: "5",
        title: "Pharmacodynamics: Receptor Theory & Key Terms",
        html: `<p class="body">Most receptors sit on the external cell membrane (though some drugs cross membranes to reach intracellular targets). Most drug-receptor bonds are reversible ionic bonds — effect rises and falls with drug concentration. Covalent bonds are rare and irreversible. Only free (unbound) drug can interact with receptors — protein-bound drug is inactive/unavailable for binding.</p>
        <ul class="body-list">
          <li><strong class="term">Potency:</strong> least amount of drug required to produce a response.</li>
          <li><strong class="term">Efficacy:</strong> maximum magnitude of response.</li>
          <li><strong class="term">Margin of Safety:</strong> difference between toxic dose and effective dose.</li>
          <li><strong class="term">Therapeutic Index (TI)</strong> = Toxic Dose ÷ Effective Dose.</li>
        </ul>`,
        questions: [
          {
            q: "Which best defines \u201cpotency\u201d?",
            options: [
              "The maximum response a drug can achieve",
              "The least amount of drug required to produce a response",
              "The ratio of toxic dose to effective dose",
              "The speed at which a drug takes effect"
            ],
            correct: 1
          },
          {
            q: "How is Therapeutic Index calculated?",
            options: [
              "Effective Dose \u00f7 Toxic Dose",
              "Toxic Dose \u00f7 Effective Dose",
              "Toxic Dose \u2212 Effective Dose",
              "Effective Dose \u00d7 Potency"
            ],
            correct: 1
          },
          {
            q: "Why can't protein-bound drug produce an effect?",
            options: [
              "Protein binding destroys the drug molecule",
              "Only free/unbound drug can bind receptors",
              "Bound drug is immediately excreted",
              "Bound drug converts to an inactive metabolite"
            ],
            correct: 1
          },
          {
            q: "Which type of drug-receptor bond is most common?",
            options: [
              "Covalent (irreversible)",
              "Ionic (reversible)",
              "Hydrogen bonding only",
              "Van der Waals forces only"
            ],
            correct: 1
          }
        ]
      },
      {
        num: "6",
        title: "Terminating Drug Action",
        html: `<p class="body">Effect can end because the drug dissociates from the receptor. In other cases, effect persists after dissociation and instead ends via redistribution away from the site of action — classic example: general anesthetics, whose effect terminates when the drug redistributes away from the CNS (not necessarily when it's eliminated), which is why continuous administration is required.</p>`,
        questions: [
          {
            q: "Why must general anesthetics be given continuously?",
            options: [
              "They are metabolized instantly by the liver",
              "Once stopped, the drug redistributes away from the CNS, ending the effect",
              "Patients build tolerance within minutes",
              "They bind covalently and need to be replenished"
            ],
            correct: 1
          },
          {
            q: "Which of these is a general mechanism that terminates drug action?",
            options: [
              "Redistribution away from the site of action",
              "Increasing plasma protein levels",
              "Renal vasodilation",
              "Receptor upregulation"
            ],
            correct: 0
          }
        ]
      },
      {
        num: "7",
        title: "Drug Metabolism / Biotransformation",
        html: `<p class="body">Primary purpose: inactivate drugs and make them more water-soluble so the kidney can excrete them. The liver is the major organ of biotransformation (though metabolism occurs in nearly all tissues).</p>
        <ul class="body-list">
          <li><strong class="term">Phase I:</strong> oxidation, reduction, and/or hydrolysis — may activate, leave unchanged, or (most often) inactivate the drug.</li>
          <li><strong class="term">Phase II:</strong> conjugation reactions — produce water-soluble conjugated products, usually inactive (some drugs skip Phase I and go straight to Phase II).</li>
          <li>Track whether the parent drug or metabolite is active/inactive and/or toxic.</li>
          <li><strong class="term">Prodrug:</strong> an inactive compound metabolized into its active form — example: levodopa \u2192 dopamine (converted in the brain).</li>
        </ul>`,
        questions: [
          {
            q: "What's the primary purpose of biotransformation?",
            options: [
              "Increase lipid solubility for CNS penetration",
              "Inactivate the drug and increase water solubility for renal excretion",
              "Activate every drug into a more potent form",
              "Bind the drug irreversibly to plasma proteins"
            ],
            correct: 1
          },
          {
            q: "Which organ is the major site of drug metabolism?",
            options: ["Kidney", "Liver", "Spleen", "Pancreas"],
            correct: 1
          },
          {
            q: "What is a \u201cprodrug\u201d? (lecture example: levodopa \u2192 dopamine)",
            options: [
              "A drug that is active in its administered form",
              "A drug that only works in combination with another drug",
              "An inactive compound metabolized into its active form",
              "A drug that is excreted unchanged"
            ],
            correct: 2
          },
          {
            q: "What reaction types define Phase I vs. Phase II metabolism?",
            options: [
              "Phase I = conjugation; Phase II = oxidation/reduction/hydrolysis",
              "Phase I = oxidation/reduction/hydrolysis; Phase II = conjugation",
              "Phase I = filtration; Phase II = secretion",
              "Phase I = absorption; Phase II = distribution"
            ],
            correct: 1
          },
          {
            q: "Conjugated (Phase II) products are usually still active.",
            options: [
              "True",
              "False — usually inactive"
            ],
            correct: 1
          }
        ]
      },
      {
        num: "8",
        title: "Elimination Routes",
        html: `<p class="body">Kidney = most important organ for drug excretion. Other routes: lungs (expired air), liver (bile\u2192feces), sweat, tears, saliva, breast milk. Renal elimination has three components:</p>
        <ul class="body-list">
          <li><strong class="term">Glomerular filtration</strong> — low MW and/or ionized drugs filter readily; high MW or protein-bound drugs are NOT filtered.</li>
          <li><strong class="term">Active tubular secretion</strong> — some weak acids/bases are actively transported into urine from the proximal tubule.</li>
          <li><strong class="term">Passive tubular reabsorption</strong> — un-ionized, lipophilic drugs are reabsorbed back into circulation (resisting elimination); ionized/lipid-insoluble drugs resist reabsorption and stay in urine.</li>
        </ul>
        <p class="body">Clinically emphasized: patients with renal dysfunction may fail to excrete drugs normally, risking drug accumulation/toxicity.</p>`,
        questions: [
          {
            q: "What is the single most important route of drug elimination?",
            options: ["Hepatic (bile)", "Renal (kidney) excretion", "Pulmonary (expired air)", "Sweat and saliva"],
            correct: 1
          },
          {
            q: "Which drugs are poorly filtered at the glomerulus?",
            options: [
              "Low molecular weight, ionized drugs",
              "High molecular weight and/or highly protein-bound drugs",
              "Un-ionized lipophilic drugs only",
              "All drugs are filtered equally"
            ],
            correct: 1
          },
          {
            q: "Which properties favor tubular reabsorption (resisting elimination)?",
            options: [
              "Ionized and lipid-insoluble",
              "High molecular weight",
              "Un-ionized and lipophilic",
              "Actively secreted"
            ],
            correct: 2
          },
          {
            q: "Why are renal dysfunction patients at higher risk during drug therapy?",
            options: [
              "Increased hepatic metabolism causes drug deficiency",
              "Impaired excretion leads to drug accumulation and toxicity",
              "They absorb drugs more slowly",
              "They have increased plasma protein binding"
            ],
            correct: 1
          },
          {
            q: "Which three processes govern renal elimination?",
            options: [
              "Absorption, distribution, metabolism",
              "Glomerular filtration, active tubular secretion, passive tubular reabsorption",
              "Oxidation, reduction, conjugation",
              "Filtration, dialysis, excretion"
            ],
            correct: 1
          }
        ]
      }
    ]
  },
  {
    id: "lec2",
    title: "Pharmacodynamics Part I",
    meta: "Lecture 2 — Dr. Waller",
    topics: [
      {

        title: "Introduction: Pharmacogenetics vs. Pharmacogenomics",
        html: `<p class="body">Pharmacogenomics is the study of the role of inherited and acquired genetic variation on drug response.</p>
        <p class="body">Two individuals of similar weight receiving the same drug dose may have up to a 1000-fold difference in resulting plasma concentrations. Many factors influence individual drug response — age, sex, disease state (e.g., renal impairment), drug-drug interactions, drug-food interactions, and pregnancy — but genetics is a major and often underappreciated contributor.</p>
        <ul class="body-list">
          <li><strong class="term">Pharmacogenetics</strong> focuses on individual candidate genes. The goal is to identify gene markers that affect drug metabolism, distribution, receptor targets, and biologic effects, addressing the genetic contribution to individual variability in drug therapy.</li>
          <li><strong class="term">Pharmacogenomics</strong> focuses on the impact of variation across the entire human genome sequence on disease pathogenesis and response to drug therapy. More than one genetic variant may contribute to variation in drug response. The goal is to use genetic information to guide individualized drug and dosing selection ("personalized medicine," "precision medicine," "genome medicine"), theoretically improving efficacy and decreasing toxicity.</li>
        </ul>
        <p class="body">Genome-wide association (GWA) studies have identified hundreds of thousands of genetic variants that underlie variation in therapeutic and adverse drug responses. Polymorphisms have been identified in genes encoding drug-metabolizing enzymes, drug transporters, human leukocyte antigen (HLA) loci, cytokines, and various other proteins.</p>
        <p class="body">The terms pharmacogenetics and pharmacogenomics are often used interchangeably in practice.</p>

        title: "Effects on Pharmacokinetics: Phase I Metabolism and CYP450 Polymorphisms",
        html: `<p class="body">Recall the two phases of xenobiotic metabolism: Phase I (addition of a polar group via oxidation, reduction, or hydrolysis, predominantly catalyzed by cytochrome P450 [CYP450] enzymes) and Phase II (further conjugation — e.g., glucuronidation, methylation — to more readily excretable, hydrophilic compounds).</p>
        <p class="body">Phase I CYP enzymes are involved in the biotransformation of more than 75% of prescription drugs. Polymorphisms in these enzymes may alter drug levels, which in turn alters response to many drugs. Metabolic phenotypes are commonly described as ultra-rapid, extensive (normal), or poor metabolizers, and may contribute to excessive, diminished, or absent metabolism.</p>
        <p class="body">The clinical impact of a given genotype depends on whether the parent drug requires biotransformation for inactivation/elimination or for activation:</p>
        <ul class="body-list">
          <li><strong class="term">Active drug requiring biotransformation for inactivation/elimination:</strong> poor metabolizers may accumulate toxic drug levels and experience side effects, while ultra-rapid metabolizers may be undertreated at recommended doses</li>
          <li><strong class="term">Inactive prodrug requiring biotransformation for activity:</strong> poor metabolizers may not achieve sufficient active metabolite levels for a therapeutic effect</li>
        </ul>
        <p class="body">Genetic variation arises from single-nucleotide polymorphisms, insertions, deletions, or duplications of DNA sequences (over 90% of human genes contain at least one SNP). Star (*) allele nomenclature describes specific sequence variants: *1 denotes the wild-type/normal-functioning allele, while *2, *3, etc. denote variants that may be normal, decreased, increased, or non-functional in activity. Allele frequencies vary across populations.</p>

// IN-PAGE NAVIGATION HELPER (scrolls within the document; never
// triggers a browser navigation/new-tab, unlike native <a href="#...">
// activation in some sandboxed viewers)
// ---------------------------------------------------------------
function goToSection(id){
  const target = document.getElementById(id);
  if (!target) return;
  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// RENDER
// ---------------------------------------------------------------
const lecturesEl = document.getElementById('lectures');
const tocEl = document.getElementById('toc-list');

LECTURES.forEach((lec) => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="toc-link" role="link" tabindex="0">${lec.title} (${lec.meta})</span>`;
  const tocLinkEl = li.querySelector('.toc-link');
  tocLinkEl.addEventListener('click', () => goToSection(lec.id));
  tocLinkEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToSection(lec.id); }
  });
  tocEl.appendChild(li);

  const section = document.createElement('section');
  section.className = 'lecture';
  section.id = lec.id;
  section.innerHTML = `<h2>${lec.title}</h2><div class="lecture-meta">${lec.meta}</div>`;

  lec.topics.forEach((topic) => {
    const topicId = `${lec.id}-sec${topic.num}`;
    const art = document.createElement('article');
    art.className = 'topic';
    art.id = topicId;
    art.innerHTML = `
      <div class="topic-num">SECTION ${topic.num}</div>
      <h3>${topic.title}</h3>
      ${topic.flag ? `<div class="flag">${topic.flag}</div>` : ``}
      ${topic.html}
      <div class="qs-label">Practice Questions</div>
      <div class="questions"></div>
    `;
    const qContainer = art.querySelector('.questions');

    topic.questions.forEach((qData, qIdx) => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      const qId = `${lec.id}-${topic.num}-${qIdx}`;
      qDiv.innerHTML = `
        <div class="qtext">${qIdx + 1}. ${qData.q}</div>
        <div class="options" id="opts-${qId}"></div>
        <div class="feedback" id="fb-${qId}"></div>
      `;
      const optsDiv = qDiv.querySelector('.options');

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerHTML = `<span class="bubble"></span><span>${optText}</span>`;
        btn.addEventListener('click', () => {
          const allBtns = optsDiv.querySelectorAll('.opt');
          const fb = document.getElementById(`fb-${qId}`);
          if (optsDiv.dataset.answered === 'true') return;
          optsDiv.dataset.answered = 'true';
          allBtns.forEach((b, i) => {
            b.disabled = true;
            if (i === qData.correct) b.classList.add('correct');
          });
          if (optIdx === qData.correct) {
            btn.classList.add('correct');
            fb.textContent = 'Correct.';
            fb.className = 'feedback correct';
          } else {
            btn.classList.add('incorrect');
            fb.textContent = `Incorrect — correct answer: ${qData.options[qData.correct]}`;
            fb.className = 'feedback incorrect';
          }
        });
        optsDiv.appendChild(btn);
      });

      qContainer.appendChild(qDiv);
    });

    section.appendChild(art);
  });

  lecturesEl.appendChild(section);
});

// ---------------------------------------------------------------
// SIDE NAV: build links to every mini-section, wire toggle + scrollspy
// ---------------------------------------------------------------
const sideNavBody = document.getElementById('side-nav-body');
const sideNav = document.getElementById('side-nav');
const sideToggle = document.getElementById('side-toggle');
const sideScrim = document.getElementById('side-scrim');

const sideLinks = [];
LECTURES.forEach((lec) => {
  const label = document.createElement('div');
  label.className = 'side-lecture-label';
  label.textContent = lec.title;
  sideNavBody.appendChild(label);

  lec.topics.forEach((topic) => {
    const topicId = `${lec.id}-sec${topic.num}`;
    const a = document.createElement('span');
    a.className = 'side-link';
    a.setAttribute('role', 'link');
    a.setAttribute('tabindex', '0');
    a.textContent = `${topic.num}. ${topic.title}`;
    a.addEventListener('click', () => {
      closeSideNav();
      goToSection(topicId);
    });
    a.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        closeSideNav();
        goToSection(topicId);
      }
    });
    sideNavBody.appendChild(a);
    sideLinks.push({ id: topicId, el: a });
  });
});

function openSideNav(){
  sideNav.classList.add('open');
  sideScrim.classList.add('open');
}
function closeSideNav(){
  sideNav.classList.remove('open');
  sideScrim.classList.remove('open');
}
sideToggle.addEventListener('click', () => {
  sideNav.classList.contains('open') ? closeSideNav() : openSideNav();
});
sideScrim.addEventListener('click', closeSideNav);

// Highlight the link for whichever section is currently in view
const observer = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting){
      const match = sideLinks.find(l => l.id === entry.target.id);
      if (match){
        sideLinks.forEach(l => l.el.classList.remove('active'));
        match.el.classList.add('active');
      }
    }
  });
}, { rootMargin: '-15% 0px -70% 0px' });

sideLinks.forEach(l => {
  const el = document.getElementById(l.id);
  if (el) observer.observe(el);
});
</script>
