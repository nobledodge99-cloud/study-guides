<style>
  :root {
    --cream:#faf6ec; --surface:#fffdf8; --forest-dark:#2f5233; --forest:#3f7d52; --forest-light:#e8f0e6;
    --border:#ddd5c0; --ink:#2a2a22; --muted:#726f5f; --brick:#b3441e; --brick-light:#f5e6df; --gold:#ab7d2c;
    --shadow:0 1px 2px rgba(47,82,51,0.06), 0 2px 8px rgba(47,82,51,0.05);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:'Lora',Georgia,serif; -webkit-font-smoothing:antialiased; }
  .mono { font-family:'IBM Plex Mono',ui-monospace,monospace; letter-spacing:0.02em; }
  .back-btn { position:fixed; top:18px; left:18px; z-index:1000; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--forest-dark); text-decoration:none; border:1px solid var(--border); padding:8px 12px; border-radius:6px; background:var(--forest-light); box-shadow:var(--shadow); }
  .back-btn:hover { background:#dcebd9; }
  #app { max-width:1180px; margin:0 auto; padding:68px 20px 80px; }
  header.top { border-bottom:2px solid var(--forest-dark); padding-bottom:14px; margin-bottom:22px; }
  header.top h1 { margin:0; font-size:1.6rem; color:var(--forest-dark); letter-spacing:-0.01em; }
  header.top .tag { margin-top:3px; font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.12em; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px 22px; box-shadow:var(--shadow); margin-bottom:18px; }
  .controls { display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row label { display:flex; flex-direction:column; gap:4px; font-family:'IBM Plex Mono',monospace; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); min-width:0; flex:1 1 170px; }
  input[type=search], select { font-family:'Lora',serif; font-size:0.9rem; padding:8px 10px; border:1.5px solid var(--border); border-radius:7px; background:var(--cream); color:var(--ink); width:100%; text-transform:none; letter-spacing:0; }
  input[type=search]:focus, select:focus { outline:none; border-color:var(--forest); }
  .chips { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .chips .lbl { font-family:'IBM Plex Mono',monospace; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); margin-right:2px; }
  .chip { font-family:'IBM Plex Mono',monospace; font-size:0.74rem; border:1.5px solid var(--border); background:var(--cream); color:var(--forest-dark); border-radius:16px; padding:5px 13px; cursor:pointer; }
  .chip:hover { border-color:var(--forest); }
  .chip.on { background:var(--forest-dark); border-color:var(--forest-dark); color:var(--surface); }
  .chip .n { opacity:0.7; margin-left:5px; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .count { font-family:'IBM Plex Mono',monospace; font-size:0.8rem; color:var(--muted); }
  .btn-primary { background:var(--forest-dark); color:var(--surface); border:none; padding:11px 20px; border-radius:7px; font-family:'Lora',serif; font-size:0.95rem; font-weight:600; cursor:pointer; }
  .btn-primary:hover:not(:disabled) { background:var(--forest); }
  .btn-primary:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }
  .btn-secondary { background:var(--surface); color:var(--forest-dark); border:1.5px solid var(--forest-dark); padding:10px 18px; border-radius:7px; font-family:'Lora',serif; font-size:0.95rem; font-weight:600; cursor:pointer; }
  .btn-secondary:hover { background:var(--forest-light); }
  .btn-miss { background:var(--brick); color:#fff; border:none; padding:11px 22px; border-radius:7px; font-family:'Lora',serif; font-size:0.95rem; font-weight:600; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .tile { all:unset; box-sizing:border-box; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); position:relative; }
  .tile:hover, .tile:focus-visible { border-color:var(--forest); outline:2px solid var(--forest-light); }
  .tile .imgwrap { aspect-ratio:4/3; background:#1f261f; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .tile img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .tile .meta { padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; }
  .tile .t { font-size:0.86rem; line-height:1.35; font-weight:600; color:var(--forest-dark); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .tile .s { font-family:'IBM Plex Mono',monospace; font-size:0.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
  .kind { position:absolute; top:8px; left:8px; font-family:'IBM Plex Mono',monospace; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.06em; background:rgba(255,253,248,0.93); color:var(--forest-dark); border:1px solid var(--border); border-radius:10px; padding:2px 8px; }
  .dot { position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%; font-size:12px; line-height:20px; text-align:center; font-family:'IBM Plex Mono',monospace; color:#fff; }
  .dot.ok { background:var(--forest); } .dot.no { background:var(--brick); }
  .empty { text-align:center; color:var(--muted); padding:40px 10px; }
  /* lightbox + study */
  .overlay { position:fixed; inset:0; background:rgba(30,38,30,0.86); z-index:2000; display:none; align-items:center; justify-content:center; padding:20px; }
  .overlay.open { display:flex; }
  .lb { background:var(--surface); border-radius:12px; max-width:1050px; width:100%; max-height:94vh; overflow:auto; display:grid; grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr); }
  .lb .pic { background:#1f261f; display:flex; align-items:center; justify-content:center; padding:10px; min-height:260px; }
  .lb .pic img { max-width:100%; max-height:84vh; object-fit:contain; }
  .lb .info { padding:22px; display:flex; flex-direction:column; gap:12px; }
  .lb h3 { margin:0; font-size:1.05rem; color:var(--forest-dark); line-height:1.4; }
  .lb p { margin:0; font-size:0.92rem; line-height:1.6; }
  .lb .src { font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--muted); line-height:1.6; }
  .lb a { color:var(--forest-dark); }
  .lb .nav { display:flex; gap:8px; margin-top:auto; flex-wrap:wrap; }
  .study { max-width:760px; margin:0 auto; }
  .study .pic { background:#1f261f; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:8px; }
  .study .pic img { max-width:100%; max-height:62vh; object-fit:contain; }
  .progress { height:5px; background:var(--border); border-radius:3px; overflow:hidden; margin:8px 0 16px; }
  .progress i { display:block; height:100%; background:var(--forest); }
  .answer { margin-top:16px; padding:16px 18px; background:var(--forest-light); border-left:3px solid var(--forest); border-radius:0 8px 8px 0; }
  .answer h3 { margin:0 0 6px; font-size:1.02rem; color:var(--forest-dark); }
  .answer p { margin:0 0 6px; font-size:0.9rem; line-height:1.6; }
  .answer .src { font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--muted); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .big { font-size:2.6rem; font-weight:700; color:var(--forest-dark); text-align:center; margin:14px 0 4px; }
  @media (max-width:760px) { .lb { grid-template-columns:1fr; } .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; } }
</style>
</head>

6d58.jpg","k":"histology","s":"resp","g":"cvresp2/cvresp2-copd.html","gt":"COPD & Other Disorders — Study Guide","hid":"asthmapath","t":"Status Asthmaticus","c":"High-power H&E section showing eosinophils with bilobed nuclei and adjacent needle-shaped Charcot-Leyden crystals"},{"id":"43cd1374f11f","f":"43cd1374f11f.jpg","k":"gross","s":"resp","g":"cvresp2/cvresp2-copd.html","gt":"COPD & Other Disorders — Study Guide","hid":"bronchiectasis","t":"Pathology","c":"Gross photo of a cut lung specimen with forceps tracing a dilated airway with visible cartilage extending nearly to the pleural surface"},{"id":"d90ee21f41a6","f":"d90ee21f41a6.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec1","t":"Three Cell Types","c":"The cardiac action potential (phases 0-4) correlated directly with the surface EKG above it, showing which ion currents (Na+, Ca2+, K+) drive each phase."},{"id":"9034f6c98def","f":"9034f6c98def.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec1","t":"Three Cell Types","c":"Cell-to-cell propagation of a depolarization wave (A→D): the advancing wavefront of positive charge is what an EKG electrode actually detects as it passes."},{"id":"d24c4caeeed4","f":"d24c4caeeed4.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec1","t":"The Pacemaker Action Potential vs. Phases of Contraction","c":"Working myocyte: flat phase 4, stable resting potential."},{"id":"81cfaaf6b6b0","f":"81cfaaf6b6b0.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec1","t":"The Pacemaker Action Potential vs. Phases of Contraction","c":"Pacemaker (SA node) cell: sloped phase 4 — spontaneous diastolic depolarization."},{"id":"97928f2adc72","f":"97928f2adc72.svg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec3","t":"P Wave, PR Interval & Atrial Depolarization","c":"Anatomy of a single heartbeat on EKG paper: the P wave, QRS complex, T wave, and the key intervals/segments measured between them. Use this as your visual reference for every wave discussed in Sections 3–5."},{"id":"0e27d3e3bfa3","f":"0e27d3e3bfa3.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec3","t":"The P Wave","c":"Atrial depolarization vector viewed from the limb leads (I, III, aVR)."},{"id":"0b48eadce3f4","f":"0b48eadce3f4.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec3","t":"The P Wave","c":"Same vector viewed from the precordial leads (V1, V6)."},{"id":"dbceb81b8948","f":"dbceb81b8948.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec3","t":"The P Wave","c":"The septum depolarizes left-to-right first (inset arrow); since this points away from lead I, it produces the small, normal 'septal q wave' seen there."},{"id":"1d55618a5e0a","f":"1d55618a5e0a.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec4","t":"Naming QRS Components","c":"The full naming convention illustrated: QRS, RSR' (rabbit ears), RS, QR, QS, and an isolated R — the same rules named in the table above, drawn out."},{"id":"a2fa3d321aa3","f":"a2fa3d321aa3.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec4","t":"R Wave Progression","c":"Real R wave progression across the precordium: V1-V3 are predominantly negative (S-wave dominant), transitioning to predominantly positive (R-wave dominant) by V5-V6."},{"id":"dcb5d2eb79b1","f":"dcb5d2eb79b1.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec5","t":"Repolarization & the T Wave","c":"The repolarization vector and resulting T wave morphology in V1 vs. V6 — note both show a positive (upright) T wave, matching their positive R waves."},{"id":"1541e113a76d","f":"1541e113a76d.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec5","t":"Segments & Intervals: Precise Definitions","c":"PR interval (P onset → QRS onset) vs. PR segment (P offset → QRS onset)."},{"id":"e4f8fff612eb","f":"e4f8fff612eb.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec5","t":"Segments & Intervals: Precise Definitions","c":"QT interval spans QRS onset through T-wave offset; ST segment is QRS offset → T onset."},{"id":"857723ea3995","f":"857723ea3995.svg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec6","t":"Three Methods","c":"The '300-150-100-75-60-50' sequence method: find an R wave landing on a bold line, then count down the sequence at each successive bold line until the next R wave. Here the second R wave lands on the 5th bold line → rate ≈ 60 bpm."},{"id":"3383dbc2836e","f":"3383dbc2836e.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec6","t":"Three Methods","c":"A real 12-lead tracing at standard calibration (25 mm/sec) — practice applying any of the three rate methods to this strip."},{"id":"c2f5c2a632cf","f":"c2f5c2a632cf.svg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec7","t":"The Quick Axis Method: Lead I and aVF","c":"The hexaxial reference system: all six frontal-plane leads plotted by their true angle, with the four axis zones shaded (green = normal, yellow = LAD, orange = RAD, red = extreme). This is the geometric picture behind every axis rule in this section."},{"id":"a9eb5ee67937","f":"a9eb5ee67937.svg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec7","t":"The Quick Axis Method: Lead I and aVF","c":"The quick Lead I / aVF method illustrated: reading the QRS deflection (up = positive, down = negative) in just these two leads tells you which of the four axis quadrants you're in — no angle math required."},{"id":"02467a730f8f","f":"02467a730f8f.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec9","t":"Sinus Arrhythmias","c":"Rate comparison: a faster rhythm strip (A) vs. a slower one (B) — same P-QRS-T sequence, just compressed or stretched in time."},{"id":"f3f410729360","f":"f3f410729360.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec10","t":"Atrial Flutter","c":"Classic sawtooth flutter waves, best seen in the inferior leads (II, III, aVF)."},{"id":"4760db419b98","f":"4760db419b98.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec10","t":"Atrial Fibrillation","c":"Irregularly irregular R-R intervals with no discernible, organized P waves — the hallmark of atrial fibrillation."},{"id":"074478e1a039","f":"074478e1a039.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec10","t":"Wolff-Parkinson-White (WPW) Syndrome","c":"Short PR interval with a delta wave (slurred, slow initial QRS upstroke) — the signature finding of WPW pre-excitation."},{"id":"60dccec267c1","f":"60dccec267c1.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec12","t":"Ventricular Tachycardia (VT)","c":"A run of wide-complex tachycardia (VT) emerging from and returning to normal sinus rhythm."},{"id":"c0017c6e1222","f":"c0017c6e1222.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec12","t":"Ventricular Fibrillation (VF)","c":"Chaotic, disorganized zigzag with no identifiable P waves, QRS complexes, or T waves."},{"id":"7338aa36a21d","f":"7338aa36a21d.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec12","t":"Ventricular Fibrillation (VF)","c":"Torsades de pointes: the QRS amplitude and axis gradually twist around the isoelectric baseline — hence the name ('twisting of the points')."},{"id":"ff91ecca93cd","f":"ff91ecca93cd.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec13","t":"AV Block Classification","c":"First-degree AV block: possible anatomic sites of block (left) and the resulting uniformly prolonged PR interval on every beat (right)."},{"id":"6579910a1853","f":"6579910a1853.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec13","t":"AV Block Classification","c":"Mobitz I (Wenckebach): watch the PR interval lengthen with each beat until one P wave fails to conduct."},{"id":"09673818d19f","f":"09673818d19f.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec13","t":"AV Block Classification","c":"Mobitz II: PR interval stays fixed beat-to-beat, then a QRS is suddenly dropped with no warning."},{"id":"d6ed958f25eb","f":"d6ed958f25eb.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec13","t":"AV Block Classification","c":"Possible anatomic sites of complete (3rd-degree) AV block — anywhere from the AV node down through the bundle branches."},{"id":"63a9a763b043","f":"63a9a763b043.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec13","t":"AV Block Classification","c":"Complete AV dissociation: P waves (arrowheads visible marching through) at their own rate, completely independent of the QRS rate."},{"id":"bc76e2fd5a38","f":"bc76e2fd5a38.svg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec13","t":"Bundle Branch Blocks","c":"Schematic QRS morphology comparison in leads V1 and V6 for RBBB vs. LBBB. Note the mirror-image relationship between the two conditions across the two leads."},{"id":"6ae746a250b4","f":"6ae746a250b4.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec13","t":"Bundle Branch Blocks","c":"Real RBBB tracing: rSR' ('rabbit ears') clearly visible in V1."},{"id":"4d70e045cadc","f":"4d70e045cadc.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec13","t":"Bundle Branch Blocks","c":"Real LBBB tracing: broad QS in V1-V3, broad notched R in V5-V6."},{"id":"ee2b3752c886","f":"ee2b3752c886.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec14","t":"Recognizing Pacer Spikes","c":"Real paced rhythm: sharp vertical pacer spikes visible immediately before several QRS complexes."},{"id":"c69336c9f7c4","f":"c69336c9f7c4.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec15","t":"STEMI vs. NSTEMI","c":"The full evolution of STEMI changes over time: normal → hyperacute T waves → ST elevation → Q waves with T-wave inversion → ST improves → T normalizes while Q waves persist as permanent scar."},{"id":"c5cf28dc43fd","f":"c5cf28dc43fd.svg","k":"figure","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec15","t":"Reciprocal Changes","c":"The 12-lead layout as printed on a real EKG, color-coded by coronary territory. Leads that light up together (same color) point to the same culprit vessel; the shaded groups are exactly what 'anterolateral' or 'inferior' STEMI refers to."},{"id":"3a24747c89c9","f":"3a24747c89c9.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec16","t":"Left Ventricular Hypertrophy (LVH)","c":"Real LVH example: deep S waves in V1-V3 and tall R waves in V5-V6, comfortably exceeding the 35 mm Sokolow-Lyon threshold, with a left ventricular strain pattern."},{"id":"f35193d26282","f":"f35193d26282.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec17","t":"Hyperkalemia (Progressive Changes)","c":"Early hyperkalemic changes: tall, narrow-based, peaked ('tented') T waves — look especially at the precordial leads."},{"id":"853b662c2834","f":"853b662c2834.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec17","t":"Digoxin Effect","c":"The classic digoxin effect: gently scooped, downsloping ST depression best seen in the lateral precordial leads — a medication effect, not necessarily toxicity."},{"id":"437a509ea5ee","f":"437a509ea5ee.jpg","k":"ekg","s":"circ","g":"cvresp2/cvresp2-ekg.html","gt":"EKG Interpretation — Study Guide","hid":"sec17","t":"Pericardial Effusion","c":"Low-voltage QRS complexes with subtle beat-to-beat amplitude variation, best appreciated in the V1 and II rhythm strips at the bottom — classic for a large pericardial effusion."},{"id":"f1b3590a2936","f":"f1b3590a2936.jpg","k":"imaging","s":"circ","g":"cvresp2/cvresp2-heart-path.html","gt":"Pathology of the Heart — Study Guide","hid":"s2","t":"Types of acute pericarditis","c":"CT scan showing large pericardial effusion"},{"id":"3adc1fb82028","f":"3adc1fb82028.jpg","k":"histology","s":"circ","g":"cvresp2/cvresp2-heart-path.html","gt":"Pathology of the Heart — Study Guide","hid":"s2","t":"Types of acute pericarditis","c":"Pericardial fluid cytology showing malignant cells"},{"id":"a1dc1c442ff7","f":"a1dc1c442ff7.jpg","k":"figure","s":"circ","g":"cvresp2/cvresp2-heart-path.html","gt":"Pathology of the Heart — Study Guide","hid":"s3","t":"Stenosis vs. insufficiency: two different overload patterns","c":"Hand-drawn diagrams of normal blood flow, aortic stenosis, aortic insufficiency, and mitral stenosis"},{"id dema."},{"id":"484445b7f6fb","f":"484445b7f6fb.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"heart-failure-vs-pneumonia","t":"Alveolar edema: the full-blown picture, and its resolution with treatment","c":"Decompensated heart failure, annotated: yellow arrows mark perihilar consolidation with air bronchograms, the red arrow marks the widened vascular pedicle, red arrowheads mark the enlarged cardiac silhouette, and the blue arrow marks pleural fluid."},{"id":"52e8a934cc6b","f":"52e8a934cc6b.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"heart-failure-vs-pneumonia","t":"Alveolar edema: the full-blown picture, and its resolution with treatment","c":"The same patient after diuresis and treatment: the alveolar edema has resolved, though cardiomegaly, some redistribution, and pleural fluid persist — the heart size and vascular pedicle do not normalize as quickly as the alveolar fluid clears."},{"id":"08117de2c1b0","f":"08117de2c1b0.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"heart-failure-vs-pneumonia","t":"Contrast: a straightforward bacterial (lobar) pneumonia","c":"Right lobar (bacterial) pneumonia: consolidation is present, but the heart size, vascular pedicle, and costophrenic angles are all normal, and there is no redistribution or Kerley B lines — a pattern distinct from cardiogenic edema."},{"id":"ed8795d35edd","f":"ed8795d35edd.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"atypical-pneumonia","t":"Mycoplasma pneumoniae — the classic \"atypical\" pattern","c":"Mycoplasma pneumoniae CXR in a 12-year-old girl: bilateral, symmetric, heterogeneous opacities with relative sparing of the apices — the classic 'atypical' pneumonia pattern."},{"id":"6a3b90fedacf","f":"6a3b90fedacf.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"atypical-pneumonia","t":"Mycoplasma pneumoniae — the classic \"atypical\" pattern","c":"CT in the same patient: peribronchovascular ground-glass opacity with bronchial wall thickening (arrow), a very common finding in mycoplasma pneumonia."},{"id":"4046b7279f2c","f":"4046b7279f2c.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"atypical-pneumonia","t":"Legionella pneumophila — a pneumonia that progresses on imaging","c":"Legionella pneumonia at symptom onset: right infrahilar and basilar consolidation (arrow)."},{"id":"10f4800cb943","f":"10f4800cb943.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"atypical-pneumonia","t":"Legionella pneumophila — a pneumonia that progresses on imaging","c":"The same patient two days later: progression of the right basilar consolidation with new right upper lobe and left mid-lung peripheral consolidation — multilobar spread typical of Legionella."},{"id":"8eda4ef4f742","f":"8eda4ef4f742.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"copd-imaging","t":"COPD on chest x-ray","c":"COPD, frontal view: marked bilateral hyperinflation, 11 visible posterior ribs, and flattened diaphragms."},{"id":"f68609082e80","f":"f68609082e80.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"copd-imaging","t":"COPD on chest x-ray","c":"COPD, lateral view: enlargement of the retrosternal airspace, another sign of chronic hyperinflation."},{"id":"9a2514ec9c56","f":"9a2514ec9c56.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"sarcoidosis-staging","t":"Stage 1: isolated hilar/mediastinal adenopathy","c":"Stage 1 sarcoidosis: bilateral hilar/mediastinal lymph node enlargement with otherwise clear lungs."},{"id":"31f76862cd61","f":"31f76862cd61.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"sarcoidosis-staging","t":"Stage 2: adenopathy plus parenchymal disease","c":"Stage 2 sarcoidosis: hilar/mediastinal adenopathy together with parenchymal infiltrates."},{"id":"c0936d7e3edb","f":"c0936d7e3edb.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"sarcoidosis-staging","t":"Stage 3: parenchymal disease without adenopathy","c":"Stage 3 sarcoidosis: parenchymal involvement with resolution of the previously seen nodal enlargement."},{"id":"588397c40069","f":"588397c40069.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"sarcoidosis-staging","t":"Stage 4: pulmonary fibrosis (end-stage)","c":"Stage 4 sarcoidosis: overt pulmonary fibrosis with architectural distortion and calcified granulomas."},{"id":"a4eb70a86b33","f":"a4eb70a86b33.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"pneumothorax","t":"Recognizing pneumothorax: large and small examples","c":"Large left-sided pneumothorax: absent peripheral lung markings on the left with the collapsed lung edge visible medially."},{"id":"6200701af0d9","f":"6200701af0d9.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"pneumothorax","t":"Recognizing pneumothorax: large and small examples","c":"Right-sided pneumothorax with the visceral pleural line marked by arrows and a lack of apical vascular markings; an associated right clavicle fracture is also visible."},{"id":"235f7a85294d","f":"235f7a85294d.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"pneumothorax","t":"The expiratory view trick","c":"Expiratory view of the same patient: the pneumothorax is now more conspicuous because the smaller expiratory lung volume makes the fixed volume of pleural air proportionally larger."},{"id":"64a8f32472c5","f":"64a8f32472c5.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"trauma-imaging","t":"Rib fractures and subcutaneous emphysema","c":"Multiple rib fractures with extensive subcutaneous emphysema tracking through the chest wall, shoulder, and neck soft tissues."},{"id":"5955c0d5242a","f":"5955c0d5242a.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"trauma-imaging","t":"Thoracic spine compression fractures","c":"Lateral chest film demonstrating thoracic vertebral compression fractures (red dashed markers), illustrating the importance of reviewing the bony spine on every chest film."},{"id":"174f3490e8a2","f":"174f3490e8a2.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"tube-line-placement","t":"Central lines, endotracheal tubes, and gastric tubes","c":"Portable AP chest film showing patchy bilateral infiltrates along with a central line, endotracheal tube, and gastric tube in place (unannotated)."},{"id":"376e54e2bf7e","f":"376e54e2bf7e.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"tube-line-placement","t":"Central lines, endotracheal tubes, and gastric tubes","c":"The same film, annotated: central line (blue), endotracheal tube (yellow), and gastric tube (green), each traced to confirm good positioning."},{"id":"a41b3839aa5e","f":"a41b3839aa5e.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the R (V/Q) scanning","c":"A second V/Q scan example demonstrating lack of perfusion (blue arrow) in an area that was well ventilated — again, consistent with pulmonary embolism."},{"id":"c58572f9d029","f":"c58572f9d029.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"ctpa-pet","t":"CT pulmonary angiography (CTPA)","c":"CT pulmonary angiogram showing a pulmonary embolism (arrow) as a filling defect at the bifurcation of the pulmonary artery, adjacent to the bronchi, aorta, and superior vena cava."},{"id":"9bc607987ac3","f":"9bc607987ac3.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"ctpa-pet","t":"CT pulmonary angiography (CTPA)","c":"CT pulmonary angiography demonstrating a large saddle pulmonary embolism straddling the main pulmonary artery bifurcation."},{"id":"1cc5454daf78","f":"1cc5454daf78.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"ctpa-pet","t":"PET/CT","c":"PET/CT scan of a patient with small cell lung carcinoma (arrows) before (top) and after (bottom) chemotherapy — the intensely hypermetabolic tumor shows a marked reduction in tracer uptake following treatment."},{"id":"ef866dc5a047","f":"ef866dc5a047.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"lung-nodule-screening","t":"Lung nodules and lung cancer screening","c":"A lung nodule (arrow) identified on chest x-ray."},{"id":"0bf1a3c004f4","f":"0bf1a3c004f4.jpg","k":"imaging","s":"resp","g":"cvresp2/resp-imaging.html","gt":"Imaging of the Respiratory Tract — Study Guide","hid":"lung-nodule-screening","t":"Lung nodules and lung cancer screening","c":"The corresponding chest CT in the same patient, allowing precise measurement of the nodule (20.44 mm and 25.53 mm here) and characterization of its margins and density."},{"id":"fa44625ddedf","f":"fa44625ddedf.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"uip","t":"Usual Interstitial Pneumonia (UIP / Idiopathic Pulmonary Fibrosis)","c":"Low power: open alveolar spaces next to a zone of chronic fibrosis (arrow) — the temporal heterogeneity of UIP."},{"id":"369c3ea92aa2","f":"369c3ea92aa2.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"uip","t":"Usual Interstitial Pneumonia (UIP / Idiopathic Pulmonary Fibrosis)","c":"High power fibroblast focus: pale, faintly bluish, hypocellular proliferation of myofibroblasts within the alveolar septum."},{"id":"22c5417690bc","f":"22c5417690bc.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"uip","t":"Histology — the key concept is temporal heterogeneity","c":"Honeycomb change: large air-filled cysts separated by thick, pink (fibrous) septa — superficially resembles emphysema but is firm to palpation."},{"id":"f9c2321cb18b","f":"f9c2321cb18b.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"nsip","t":"Nonspecific Interstitial Pneumonia (NSIP)","c":"NSIP: diffuse interstitial fibrosis of uniform appearance throughout the section — note the lack of coexisting old/new lesions seen in UIP."},{"id":"d4e2c67b2b0d","f":"d4e2c67b2b0d.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"cop","t":"Cryptogenic Organizing Pneumonia (COP)","c":"Organizing pneumonia pattern: loose, low-cellularity fibrous plugs (Masson bodies) filling the alveolar air spaces."},{"id":"2215ee23ab5c","f":"2215ee23ab5c.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"pneumoconiosis-cwp","t":"Coal Workers' Pneumoconiosis (CWP)","c":"Simple CWP, low power: multiple discrete black, contracted pigment-laden macules scattered through otherwise unremarkable lung."},{"id":"d778b532bae5","f":"d778b532bae5.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"silicosis","t":"Silicosis","c":"Silicotic nodule: a whorled, densely hyalinized/fibrotic nodule."},{"id":"09c9dbc3b2a7","f":"09c9dbc3b2a7.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"silicosis","t":"Silicosis","c":"A silicotic nodule under polarized light — polarization brings out the birefringent silica particles embedded within the fibrous tissue."},{"id":"a5c273e8ca65","f":"a5c273e8ca65.jpg","k":"imaging","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"silicosis","t":"Silicosis","c":"Chest radiograph: reticular and nodular opacities concentrated in the upper lung zones — the classic distribution for silicosis."},{"id":"b3993a84d500","f":"b3993a84d500.jpg","k":"gross","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"asbestos","t":"Pleural plaques — a marker of exposure, not disease","c":"Pleural plaques at autopsy: discrete, flat, off-white, dense fibrotic plaques on the parietal pleural surface overlying the ribs."},{"id":"2283b66ad15c","f":"2283b66ad15c.jpg","k":"gross","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"asbestos","t":"Pleural plaques — a marker of exposure, not disease","c":"A pleural plaque on the diaphragmatic surface — the same firm, white, calcified-appearing lesion in a different characteristic location."},{"id":"278b1521e461","f":"278b1521e461.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"asbestos","t":"Asbestosis","c":"Asbestosis: dense interstitial fibrosis with markedly thickened alveolar septa — firm on palpation, unlike emphysema."},{"id":"a0bea394d5c0","f":"a0bea394d5c0.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"asbestos","t":"Ferruginous (asbestos) bodies — the hallmark finding","c":"Ferruginous body, high power: a straight asbestos fiber coated by iron and protein, producing the classic beaded, golden-brown, segmented rod."},{"id":"c9d4d2595b03","f":"c9d4d2595b03.jpg","k":"gross","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"drug-radiation","t":"Drug- and Radiation-Induced Pulmonary Fibrosis","c":"Amiodarone-associated restrictive lung disease, gross: an irregular, bumpy (non-smooth) pleural surface."},{"id":"9c8ab8de8800","f":"9c8ab8de8800.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"drug-radiation","t":"Drug- and Radiation-Induced Pulmonary Fibrosis","c":"Corresponding histology: air spaces are preserved but the alveolar septal walls are markedly thickened and fibrotic compared to normal thin septa."},{"id":"f8d9c1d08aab","f":"f8d9c1d08aab.jpg","k":"gross","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"sarcoidosis","t":"Granulomas","c":"Gross specimen: firm, pale, coalescent lymph nodes at the hilum/tracheal bifurcation — hilar lymphadenopathy."},{"id":"295d3b1eb83d","f":"295d3b1eb83d.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"sarcoidosis","t":"Granulomas","c":"Non-caseating granulomas within lung parenchyma; note the collections of epithelioid histiocytes without central caseous necrosis."},{"id":"922d0a76ced2","f":"922d0a76ced2.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"sarcoidosis","t":"Staging & pulmonary course","c":"Cor pulmonale from advanced pulmonary sarcoidosis: heart cross-section (left) showing right ventricular wall thickness that has come to essentially match the left ventricle's, reflecting long-standing pulmonary hypertension — alongside the diffusely scarred, contracted lung (right) that drove it."},{"id":"7680482205f0","f":"7680482205f0.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"sarcoidosis","t":"Extrapulmonary involvement","c":"Erythema nodosum: tender, red-to-violaceous subcutaneous nodules on the lower extremities."},{"id":"700bf3b9750f","f":"700bf3b9750f.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"hp","t":"Hypersensitivity Pneumonitis","c":"Hypersensitivity pneumonitis: ill-defined, poorly formed granulomas centered around a bronchiole (peribronchiolar), with surrounding interstitial inflammation."},{"id":"c216cfaf2243","f":"c216cfaf2243.jpg","k":"gross","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"smoking-related","t":"Pulmonary anthracosis","c":"Pulmonary anthracosis: diffuse black pigmentation of the lung surface, most pronounced from cigarette smoking (or heavy environmental smoke exposure)."},{"id":"3df9d96b364d","f":"3df9d96b364d.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"smoking-related","t":"Respiratory bronchiolitis","c":"Respiratory bronchiolitis progressing toward fibrosis: pigmented (smoker's) macrophage accumulation accompanied by thickened, fibrotic alveolar septa."},{"id":"43fdb4c8593f","f":"43fdb4c8593f.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"smoking-related","t":"Desquamative interstitial pneumonia (DIP)","c":"DIP, low power: essentially every alveolar air space is diffusely filled."},{"id":"931775f17a0f","f":"931775f17a0f.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"smoking-related","t":"Desquamative interstitial pneumonia (DIP)","c":"DIP, high power: the air spaces are packed with accumulated macrophages."},{"id":"cdd591b2f4c4","f":"cdd591b2f4c4.jpg","k":"histology","s":"resp","g":"cvresp2/restrictive-lung-disease.html","gt":"Restrictive Lung Disease","hid":"pap","t":"Histology","c":"Comparing intra-alveolar material: PAP (right) shows granular, slightly textured proteinaceous/surfactant-derived material filling the air spaces, versus smooth, homogeneous pulmonary edema fluid (left)."},{"id":"143c9d4209ce","f":"143c9d4209ce.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p1-lobar-broncho","t":"Lobar pneumonia vs. bronchopneumonia","c":"Gross comparison: lobar pneumonia (uniform lobar consolidation) vs. bronchopneumonia (patchy)"},{"id":"8f3963f7d91b","f":"8f3963f7d91b.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p1-lobar-broncho","t":"Lobar pneumonia vs. bronchopneumonia","c":"Two additional gross examples of lobar pneumonia with the affected lobe outlined"},{"id":"b074cfe8b1c6","f":"b074cfe8b1c6.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p1-lobar-broncho","t":"Four histologic stages of lobar pneumonia","c":"Gross cut section: red hepatization — solid, liver-like, red-brown lung"},{"id":"674cbc90331d","f":"674cbc90331d.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p1-lobar-broncho","t":"Four histologic stages of lobar pneumonia","c":"Histology pair: red hepatization (neutrophil/fibrin-filled alveoli) vs. gray hepatization"},{"id":"4d53ab9ecaf7","f":"4d53ab9ecaf7.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p1-lobar-broncho","t":"Four histologic stages of lobar pneumonia","c":"Gray hepatization histology and, separately, organizing pneumonia with fibroblastic plugs within airspaces"},{"id":"8bd5561929d5","f":"8bd5561929d5.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p1-lobar-broncho","t":"Four histologic stages of lobar pneumonia","c":"Bronchopneumonia histology: patchy low-power pattern with a high-power inset showing intra-alveolar cocci"},{"id":"062d23b20213","f":"062d23b20213.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p1-complications","t":"Complications of pneumonia","c":"Empyema: gross autopsy photo of pus layering within the pleural cavity"},{"id":"61a4ec8537e8","f":"61a4ec8537e8.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p1-complications","t":"Complications of pneumonia","c":"A second empyema example alongside gross pleural adhesions binding lung to chest wall"},{"id":"53a9270b6b22","f":"53a9270b6b22.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-viral","t":"Viral community-acquired pneumonia","c":"Interstitial inflammation of viral pneumonia — widened, inflamed alveolar septa rather than airspace-filling exudate"},{"id":"b762e3fb31a1","f":"b762e3fb31a1.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-viral","t":"Hantavirus","c":"Hantavirus: open chest cavity with pleural effusion; spleen/organ specimen"},{"id":"ca07e1aa89c4","f":"ca07e1aa89c4.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-viral","t":"COVID-19","c":"COVID-19: dark, hemorrhagic, markedly consolidated lungs at autopsy"},{"id":"a01539a9926f","f":"a01539a9926f.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-viral","t":"COVID-19","c":"COVID-19 histology: hyaline membranes and dysplastic regenerating epithelium"},{"id":"95436b91b583","f":"95436b91b583.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-viral","t":"COVID-19","c":"Postmortem clot at the pulmonary valve/outflow tract — “currant jelly and chicken fat” layering"},{"id":"9ae08d285346","f":"9ae08d285346.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-aspiration","t":"Point to ponder: agonal vs. antemortem aspiration","c":"Aspiration histology: vegetable-matter fragment and skeletal-muscle/cell-wall fragments within lung parenchyma, with associated inflammatory response"},{"id":"4f10dc9246f0","f":"4f10dc9246f0.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-abscess","t":"Pulmonary abscess (necrotizing pneumonia)","c":"Necrotizing pneumonia/abscess formation — cavitary, pus-filled lung parenchyma"},{"id":"0cb9383b17cb","f":"0cb9383b17cb.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-tb","t":"Tuberculosis","c":"Caseating granuloma (H&E) alongside an acid-fast stain highlighting red-staining bacilli"},{"id":"527334f409b8","f":"527334f409b8.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-tb","t":"Specific forms","c":"Ghon complex: gross lung specimen and corresponding chest x-ray showing the calcified nodule and hilar node"},{"id":"3dc050d033c8","f":"3dc050d033c8.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-tb","t":"Specific forms","c":"Healed primary pulmonary tuberculosis — additional gross specimen with calcified focus"},{"id":"0c921a161964","f":"0c921a161964.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-tb","t":"Specific forms","c":"Reactivation tuberculosis: apical cavitary disease on gross cut section"},{"id":"c69c7cba6bb9","f":"c69c7cba6bb9.jpg","k":"gross","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-tb","t":"Specific forms","c":"Apical scars from healed reactivation disease"},{"id":"49f5acce0b86","f":"49f5acce0b86.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p2-tb","t":"Specific forms","c":"Miliary tuberculosis: innumerable millet-seed granulomas studding the liver (histology) and spleen (gross) — “what was the source of dissemination?”"},{"id":"07f6ce2957de","f":"07f6ce2957de.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-fungi","t":"Dimorphic fungi","c":"Blastomyces: broad-based budding yeast within granulomatous inflammation"},{"id":"f58cf8e04de3","f":"f58cf8e04de3.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-fungi","t":"Dimorphic fungi","c":"Histoplasmosis: small intracellular yeast forms on H&E and GMS silver stain"},{"id":"4ce1453cefce","f":"4ce1453cefce.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-fungi","t":"Dimorphic fungi","c":"Coccidioides: gross specimen and spherules containing endospores on histology"},{"id":"f21e6597354b","f":"f21e6597354b.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-candida-aspergillus","t":"Candida albicans","c":"Candidal tracheitis: budding yeast and pseudohyphae along an inflamed tracheal surface"},{"id":"8d1210e7924f","f":"8d1210e7924f.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-candida-aspergillus","t":"Aspergillus","c":"Aspergilloma: gross fungus ball within a lung cavity, and septate hyphae on histology"},{"id":"5804d0d7103c","f":"5804d0d7103c.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-candida-aspergillus","t":"Aspergillus","c":"Aspergilloma histology showing the fungus ball within a pre-existing cavity, contrasted with adjacent normal lung"},{"id":"0f645b03a53c","f":"0f645b03a53c.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-immunocompromised","t":"Pneumocystis jirovecii pneumonia (PCP)","c":"PCP: foamy intra-alveolar exudate, low and high power"},{"id":"36ba71da9d51","f":"36ba71da9d51.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-immunocompromised","t":"Pneumocystis jirovecii pneumonia (PCP)","c":"PCP organisms on H&E and GMS silver stain — “collapsed ping-pong ball” morphology"},{"id":"5c10e9756202","f":"5c10e9756202.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-immunocompromised","t":"Pneumocystis jirovecii pneumonia (PCP)","c":"Pneumocystis jirovecii vs. pulmonary edema — the foamy PCP exudate can closely mimic edema fluid on H&E alone"},{"id":"ca99cca0fce5","f":"ca99cca0fce5.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-immunocompromised","t":"Cytomegalovirus (CMV)","c":"CMV: enlarged cells with owl's-eye intranuclear inclusions"},{"id":"b605e56b8e40","f":"b605e56b8e40.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-immunocompromised","t":"Cryptococcus","c":"Cryptococcus: encapsulated yeast with surrounding clearing (H&E) and mucicarmine-positive capsule; “most commonly associated with meningitis, but often begins in lung”"},{"id":"46a19239aed6","f":"46a19239aed6.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-special","t":"Special forms of pneumonia","c":"Exogenous lipid pneumonia: large extracellular lipid vacuoles distorting alveolar architecture"},{"id":"7e2eba92fd56","f":"7e2eba92fd56.jpg","k":"histology","s":"x","g":"cvresp2/transplantation.html","gt":"Infections & Transplantation — Pathology Study Guide","hid":"p3-special","t":"Special forms of pneumonia","c":"Cholesterol pneumonia: gross hemorrhagic/consolidated lung with corresponding histology showing cholesterol clefts and foamy macrophages"},{"id":"4132040a13cf","f":"4132040a13cf.jpg","k":"gross","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"pte","t":"Pulmonary Thromboembolism (PTE)","c":"Gross comparison: a renal artery thromboembolus (left) versus a pulmonary artery thromboembolus (right). Both show a discrete clot lodged within a vessel that does not fit the vessel's own branching pattern — the key gross clue that this is an embolus, not a thrombus that formed in place."},{"id":"e30d07184958","f":"e30d07184958.jpg","k":"gross","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"gross-micro","t":"Gross appearance","c":"Pulmonary thromboemboli lodged at a bifurcation (top two panels) alongside a deep venous thrombus (bottom) — note how the deep venous thrombus's own shape/branching does not match the pulmonary vessel it would come to occupy."},{"id":"1dd99efa57fa","f":"1dd99efa57fa.jpg","k":"histology","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"gross-micro","t":"Gross appearance","c":"A peripheral pulmonary thromboembolus causing an infarct. Top left: pleural surface showing yellow-tan discoloration (the infarcted zone) extending to the pleural edge. Right/bottom: the actual embolus (blue arrow) with the infarcted parenchyma; the microscopic panel shows a sharp demarcation (black line) between viable, aerated alveoli and the infarcted, consolidated zone."},{"id":"0fdf2ae78cc8","f":"0fdf2ae78cc8.jpg","k":"histology","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"gross-micro","t":"Microscopic dating — how old is this clot?","c":"Acute pulmonary thromboembolus, low and high power. The alternating pale (platelet/fibrin) and dark red (red blood cell) bands are lines of Zahn."},{"id":"b4c66666c121","f":"b4c66666c121.jpg","k":"gross","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"gross-micro","t":"Microscopic dating — how old is this clot?","c":"Comparing two thromboemboli of different ages within the same vessel. The lower/older one (right panel, arrow) shows granulation tissue at its periphery — fibrosis with small new capillaries (angiogenesis) growing through it — while the other resembles the fresh, acute clot seen above."},{"id":"6fa759f4f90a","f":"6fa759f4f90a.jpg","k":"histology","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"other-emboli","t":"Bone marrow vs. fat emboli","c":"Left: bone marrow emboli within pulmonary vessels, showing both hematopoietic cells and adipose tissue (vacuolated spaces). Right: pure fat emboli, seen as clear vacuolated spaces within pulmonary capillaries/vessels without hematopoietic elements."},{"id":"9629fba3d0f9","f":"9629fba3d0f9.jpg","k":"histology","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"other-emboli","t":"Amniotic fluid embolism","c":"Amniotic fluid embolism. Left: anucleate squamous cells (fetal skin) within a pulmonary vessel. Right: an Alcian blue special stain highlighting mucin (teal/blue) within the vessel."},{"id":"db5b1216ab58","f":"db5b1216ab58.jpg","k":"histology","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"other-emboli","t":"Septic emboli","c":"Left: septic emboli, most often from endocarditis — low power shows discrete foci of acute inflammation (neutrophils) around clumps of bacteria. Right: cholesterol emboli in the kidney, showing the characteristic empty, needle-shaped clefts left behind after cholesterol crystals dissolve during tissue processing."},{"id":"d5e7ff58f8a2","f":"d5e7ff58f8a2.jpg","k":"imaging","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"other-emboli","t":"Bullet embolism","c":"Bullet/birdshot embolism. Left: numerous birdshot pellets on abdominal imaging, with one pellet (arrow) that has migrated and is now presumed to have entered the inferior vena cava. Right: a single birdshot pellet embolus that has traveled to the lung."},{"id":"70e36fff33de","f":"70e36fff33de.jpg","k":"histology","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"pulm-htn","t":"Gross & microscopic findings","c":"Pulmonary artery atherosclerosis (left, gross) developing in the setting of pulmonary hypertension, alongside microscopic thickening of a small pulmonary vessel wall (right) with a markedly narrowed, nearly obliterated lumen."},{"id":"865213618ad6","f":"865213618ad6.jpg","k":"gross","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"pulm-htn","t":"Gross & microscopic findings","c":"Plexiform lesions: small, glomeruloid-appearing tufts of proliferating capillary-like channels within/adjacent to a small pulmonary artery, thought to represent disorganized new vascular channels forming around a point of vascular obstruction."},{"id":"c309e41056af","f":"c309e41056af.jpg","k":"histology","s":"resp","g":"cvresp2/vascular-disorders.html","gt":"Vascular Disorders","hid":"hemorrhage","t":"Diffuse Pulmonary Hemorrhage","c":"Diffuse pulmonary hemorrhage (this case from an infant with prematurity-associated hemorrhage). Low power (left) shows blood filling essentially all alveolar spaces throughout the section; high power (right) shows congested vessels and extravasated red blood cells flooding the alveoli."},{"id":"267a23af8810","f":"267a23af8810.jpg","k":"figure","s":"msk","g":"ocs III & IV/ocs3-ME-FPR.html","gt":"Specific Muscle Energy Techniques & Facilitated Positional Release — Study Guide","hid":"activating-forces","t":"Types of Muscle Contraction","c":"Table of the four types of muscle contraction used in muscle energy: isometric, concentric isotonic, eccentric isotonic, and isolytic, with change in muscle length, forces, and primary use for each."},{"id":"104bcd43c3af","f":"104bcd43c3af.jpg","k":"figure","s":"msk","g":"ocs III & IV/ocs3-ME-FPR.html","gt":"Specific Muscle Energy Techniques & Facilitated Positional Release — Study Guide","hid":"reciprocal","t":"Example — Treating Biceps Tension","c":"Diagram showing a physician's hand applying counterforce to a patient's forearm to treat biceps tension via reciprocal inhibition, with the triceps labeled as the activated muscle."},{"id":"841ba4f4aa16","f":"841ba4f4aa16.jpg","k":"figure","s":"msk","g":"ocs III & IV/ocs3-ME-FPR.html","gt":"Specific Muscle Energy Techniques & Facilitated Positional Release — Study Guide","hid":"oculo","t":"How It Works","c":"Illustration of the positive oculocephalic reflex: as the head rotates, the eyes move in the opposite direction to keep gaze fixed forward."},{"id":"2d00f901b6e3","f":"2d00f901b6e3.jpg","k":"figure","s":"msk","g":"ocs III & IV/ocs3-ME-  murmur timing"}],"sysn":{"circ":"Circulatory","resp":"Respiratory","msk":"Musculoskeletal","endo":"Endocrine/Metabolic","x":"Cross-cutting / other"}};
  const ITEMS = DATA.items;
  const SYSN = DATA.sysn;
  const KINDS = [['ekg', 'EKG'], ['imaging', 'Imaging'], ['histology', 'Histology'], ['gross', 'Gross / clinical'], ['figure', 'Figures & diagrams']];
  const KEY = 'atlas-results-v1';

  let kinds = new Set(['ekg', 'imaging', 'histology', 'gross']);
  let sys = 'all', guide = 'all', status = 'all', query = '';
  let results = {};
  let mode = 'browse';        // browse | study | done
  let deck = [], di = 0, revealed = false, missedIds = [], gotCount = 0;
  let lbList = [], lbIdx = -1;

  try { results = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { results = {}; }
  function saveResults() { try { localStorage.setItem(KEY, JSON.stringify(results)); } catch (e) {} }

  const main = document.getElementById('main');
  const overlay = document.getElementById('lb-overlay');
  const lb = document.getElementById('lb');

  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML.replace(/"/g, '&quot;'); }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function label(it) { return (it.c || it.t || 'Untitled').replace(/&mdash;/g, '—').replace(/&amp;/g, '&'); }
  function sub(it) { return (it.t && it.c && it.t !== it.c) ? it.t : ''; }
  function guideTitle(it) { return (it.gt || it.g).replace(/\s*[—|\-]\s*(Study Guide|Complete).*$/i, ''); }
  function srcHref(it) { return '../' + it.g.split('/').map(encodeURIComponent).join('/') + (it.hid ? '#' + encodeURIComponent(it.hid) : ''); }
  function kindName(k) { return (KINDS.find(x => x[0] === k) || [k, k])[1]; }

  function matches(it) {
    if (!kinds.has(it.k)) return false;
    if (sys !== 'all' && it.s !== sys) return false;
    if (guide !== 'all' && it.g !== guide) return false;
    const r = results[it.id];
    if (status === 'missed' && !(r && !r.ok)) return false;
    if (status === 'new' && r) return false;
    if (status === 'got' && !(r && r.ok)) return false;
    if (query) {
      const hay = (it.t + ' ' + it.c + ' ' + guideTitle(it)).toLowerCase();
      if (!query.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }
  function filtered() { return ITEMS.filter(matches); }

  /* ---------- browse ---------- */
  function renderBrowse() {
    const list = filtered();
    const guides = {};
    ITEMS.forEach(it => { guides[it.g] = guideTitle(it); });
    const kindCounts = {};
    ITEMS.forEach(it => { kindCounts[it.k] = (kindCounts[it.k] || 0) + 1; });
    const sysKeys = Array.from(new Set(ITEMS.map(i => i.s)));
    const studyable = list.length;
    main.innerHTML = `
      <div class="card controls">
        <div class="row">
          <label>Search<input type="search" id="q" placeholder="e.g. granuloma, pneumothorax, Mobitz…" value="${esc(query)}"></label>
          <label>System<select id="f-sys"><option value="all">All systems</option>${sysKeys.map(k => `<option value="${k}" ${sys === k ? 'selected' : ''}>${esc(SYSN[k] || k)}</option>`).join('')}</select></label>
          <label>Source guide<select id="f-guide"><option value="all">All guides</option>${Object.keys(guides).sort((a, b) => guides[a].localeCompare(guides[b])).map(g => `<option value="${esc(g)}" ${guide === g ? 'selected' : ''}>${esc(guides[g])}</option>`).join('')}</select></label>
          <label>My results<select id="f-status">${[['all', 'All'], ['new', 'Not yet studied'], ['missed', 'Missed last time'], ['got', 'Got it']].map(o => `<option value="${o[0]}" ${status === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}</select></label>
        </div>
        <div class="chips"><span class="lbl">Type</span>${KINDS.map(k => `<button class="chip ${kinds.has(k[0]) ? 'on' : ''}" data-kind="${k[0]}">${k[1]}<span class="n">${kindCounts[k[0]] || 0}</span></button>`).join('')}</div>
        <div class="bar">
          <span class="count">${list.length} image${list.length === 1 ? '' : 's'} shown</span>
          <button class="btn-primary" id="study" ${studyable ? '' : 'disabled'}>Name the finding — study these ${studyable}</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>`;
    const grid = document.getElementById('grid');
    if (!list.length) { grid.outerHTML = '<div class="empty card">No images match these filters.</div>'; }
    else {
      grid.innerHTML = list.map((it, i) => {
        const r = results[it.id];
        return `<button class="tile" data-i="${i}" aria-label="${esc(label(it))}">
          <div class="imgwrap"><img loading="lazy" src="atlas-images/t/${esc(it.f)}" alt="${esc(label(it))}"></div>
          <span class="kind">${esc(kindName(it.k))}</span>
          ${r ? `<span class="dot ${r.ok ? 'ok' : 'no'}">${r.ok ? '✓' : '✗'}</span>` : ''}
          <div class="meta"><div class="t">${esc(label(it))}</div><div class="s">${esc(sub(it) || guideTitle(it))}</div></div>
        </button>`;
      }).join('');
      grid.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => openLb(list, parseInt(t.getAttribute('data-i'), 10))));
    }
    const q = document.getElementById('q');
    q.addEventListener('input', e => { query = e.target.value; const pos = e.target.selectionStart; renderBrowse(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
    document.getElementById('f-sys').addEventListener('change', e => { sys = e.target.value; renderBrowse(); });
    document.getElementById('f-guide').addEventListener('change', e => { guide = e.target.value; renderBrowse(); });
    document.getElementById('f-status').addEventListener('change', e => { status = e.target.value; renderBrowse(); });
    main.querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', () => {
      const k = b.getAttribute('data-kind'); if (kinds.has(k)) kinds.delete(k); else kinds.add(k); renderBrowse();
    }));
    const st = document.getElementById('study');
    if (st) st.addEventListener('click', () => startStudy(list));
  }

  /* ---------- lightbox ---------- */
  function openLb(list, i) { lbList = list; lbIdx = i; drawLb(); overlay.classList.add('open'); }
  function closeLb() { overlay.classList.remove('open'); }
  function drawLb() {
    const it = lbList[lbIdx];
    lb.innerHTML = `
      <div class="pic"><img src="atlas-images/f/${esc(it.f)}" alt="${esc(label(it))}"></div>
      <div class="info">
        <div class="kind" style="position:static;align-self:flex-start;">${esc(kindName(it.k))}</div>
        <h3>${esc(label(it))}</h3>
        ${sub(it) ? `<p class="mono" style="font-size:0.78rem;color:var(--muted);">Section: ${esc(sub(it))}</p>` : ''}
        <div class="src">From <a href="${srcHref(it)}">${esc(guideTitle(it))}</a></div>
        <div class="nav">
          <button class="btn-secondary" id="lb-prev">&larr; Prev</button>
          <button class="btn-secondary" id="lb-next">Next &rarr;</button>
          <button class="btn-primary" id="lb-close">Close</button>
        </div>
      </div>`;
    document.getElementById('lb-prev').onclick = () => { lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; drawLb(); };
    document.getElementById('lb-next').onclick = () => { lbIdx = (lbIdx + 1) % lbList.length; drawLb(); };
    document.getElementById('lb-close').onclick = closeLb;
  }
  overlay.addEventListener('click', e => { if (e.target === overlay) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    else if (e.key === 'ArrowRight') document.getElementById('lb-next').click();
    else if (e.key === 'ArrowLeft') document.getElementById('lb-prev').click();
  });

  /* ---------- study ---------- */
  function startStudy(list) {
    deck = shuffle(list); di = 0; revealed = false; missedIds = []; gotCount = 0; mode = 'study'; renderStudy();
    window.scrollTo(0, 0);
  }
  function renderStudy() {
    if (di >= deck.length) { mode = 'done'; return renderDone(); }
    const it = deck[di];
    main.innerHTML = `
      <div class="study">
        <div class="bar"><span class="count">Image ${di + 1} of ${deck.length} · ${esc(kindName(it.k))}</span><button class="btn-secondary" id="quit">End session</button></div>
        <div class="progress"><i style="width:${(di / deck.length) * 100}%"></i></div>
        <div class="pic"><img src="atlas-images/f/${esc(it.f)}" alt="Study image"></div>
        ${revealed ? `
          <div class="answer">
            <h3>${esc(label(it))}</h3>
            ${sub(it) ? `<p>Section: ${esc(sub(it))}</p>` : ''}
            <div class="src">From <a href="${srcHref(it)}" target="_blank" rel="noopener">${esc(guideTitle(it))}</a></div>
          </div>
          <div class="actions"><button class="btn-primary" id="got">Got it</button><button class="btn-miss" id="miss">Missed it</button></div>`
        : `<p style="color:var(--muted);margin:14px 2px 0;">What is this, and what is the key finding? Commit to an answer, then reveal.</p>
           <div class="actions"><button class="btn-primary" id="reveal">Reveal answer</button></div>`}
      </div>`;
    document.getElementById('quit').onclick = () => { mode = 'browse'; renderBrowse(); };
    const rv = document.getElementById('reveal'); if (rv) rv.onclick = () => { revealed = true; renderStudy(); };
    const g = document.getElementById('got'); if (g) g.onclick = () => grade(true);
    const m = document.getElementById('miss'); if (m) m.onclick = () => grade(false);
  }
  function grade(ok) {
    const it = deck[di];
    results[it.id] = { ok: ok, ts: Date.now() }; saveResults();
    if (ok) gotCount++; else missedIds.push(it.id);
    di++; revealed = false; renderStudy();
  }
  document.addEventListener('keydown', e => {
    if (mode !== 'study' || overlay.classList.contains('open')) return;
    if (e.key === ' ' || e.key === 'Enter') { const r = document.getElementById('reveal'); if (r) { e.preventDefault(); r.click(); } }
    else if (e.key === 'ArrowRight' || e.key === 'g') { const g = document.getElementById('got'); if (g) g.click(); }
    else if (e.key === 'ArrowLeft' || e.key === 'm') { const m = document.getElementById('miss'); if (m) m.click(); }
  });
  function renderDone() {
    const total = deck.length, pct = total ? Math.round((gotCount / total) * 100) : 0;
    main.innerHTML = `
      <div class="study card">
        <div class="big">${gotCount}/${total}</div>
        <p style="text-align:center;color:var(--muted);margin:0 0 6px;">${pct}% recognized</p>
        <div class="actions" style="justify-content:center;">
          ${missedIds.length ? `<button class="btn-primary" id="retry">Retry the ${missedIds.length} missed</button>` : ''}
          <button class="btn-secondary" id="back">Back to atlas</button>
        </div>
      </div>`;
    const r = document.getElementById('retry');
    if (r) r.onclick = () => startStudy(ITEMS.filter(i => missedIds.includes(i.id)));
    document.getElementById('back').onclick = () => { mode = 'browse'; renderBrowse(); };
  }

  renderBrowse();
})();
</script>
</body>
</html>
