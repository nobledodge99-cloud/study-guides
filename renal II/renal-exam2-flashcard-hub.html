<style>
:root{--cream:#f6f1e6;--card:#fffdf8;--fd:#1f3d2e;--f:#2f5d43;--sage:#e4ecdf;--b:#d8cfb8;--ac:#b3562a;--t:#26291f;--ts:#5a5f4f}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--t);font-family:Lora,Georgia,serif}
.back-btn{position:fixed;top:14px;left:14px;background:var(--fd);color:#fff;padding:8px 14px;border-radius:20px;text-decoration:none;font:.78rem 'IBM Plex Mono',monospace;z-index:5}
header{background:linear-gradient(135deg,var(--fd),var(--f));color:#fff;text-align:center;padding:50px 20px 26px}header h1{font:600 1.5rem 'IBM Plex Mono',monospace;margin:0 0 6px}header p{margin:3px 0;color:#dfe9de;font-size:.9rem}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 60px}
.panel{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.panel h2{font:600 .8rem 'IBM Plex Mono',monospace;margin:0 0 8px;color:var(--fd);text-transform:uppercase;letter-spacing:.05em}
.grp{margin:8px 0 2px;padding-top:8px;border-top:1px solid var(--b)}.grp:first-of-type{border-top:0;padding-top:0}
.lec{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:.9rem}.lec input{accent-color:var(--f)}.lec .n{margin-left:auto;font:.72rem 'IBM Plex Mono',monospace;color:var(--ts)}
.lec.g{font-weight:600}.lec.p{padding-left:26px;font-size:.86rem}
.cat{font:600 .68rem 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--ac);margin:12px 0 2px}
button{font:.76rem 'IBM Plex Mono',monospace;background:var(--f);color:#fff;border:0;border-radius:18px;padding:7px 13px;cursor:pointer}button.alt{background:#fff;color:var(--fd);border:1px solid var(--b)}button.got{background:#2f7a4a}button.miss{background:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font:.76rem 'IBM Plex Mono',monospace;margin:6px 0 12px}
.card{perspective:1000px;height:340px;cursor:pointer}.in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.card.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:1px solid var(--b);background:var(--card);padding:44px 26px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:auto;font-size:1.12rem}
.back{transform:rotateY(180deg);background:var(--sage);font-size:.98rem;text-align:left}
.tagl{position:absolute;top:10px;left:14px;right:14px;font:.64rem/1.3 'IBM Plex Mono',monospace;color:var(--ts);text-align:left}
.lab{font:.66rem 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.07em;color:var(--ac);margin-bottom:10px}
.hint{text-align:center;font-size:.78rem;color:var(--ts);margin:8px 0}.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
</style></head><body>

<div class="card" id="card"><div class="in"><div class="face"><div class="tagl" id="t1"></div><div><div class="lab">Question</div><div id="q"></div></div></div><div class="face back"><div class="tagl" id="t2"></div><div><div class="lab">Answer</div><div id="a"></div></div></div></div></div>

</div>
<script>
var ALL=[{"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Kemp's favorite quote on bladder symptoms (Guralnick 2011).", "a": "\"Similar to the lungs, the urinary bladder responds to a spectrum of pathologic processes with a <b>limited repertoire of symptoms</b>.\" A symptom alone gives a broad differential."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Irritative symptoms: urgency, frequency, nocturia, painful voiding.", "a": "Urgency: sudden desire to empty. Frequency: ≥8 voids/24 h. Nocturia: ≥1 waking at night. Painful voiding (older term dysuria): burning/stinging."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "\"UTI\" by location.", "a": "Asymptomatic bacteriuria, urethritis, cystitis (bladder), pyelonephritis (kidney), prostatitis, urosepsis."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Ureteropelvic junction (UPJ) obstruction.", "a": "Congenital narrowing where renal pelvis joins ureter → dilated pelvis/calyces → hydronephrosis → atrophy → possible failure. Bilateral = symptoms sooner; unilateral can be silent."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Other congenital ureteral causes.", "a": "Ureteral atresia, bifid ureters."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Retroperitoneal fibrosis.", "a": "Scarring around the ureters (in the retroperitoneum) → encases them → hydronephrosis. Associated with <b>IgG4-related disease</b>, drugs, radiation, surgery, malignancy; occasionally primary (<b>Ormond disease</b>)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "How to tell if a ureteral lesion obstructs.", "a": "\"Look upstream\": a <b>dilated renal pelvis means obstruction</b>; a papilloma with no dilation is not blocking."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Bladder diverticulum: definition and acquired cause.", "a": "Outward pouching of the bladder wall. Acquired: BPH obstructs outflow → distension, muscle hypertrophy forms <b>trabeculae</b> → mucosa pushes out between bands."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Bladder diverticulum complications.", "a": "A pocket outside normal flow does not rinse itself: <b>recurrent UTIs</b> and <b>bladder stones</b> (supersaturation)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Trabeculation means:", "a": "Outlet obstruction (normal bladder lining is fairly smooth)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Bladder exstrophy.", "a": "Developmental defect of the anterior bladder and abdomen so the bladder opens to the outside; associated with other defects."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Cystitis forms.", "a": "Bacterial, hemorrhagic, interstitial, malakoplakia, polypoid."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Bacterial cystitis: etiology and symptoms.", "a": "Most common form of UTI; <b>E. coli ~90%</b>. Painful voiding, frequency, urgency, suprapubic tenderness, hematuria."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Bacterial cystitis urinalysis: key negative.", "a": "Bacteriuria and pyuria; <b>no WBC casts</b> (casts form in tubules; WBC casts mean pyelonephritis or interstitial nephritis)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "UTI culture: when?", "a": "Uncomplicated (typical female): none needed. Young male: think congenital anomaly and culture."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Hemorrhagic cystitis associations.", "a": "<b>Cyclophosphamide</b> (characteristic); adenovirus; leukemia, DIC; severe acute bacterial cystitis; catheters."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Cyclophosphamide twice.", "a": "Causes hemorrhagic cystitis and is a risk factor for bladder cancer (toxic metabolite acrolein)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Interstitial cystitis: hallmark.", "a": "Chronic pain syndrome, commonly females; <b>suprapubic pain worse with bladder filling, improved with emptying</b>; urine culture no growth. Diagnosis of relative exclusion; think chronic pelvic pain."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Interstitial cystitis pathology.", "a": "Nonspecific: fibrosis, <b>mast cells</b> (not diagnostic)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Slide question: 31-year-old woman, 3 months painful voiding, frequency, tiny blood; negative culture.", "a": "<b>Interstitial cystitis</b> (original slide answer D; Kemp corrected to E in the posted copy)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Malakoplakia.", "a": "Macrophages with <b>defective phagocytic activity</b>; plaque-like mucosal lesions; foamy macrophages and <b>Michaelis-Gutmann bodies</b> (laminated, mineralized concretions; \"bull's-eye\")."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 1: Ureter, Bladder, Cystitis", "q": "Polypoid cystitis.", "a": "Submucosal edema → bulbous polypoid projections; usually long-term indwelling catheters; diffuse multiple projections vs neoplasm more likely a single lesion."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Metaplasia definition.", "a": "A relatively normal cell type that does not belong there, caused by a change in stimulus. Metaplasia → dysplasia → neoplasia."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "von Brunn nests.", "a": "Nests of urothelium growing downward into the lamina propria; benign; basis of the variants."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Cystitis glandularis vs cystitis cystica.", "a": "Glandularis: nests with cuboidal/columnar epithelium forming small glands. Cystica: nests with cystic spaces. Metaplastic; potential risk factor."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Intestinal metaplasia of the bladder.", "a": "Goblet cells in the lining; precursor for <b>adenocarcinoma</b>."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Squamous metaplasia of the bladder.", "a": "Urothelium becomes squamous (protection against chronic irritation: recurrent cystitis, catheter, stones); can progress to <b>squamous cell carcinoma</b>."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "\"Transitional epithelium\".", "a": "Old name for urothelium; \"transitional cell carcinoma\" = urothelial carcinoma."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Bladder cancer epidemiology.", "a": "5% of US cancers, 3% of cancer deaths. Urothelial carcinoma <b>95-97%</b>; squamous 3-7%; adenocarcinoma rare; age 50-80."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Bladder cancer risk factors.", "a": "Male &gt; female; urban &gt; rural; whites &gt; African Americans; <b>cigarette smoking</b>; occupational carcinogens; cyclophosphamide; genetic; schistosomiasis (squamous)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Two precursor routes of urothelial carcinoma.", "a": "<b>Papilloma</b> → invasive papillary carcinoma; <b>carcinoma in situ (CIS)</b> → invasive carcinoma."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Papilloma vs low malignant potential vs low-grade vs high-grade.", "a": "Papilloma: completely benign. Low malignant potential: not quite typical. Low-grade: bland nuclei, few mitoses. High-grade: pleomorphic, hyperchromatic, more mitoses. Grade is based on <b>nuclear features</b>."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Urothelial carcinoma gross pattern and grade significance.", "a": "Exophytic (outward growing, polypoid) = good. Higher grade: more recurrence, invasion, progression, death."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Carcinoma in situ.", "a": "Often not identifiable grossly (flat); malignant-appearing cells that have not crossed the basement membrane; <b>50-75%</b> progress if untreated; highly aggressive."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Prognosis: non-invasive vs invasive.", "a": "Non-invasive: <b>grade</b> most important. Invasive: <b>stage</b> (extent of invasion/spread)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Genetics: papillary route.", "a": "Normal → superficial papillary: <b>deletion of 9p or 9q</b>. Papillary → invasive: <b>TP53 mutation</b>."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Genetics: CIS route.", "a": "Normal → CIS: <b>TP53 mutation</b>. CIS → invasive: deletion of 9p or 9q. Others: FGFR3, RAS, PI3K/AKT, RB."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "One-line memory for genetics.", "a": "9p/9q loss → papillary route; TP53 → CIS route (flat, aggressive); either route needs the other hit to invade."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Urothelial carcinoma presentation and diagnosis.", "a": "<b>Painless hematuria</b>; urine cytology and cystoscopy."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Urothelial carcinoma treatment.", "a": "<b>BCG</b> instilled in the bladder elicits granulomatous reaction clearing non-bulky tumor; cystectomy if into muscularis propria or CIS refractory to BCG. Papillary tumors can recur for decades."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Squamous cell carcinoma of bladder: frequency and schistosomiasis.", "a": "3-7% in the US. <b>Schistosoma haematobium</b> eggs → reaction and squamous metaplasia → dysplasia → carcinoma; calcified eggs: fine punctate pelvic calcifications on x-ray."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Squamous cell carcinoma histology.", "a": "<b>Keratin pearls</b> (concentric layers of keratin) and intercellular bridges."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Point to ponder: SCC in the US without schistosomiasis.", "a": "Chronic irritation → squamous metaplasia → dysplasia → tumor; e.g., long-term indwelling Foley catheter (also recurrent infections, chronic stones)."}, {"g": "Lower Urinary Tract Disorders", "l": "Kemp Part 2: Metaplasia & Bladder Cancer", "q": "Slide question: 51-year-old Middle East immigrant, hematuria, punctate pelvic calcifications, invasive SCC.", "a": "<b>Schistosomiasis</b>."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Classic triad of a renal tumor.", "a": "<b>Flank pain, hematuria</b> (often microscopic with episodes of gross) <b>and a palpable flank mass</b>. Only ~10% have the full triad."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Nonspecific renal tumor symptoms.", "a": "Fatigue, anemia (blood loss, general tumor effect), weight loss. Fatigue and weight loss go with any neoplasm."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "How are ~50% of renal cell carcinomas found?", "a": "<b>Incidentally</b> (CT for something else, or a lab finding such as hemoglobin of 19)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Renal cell carcinoma nickname.", "a": "\"The <b>Great Mimicker</b>\"; odd metastases (forehead); consider it when a metastasis has an <b>unknown primary</b>."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Paraneoplastic: erythrocytosis.", "a": "<b>Erythropoietin</b> made by the tumor (the kidney normally makes it)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Paraneoplastic: hypercalcemia.", "a": "<b>PTHrP</b> (parathyroid hormone-related peptide), like squamous cell carcinoma of the lung."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Other RCC paraneoplastic syndromes.", "a": "Cushing (ACTH), feminization/masculinization, hepatic dysfunction, cachexia, hypertension (renin)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Point to ponder: neoplasms with elevated hemoglobin.", "a": "<b>Renal cell carcinoma</b> (EPO), <b>hepatocellular carcinoma</b>, <b>cerebellar hemangioblastoma</b>."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Angiomyolipoma composition.", "a": "<b>Fat</b> (lipoma), <b>smooth muscle</b> (myo), <b>thick-walled blood vessels</b> (angio)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Angiomyolipoma associations.", "a": "<b>Tuberous sclerosis</b> (TSC1 and TSC2), though most are sporadic; benign (no metastasis); tan-yellow with red areas; <b>desmin</b>-positive muscle."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Papillary renal adenoma.", "a": "Small (&lt;1, up to 3 cm; &lt;5 mm papillary = benign); common with age, often multiple; papillary architecture (\"cross-section of a sea anemone\"). Mimic: tiny yellow nodule = ectopic adrenal."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Medullary fibroma (renomedullary interstitial cell tumor).", "a": "Fibrous tissue in the medulla; common autopsy finding; probably the most common benign kidney tumor he sees; few-mm nodules near corticomedullary junction; low cellularity."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Mesoblastic nephroma.", "a": "Hamartoma of spindled/fibroblastic cells; <b>first 3 months of life</b>; benign but ill-defined margins and can recur; infiltrates among normal glomeruli."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Mesoblastic nephroma vs Wilms.", "a": "Wilms usually has three components but can be monophasic (all mesenchymal) and look like mesoblastic nephroma. Mesoblastic = benign; Wilms = malignant."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Oncocytoma: origin and genetics.", "a": "<b>Intercalated cells of collecting ducts</b> (USMLE); loss of chromosomes <b>1, 14 and Y</b>; 3-7% of renal tumors."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Oncocytoma: gross and micro.", "a": "Tan with a <b>central scar</b>; large cells with finely granular eosinophilic cytoplasm (mitochondria); oncocytic change like Hurthle cells."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Oncocytoma vs chromophobe RCC.", "a": "Hard to separate on H&E; Hale's colloidal iron positive in chromophobe."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Another tumor with a central scar.", "a": "Focal nodular hyperplasia of the liver."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Juxtaglomerular cell tumor.", "a": "Benign <b>reninoma</b>: secretes renin → hypertension (often resistant) cured on removal."}, {"g": "Renal Neoplasia", "l": "Kemp Part 1: Presentation & Benign Tumors", "q": "Slide question: 10 cm tan-yellow tumor, red areas, fat + thick vessels, desmin+.", "a": "Angiomyolipoma → <b>tuberous sclerosis</b>."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "RCC demographics.", "a": "3% of adult malignancies; 80-85% of malignant kidney tumors; 6th-7th decades; M &gt; F; incidence increasing, most in developed countries."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "RCC risk factors.", "a": "<b>Cigarette smoking</b>, obesity/lack of exercise (BMI &gt;30), cadmium, hypertension, <b>acquired polycystic kidney disease</b> (long-term dialysis; not autosomal dominant PKD)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "RCC cell of origin and frequency.", "a": "Clear cell: PCT, 65-75%. Papillary: DCT, 10-15%. Chromophobe: intercalated cells, ~5%. Collecting duct: ducts of Bellini, &lt;1%."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "RCC complication: invasion.", "a": "Growth into the <b>renal vein</b>, up the IVC, even to the heart. Not metastasis; HCC does it too."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "RCC metastasis sites.", "a": "Most commonly <b>lungs and bones</b>; diagnosis is often made from metastases."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "RCC T stage.", "a": "T1 &lt;7 cm; T2 &gt;7 cm; T3 veins/perinephric tissue; T4 beyond Gerota's fascia and/or adrenal. \"Know that <b>7 cm</b> is the renal cell cutoff (breast 2 cm).\""}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "RCC management.", "a": "Partial or complete nephrectomy; possible targeted therapy against <b>mTOR</b> (regulates VEGF)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Clear cell RCC gross.", "a": "<b>Yellow</b> (glycogen/lipid) and <b>red</b> (hemorrhage); one of the few tumors with a gross appearance characteristic enough to be tested."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Clear cell RCC micro.", "a": "Clear cells (glycogen) lining a delicate fibrovascular network that easily hemorrhages; bland cells but aggressive; graded by nuclear features."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Cystic mass with solid/papillary/thickened wall.", "a": "Not a simple cyst; needs evaluation (can be cystic clear cell RCC)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Clear cell RCC genetics.", "a": "<b>VHL gene on 3p25</b> (sporadic and von Hippel-Lindau). VHL normally degrades <b>HIFs</b> → loss → more <b>VEGF</b> → blood vessel growth."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Papillary RCC.", "a": "10-15%; yellow, <b>bilateral and multifocal</b>; papillae with fibrovascular cores and <b>foamy macrophages</b>; <b>MET</b> proto-oncogene (7q31), receptor for hepatocyte growth factor."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Chromophobe RCC.", "a": "~5%; intercalated cells; tan-brown; distinct membranes, <b>perinuclear halos</b>; Hale's colloidal iron +; multiple whole-chromosome losses (hypodiploid); better prognosis than clear cell."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Collecting duct carcinoma.", "a": "&lt;1%; medullary; tubular/papillary with single layer cuboidal <b>hobnail</b> cells; very aggressive, usually metastatic at presentation; deletions 1p, 8p, 9p."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Medullary carcinoma.", "a": "Variant of collecting duct only in <b>sickle cell trait or disease</b>."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Slide question: 4.5 cm cystic yellow mass with red areas; why was it found?", "a": "<b>Incidental CT</b> discovery (about half are incidental)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Slide question: 56-year-old, hematuria, 5.5 cm cystic mass, clear cells; risk factor?", "a": "<b>1-2 pack per day smoking</b>; cadmium would need more information."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Wilms tumor demographics.", "a": "Nephroblastoma; third most common organ tumor in children ≤10 (85% of pediatric renal neoplasms); 98% before age 10; peak <b>2-5 years</b>."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Wilms histology.", "a": "<b>Triphasic</b>: blastemal (small round blue cells), stromal (fibrocytic, myxoid, skeletal muscle), epithelial (abortive tubules/glomeruli). Precursor: <b>nephrogenic rests</b>."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Wilms prognosis.", "a": "<b>Anaplasia</b> (~5%) unfavorable; no anaplasia favorable. <b>TP53</b> = worse, almost always with anaplasia. Also worse: increasing age, LOH 1p and 16q, tumor volume."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Wilms presentation.", "a": "Abdominal mass, abdominal pain, intestinal obstruction, hypertension, hematuria, rupture (friable)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "WT1 gene.", "a": "Tumor suppressor regulating transcription of IGF, E-cadherin, PDGF; mutated in 10-20% of sporadic tumors; tumor looks stuck between mesenchyme and epithelium."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "WAGR syndrome.", "a": "<b>W</b>ilms (~30%), <b>A</b>niridia, <b>G</b>enitourinary anomalies, <b>R</b>etardation; <b>deletion of WT1 on 11p13</b> (with PAX6)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Denys-Drash syndrome.", "a": "Wilms (~90%), gonadal dysgenesis, <b>glomerular mesangial sclerosis</b> → early renal failure; dominant negative inactivating WT1 mutation."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Beckwith-Wiedemann syndrome.", "a": "Wilms, overgrowth (hemihypertrophy), visceromegaly, <b>macroglossia</b>, enlarged adrenal cortical cells; hepatoblastoma; <b>WT2 on 11p15.5</b>, imprinting, IGF2 (maternal allele expressed in these tumors)."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Rule of thumb: bilateral primary malignant tumor.", "a": "Consider a <b>familial syndrome</b>."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Renal pelvis urothelial carcinoma.", "a": "5-10% of primary kidney tumors; &lt;5% of urothelial carcinomas are above the bladder; <b>smoking</b>; mostly papillary; graded by nuclear features."}, {"g": "Renal Neoplasia", "l": "Kemp Part 2: RCC, Wilms, Renal Pelvis", "q": "Field effect.", "a": "Whole urothelium exposed to same carcinogens, so a pelvis tumor raises chance of a later bladder tumor. Another field effect: upper and lower respiratory tract (laryngeal SCC and lung cancer in smokers)."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Nephrosclerosis.", "a": "Scarring of the kidney from an underlying vascular condition; two forms depending on which vessel is diseased: arterial vs arteriolar."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Arterial nephrosclerosis: mechanism and cause.", "a": "Atherosclerotic complication (emboli from a plaque, stenosis, thrombosis) → infarct → scar. Hypertension is a major risk factor for atherosclerosis."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Arterial nephrosclerosis: gross.", "a": "<b>Well-defined, variably sized scars</b> (thinned cortex) with <b>normal cortex in between</b>."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Arteriolar nephrosclerosis (arteriolonephrosclerosis): mechanism and cause.", "a": "Generalized thickening of arterioles → low-level, diffuse ischemic injury. Cause: <b>hypertension or diabetes</b>."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Arteriolar nephrosclerosis: gross.", "a": "<b>Diffuse granularity</b> of the cortical surface (\"gravel road\"), whole kidney."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Why granular?", "a": "Each affected arteriole produces a tiny micro-infarct at the cortical surface; thousands give the roughened surface. Each indentation = patch of globally sclerotic glomeruli, scarring, tubular atrophy."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Acute renal infarct.", "a": "Coagulative necrosis from thrombus or embolus, hemorrhage and congestion around it; heals as depressed scar."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Gross trap: scar at a pole.", "a": "Remote infarct or <b>chronic pyelonephritis</b> (classically poles). Kemp finds them hard to tell apart."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Hyaline arteriolosclerosis.", "a": "Pink, acellular, glassy thickening of the arteriolar wall narrowing the lumen. Hypertension: plasma proteins leak into the wall. Diabetes: <b>advanced glycosylation end products</b>. Same picture in both."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Which arterioles: diabetes vs hypertension?", "a": "As Kemp was taught: diabetes involves <b>both afferent and efferent</b>; hypertension only the <b>afferent</b> (pressure differs on the two sides). Not a slide point."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Both nephroscleroses together.", "a": "Hypertension drives atherosclerosis so they coexist: scars plus granular cortex between. Dilated pelvis, thin cortex; chronic pyelonephritis does not cause a granular surface."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Chronic kidney disease look.", "a": "Globally sclerotic glomeruli, tubular atrophy (wider spaces), fibrosis (trichrome), scattered chronic inflammation."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Atheroembolic disease.", "a": "Plaque ruptures, showers cholesterol emboli; classic sign: <b>needle-shaped cleft</b> in a vessel. Other emboli: fat, air, projectiles (shotgun pellets)."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Diffuse cortical necrosis.", "a": "Main renal artery blocked → whole cortex dies; <b>pale yellow</b> cortex everywhere. Small branch = wedge infarct/scar; whole artery = diffuse cortical necrosis."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Triggers for renin release by JG cells.", "a": "<b>Low arteriolar blood pressure, elevated catecholamines, low sodium at the DCT.</b>"}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "RAAS chain.", "a": "Renin: angiotensinogen → angiotensin I; I → II. Angiotensin II: vasoconstriction + aldosterone. Aldosterone: ↑ Na resorption (DCT and collecting tubule), ↑ K excretion; water follows sodium."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Aldosterone-secreting tumor.", "a": "High (or high-normal) sodium, <b>low potassium</b>, plus hypertension."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Kemp on secondary hypertension.", "a": "\"Great test questions\" (unusual clinical settings); a few percent of hypertension is treatable, so find it and you can cure it."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Renal secondary causes of hypertension.", "a": "Acute GN (nephritic), chronic renal disease, ADPKD, renin-producing tumors, renal artery stenosis (FMD or atherosclerotic)."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Renal artery stenosis: two forms.", "a": "<b>Fibromuscular dysplasia (FMD)</b> and <b>atherosclerotic</b>."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "FMD: who and pathology.", "a": "Young females most commonly; <b>medial fibroplasia</b> (60-70%); also perimedial, medial hyperplasia, intimal, adventitial."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "FMD imaging.", "a": "\"<b>String of beads</b>\": alternating stenosis and aneurysmal dilation."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Clue words for FMD.", "a": "Young woman + hypertension resistant to treatment + bilateral stenosis with intervening aneurysmal dilations. Resistant HTN → think secondary cause."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Atherosclerotic renal artery stenosis: who.", "a": "Older, male, hypertension, diabetes, high cholesterol, smoking; plaque often at origin; focal narrowing."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Unilateral RAS: stenotic kidney.", "a": "<b>Small, atrophic, smooth</b> cortical surface; thinks the body is hypotensive → activates RAAS → raises systemic pressure."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Unilateral RAS: contralateral kidney.", "a": "<b>Normal size, granular surface</b> (hyaline arteriolosclerosis) from the high pressure the other kidney caused."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Kemp's logic on RAS.", "a": "The body would rather be hypertensive than hypotensive; the stenotic kidney controls the pressure, too high for the other side."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Bartter: defect.", "a": "Lost Na resorption in the <b>thick ascending limb</b> (Na⁺-K⁺-2Cl⁻); volume loss, RAAS on, hypokalemia, <b>hypercalciuria</b> (no K⁺ recycling → no lumen-positive drive), hypomagnesemia; not hypertensive; stone risk."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Gitelman: defect.", "a": "Lost Na⁺-Cl⁻ in the <b>DCT</b>; RAAS on, hypokalemia, <b>hypocalciuria</b>, hypomagnesemia; no stones."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Liddle: defect.", "a": "<b>Gain of function</b> of collecting duct Na channel (aldosterone's); ↑ Na absorption, water retained → <b>hypertension</b>, ↑ K excretion → hypokalemia, <b>low aldosterone</b>."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Kemp's promise on Bartter/Gitelman/Liddle.", "a": "No exam question on them; the mechanism explains each electrolyte pattern."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 1: Nephrosclerosis, HTN, RAS, Tubular Syndromes", "q": "Pattern: lose vs gain sodium.", "a": "Lose Na upstream (Bartter, Gitelman) → volume depletion, high renin/aldosterone. Gain Na (Liddle) → hypertension, suppressed aldosterone. Bartter (loop-like) wastes calcium; Gitelman (thiazide-like) retains it."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Thrombotic microangiopathy (TMA).", "a": "Disease of small vessels (arterioles, venules, capillaries) with tiny thrombi throughout."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "TMA vs DIC.", "a": "Microscopy looks the same, but in DIC clotting factors are used up so <b>PT and PTT abnormal</b>. In TMA <b>PT/PTT normal</b>; platelets low."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "TMA types.", "a": "Primary: TTP and HUS. Secondary: drugs (mitomycin, cisplatin, cyclosporine), autoimmune (SLE, scleroderma), malignant hypertension (onion-skinning), pregnancy/postpartum."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Typical HUS (D+).", "a": "Diarrhea-associated: E. coli, Shigella; <b>Shiga toxin</b> (glomerular endothelial cells have its receptor)."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Atypical HUS (D−).", "a": "Mutation in or autoantibodies against <b>factor H</b> (and C3 and other complement factors controlling C3 convertase)."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Clinical pentad of TMA.", "a": "<b>Microangiopathic hemolytic anemia</b> (schistocytes), <b>thrombocytopenia</b>, <b>fever</b>, <b>CNS changes</b> (more TTP), <b>renal disease</b> (more HUS). Need not have all five."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "TTP defect.", "a": "<b>ADAMTS13</b>: inherited or antibodies (autoimmune/drug) → large <b>VWF multimers</b> activate platelet aggregation → thrombosis. Leans CNS."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "HUS leans toward.", "a": "Kidney disease; sudden onset after GI or flu-like illness."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Where to look for microthrombi.", "a": "Kidney (silver stain: thrombi in glomerular capillary loops). Kemp's TTP autopsy: microthrombus in cardiac AV node vessels → suspected arrhythmia."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Slide question: 17-year-old, fever, pallor, oliguria, petechiae, low Hgb/platelets, high BUN/Cr, raw beef.", "a": "<b>Hemolytic uremic syndrome</b> (Shiga toxin-producing E. coli)."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Vasculitis definition and size rule.", "a": "Inflammation of the vessel wall. Large = aorta/big muscular arteries; medium = muscular arteries; small = arterioles, capillaries, venules; overlap exists (PAN is medium but can involve others)."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Vasculitis differential rule.", "a": "Any systemic illness involving many organs may be a vasculitis; usual symptoms fever, myalgia, arthralgia, malaise; diagnosis needs the combination."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "p-ANCA vs c-ANCA.", "a": "<b>p</b> = perinuclear, <b>MPO</b>, microscopic polyangiitis. <b>c</b> = cytoplasmic, <b>PR3</b>, granulomatosis with polyangiitis (Wegener, \"c for classic\"). Kemp retracted his own mnemonic."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "ANCA percentages.", "a": "GPA: c-ANCA 66%, p 24%. MPA: c 26%, p 58%. EGPA: c &lt;5%, p 40%. Not absolutely specific; part of the overall diagnosis."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "How ANCA injures.", "a": "Autoantibodies directly activate neutrophils (reactive oxygen species and enzymes)."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Polyarteritis nodosa (PAN).", "a": "Kidneys, heart, muscle, skin, mesentery; <b>temporally heterogeneous</b> (different-age lesions); segmental fibrinoid necrosis with transmural inflammation; <b>ANCA negative</b>; <b>hepatitis B</b>."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "PAN segmental nature.", "a": "Necrosis on one side, intact vessel on the other; why pathologists cut many sections of a temporal artery biopsy."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Microscopic polyangiitis (MPA).", "a": "<b>RPGN</b> (proteinuria, hematuria, RBC casts), <b>pulmonary capillaritis</b> (looks like Goodpasture, but no linear IF), purpura, neuropathy, GI; <b>p-ANCA (MPO)</b>; all lesions the <b>same age</b>."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "Granulomatosis with polyangiitis (GPA) triad.", "a": "<b>Upper respiratory</b> (sinusitis, perforated nasal septum), <b>lower respiratory</b>, <b>kidney</b>; c-ANCA (PR3); males ~40."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "GPA pathology.", "a": "Fibrinoid necrosis, necrotizing/non-necrotizing granulomas, focal necrotizing to <b>crescentic GN</b>. Kemp has rarely identified true granulomas in biopsies."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "EGPA (Churg-Strauss).", "a": "Rare; <b>asthma and eosinophilia</b> are the clinical hook; p-ANCA minority; granulomas and eosinophilic infiltrates."}, {"g": "Renal Vascular Disease", "l": "Kemp Part 2: TMA & Vasculitis", "q": "IgA vasculitis (Henoch-Schonlein).", "a": "90% childhood; related to IgA nephropathy; <b>purpura</b> (lower extremities), arthralgia, abdominal pain, renal disease; <b>leukocytoclastic vasculitis with IgA</b>."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "AKI vs ATI/ATN.", "a": "AKI is the broad category (sudden fall in kidney function); <b>acute tubular injury/necrosis</b> is only one cause, a specific tubular disease."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Dr. Kemp's method for the AKI differential.", "a": "Split into big categories first (<b>before, in, after the kidney</b>), then get specific."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "AKI categories (slide).", "a": "<b>Pre-renal</b> (hypoperfusion, shock, dehydration); <b>renal</b>: glomerular, tubulointerstitial, vascular; <b>post-renal</b> (obstruction: BPH, stones)."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Renal tubulointerstitial causes of AKI.", "a": "Acute tubular necrosis, acute interstitial nephritis, acute pyelonephritis."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Renal vascular causes of AKI.", "a": "Thrombotic microangiopathy, vasculitis, atheroembolic disease."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "His take on nephrotic vs nephritic as AKI.", "a": "Nephrotic: loses protein but not otherwise failing — weak fit for \"acute\". Nephritic/RPGN: hypertension, oliguria, real loss of function — the glomerular causes of AKI."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Post-renal example: prostatic hyperplasia.", "a": "Blocks urine → backs up in the bladder → pressure in the kidney → hydronephrosis → failure."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Lab testing in AKI: GFR, BUN and creatinine.", "a": "Reduced GFR = reduced function; BUN and creatinine elevated; pattern distinguishes pre-renal, renal, post-renal."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Urinalysis casts: RBC casts.", "a": "<b>Glomerular injury</b> (nephritic, rapidly progressive GN)."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Urinalysis casts: WBC casts.", "a": "Infection or inflammation (pyelonephritis, acute interstitial nephritis)."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Urinalysis casts: ATN.", "a": "<b>Tubular cell (epithelial) casts and granular \"muddy brown\" casts</b>."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Renal biopsy in AKI.", "a": "For atypical presentations that fit no clinical pattern; weigh benefit against risk of \"a long needle in the kidney\"."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Why \"injury\" is preferred over \"necrosis\".", "a": "Tubules can be damaged and not working without visible necrosis; you can diagnose ATN when you see necrosis."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "ATN: clinical features.", "a": "Acute decline in function, decreased GFR from injury to tubular epithelial cells; oliguria possible; granular (muddy) and cellular casts."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "ATN etiology: two mechanisms.", "a": "<b>Ischemia</b> (shock, hypoperfusion) and <b>nephrotoxic</b> (gentamicin, contrast, heavy metals, organic solvents, ethylene glycol)."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Why are tubules vulnerable?", "a": "(1) They need lots of ATP (pumps), so low oxygen hits them first. (2) Luminal solutes get concentrated as water is reabsorbed, so toxins reach high levels."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "How does tubular injury lower GFR?", "a": "Loss of cell polarity → Na⁺ not reabsorbed in proximal tubule → more Na⁺ to distal tubule → arteriolar vasoconstriction → ↓ GFR; sloughed cells form obstructing casts; <b>backleak</b> of filtrate; inflammatory cells → more injury."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "ATN pathology.", "a": "<b>Coagulative necrosis</b> of tubules: architecture preserved but nuclei gone or pale; proximal tubule dies, distal tubule survives; debris and shed cells become the casts."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Ischemic vs toxic ATN.", "a": "Pathology usually cannot tell; use the history and any special finding (like crystals)."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Ethylene glycol ATN.", "a": "Not itself harmful: <b>alcohol dehydrogenase converts it to oxalic acid</b>, which deposits as polarizable crystals in the kidney."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 1: AKI & ATN", "q": "Slide question: 22-year-old unresponsive, green-yellow antifreeze, no urine for 12 h.", "a": "<b>Acute tubular necrosis</b>."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Nephrolithiasis: meaning and pathogenesis.", "a": "\"Litho\" = stone (compare cholelithiasis); pathogenesis: <b>supersaturation</b> of the urine with a stone component."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Stone risk factors.", "a": "Low fluid intake; diet high in sodium, refined sugars, oxalate, animal protein; grapefruit or apple juice."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Stone epidemiology (Kemp).", "a": "By age 70, <b>11% of men and 5-6% of women</b>."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Stone type frequencies.", "a": "Calcium oxalate/phosphate <b>80%</b>; struvite 10%; uric acid 6-7%; cystine 1%."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Stone clinical presentation.", "a": "Hematuria; renal colic (crampy pain from something squeezed through the ureter); obstruction → hydronephrosis → parenchymal atrophy; predisposition to infection."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Complete vs gradual obstruction.", "a": "Sudden complete → acute renal failure; gradual → chronic renal failure."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Point to ponder: why do stones predispose to infection?", "a": "A stone has no blood flow, so antibiotics cannot reach bacteria living in its \"nooks, crannies and spikes\"."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Calcium stone metabolic causes.", "a": "Idiopathic hypercalciuria 50%; hypercalcemia with hypercalciuria (hyperparathyroidism) 10%; hyperoxaluria 5%; hyperuricosuria 20%; none known 15-20%."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Calcium phosphate vs oxalate pH.", "a": "High (alkaline) pH favors calcium phosphate; Kemp could not find a firm pH requirement for calcium oxalate. By the numbers, calcium oxalate is the most likely stone."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Uric acid stones.", "a": "Gout and rapid cell turnover (leukemia, lymphoma, tumor lysis); <b>acidic urine (below 5.0)</b>; hyperuricemia not required; <b>radiolucent</b> (the only one)."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Struvite stones.", "a": "Magnesium-ammonium-phosphate, \"triple stones\"; <b>alkaline urine</b> with UTI by urease-splitting bacteria: <b>Proteus</b> (classic), Pseudomonas, Citrobacter, Klebsiella; urease splits urea → ammonia."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Staghorn calculi.", "a": "Branch through the renal pelvis and calyces like deer or elk antlers; may need nephrectomy (cannot pass, lithotripsy unlikely to break up)."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Xanthogranulomatous pyelonephritis.", "a": "Complication of staghorn: parenchyma replaced by pale, lipid-filled macrophages (\"xantho\" = yellow)."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Cystine stones.", "a": "Cystinuria (inherited, types I-III); acidic urine; radio-opaque but less than calcium and struvite."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Stone vs x-ray vs urine pH (slide).", "a": "Ca oxalate/phosphate: radio-opaque, phosphate alkaline. Uric acid: radiolucent, acidic (&lt;5.0). Struvite: radio-opaque, alkaline. Cystine: radio-opaque (less), acidic."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Diseases associated with hypercalciuria.", "a": "Hyperparathyroidism; vitamin D excess; distal (type 1) RTA; ketogenic diet."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Diseases associated with hyperuricosuria.", "a": "Gout; lymphoproliferative/myeloproliferative disorders; tumor lysis syndrome; <b>Lesch-Nyhan</b>."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Hyperoxaluria associations.", "a": "Inflammatory bowel disease; small bowel resection."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Best lab test for stones; crystal shapes.", "a": "<b>Analyze the stone itself.</b> Crystals do not prove stones. <b>Envelope = calcium oxalate; coffin lid = struvite.</b>"}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Urine pH to stone type.", "a": "Acidic → uric acid or cystine; alkaline → struvite or calcium phosphate."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Slide question: 42-year-old, back pain, hematuria, radio-opaque mass.", "a": "Uric acid out (radiolucent); struvite and cystine less common; hemosiderin is a pigment; <b>calcium oxalate</b> by the numbers."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Hydronephrosis: definition.", "a": "Dilation of the renal pelvis and calyces with <b>atrophy of the overlying parenchyma</b>; obstruction is the main cause."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Hydronephrosis causes: congenital and obstructing body.", "a": "Congenital: aberrant renal artery, ureteral atresia, ureteral valve. Obstructing body: calculus; necrotic papilla."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Hydronephrosis causes: proliferative, inflammatory, neurogenic, pregnancy.", "a": "Papilloma, tumor, BPH (bilateral); retroperitoneal fibrosis (IgG4), prostatitis; spinal cord injury; pregnancy (uterus pinches ureter)."}, {"g": "Acute Kidney Injury and Nephrolithiasis", "l": "Kemp Part 2: Stones & Hydronephrosis", "q": "Dr. Kemp's tip on hydronephrosis causes.", "a": "\"Think general anatomy: what could a mass push on in this area?\""}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Kemp's two main types of disease involving the tubules and interstitium", "a": "Tubulointerstitial nephritis (cause: inflammation) and ischemic or toxic tubular injury (clinically: acute kidney injury, AKI). Tubules and interstitium are separate components of the renal parenchyma, but when disease involves one it usually involves the other."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Urinalysis in tubulointerstitial nephritis vs glomerular disease", "a": "Often no significant proteinuria or hypoalbuminemia; sterile pyuria and white blood cell (WBC) casts (versus red blood cell casts in glomerular disease)."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Tubular defects seen in tubulointerstitial nephritis", "a": "Concentrating defect (polyuria, nocturia); renal tubular acidosis (RTA); salt-losing nephropathy; osteomalacia (vitamin D deficiency)."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Red blood cell casts", "a": "Glomerulonephritis."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "White blood cell casts", "a": "Infections (kidney) and interstitial nephritis."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Pigmented granular (muddy) casts and renal tubular epithelial cell casts", "a": "Acute tubular injury (or necrosis)."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Waxy / fatty / hyaline casts", "a": "Waxy: chronic renal failure. Fatty: nephrotic syndrome. Hyaline: may be normal."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Oxalate crystals", "a": "Calcium oxalate is the most common stone; seen with ethylene glycol ingestion."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Acute pyelonephritis: definition (pyelo- = ?)", "a": "Acute infection, usually bacterial, of the kidney. Pyelo- is for pelvis."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Most common etiologic agent of acute pyelonephritis", "a": "Escherichia coli (73–82%). Kemp's case: dysuria and frequency, then fever, costovertebral angle (CVA) tenderness, WBC casts = E. coli."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Risk factors for acute pyelonephritis (Robbins)", "a": "Female > male; urinary obstruction; instrumentation; vesicoureteral reflux (congenital, or acquired from spinal cord/peripheral nerve injury); pregnancy; diabetes mellitus; immunosuppression/immunodeficiency."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Risk factors for pyelonephritis per Colgan and Williams (2011)", "a": "Sexual intercourse three or more times per week; urinary tract infection (UTI) in the past 12 months; diabetes mellitus; stress incontinence. Pregnancy is not listed."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Pathology of acute pyelonephritis; laterality", "a": "Abscess formation, tubules filled with neutrophils; most often unilateral."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Clinical presentation of acute pyelonephritis", "a": "CVA tenderness; fever, chills, malaise, nausea; dysuria, frequency, urgency; often a previous UTI."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Age/sex pattern of acute pyelonephritis", "a": "Ages 1–40: higher in females (males with congenital anomalies present earlier). After age 40: incidence in males rises due to urinary obstruction."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Robbins on bacteriuria in pregnancy", "a": "4–6% of pregnant women develop bacteriuria; 20–40% of these develop symptomatic UTI if untreated. (Colgan and Williams: pregnant women account for only a small percentage of cases.)"}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Papillary necrosis: description and pathology", "a": "Necrosis of the renal papillae: ischemic injury with suppurative necrosis; papillae may slough and obstruct the ureter."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Predisposing conditions for papillary necrosis", "a": "Diabetes mellitus, urinary tract obstruction, analgesic abuse, sickle cell anemia."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Chronic pyelonephritis: description and the two Robbins forms", "a": "Chronic disease from recurrent inflammation due to obstruction or reflux; a cause of chronic renal failure and hypertension. Forms: chronic obstructive pyelonephritis and chronic reflux-associated pyelonephritis (reflux most often congenital vesicoureteral reflux). Recurrent infection → repeated inflammation → scarring; bilateral or unilateral."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Gross pathology of chronic pyelonephritis", "a": "Unilateral or bilateral unequal scarring of the cortex, often at the poles, with blunted underlying calyx."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Microscopic pathology of chronic pyelonephritis", "a": "Patchy fibrosis and chronic inflammatory infiltrates (lymphocytes, plasma cells); thyroidization of the tubules; globally sclerotic glomeruli."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Why polyuria and nocturia in chronic pyelonephritis?", "a": "Loss of tubules → tubular dysfunction and inability to concentrate urine (hyposthenuria). Gradual onset renal failure; secondary glomerulonephritis adds proteinuria."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Case: 49-year-old man, creatinine slowly rising over 2 years, nocturia, 1+ protein", "a": "Chronic pyelonephritis."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Acute (drug-induced) interstitial nephritis: description and timing", "a": "Interstitial inflammation associated with drug use: fever, eosinophilia, rash and renal abnormalities about 2 weeks (~15 days) after starting the drug; can have hematuria, leukocyturia, some proteinuria."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Drugs associated with acute interstitial nephritis", "a": "Synthetic penicillins (methicillin, ampicillin), diuretics, NSAIDs, and many others."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Pathogenesis of acute interstitial nephritis", "a": "Type I or Type IV hypersensitivity: the drug acts as a hapten, is secreted from tubules, binds a cytoplasmic or extracellular region and promotes IgE and/or cell-mediated reactions."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Case: 61-year-old woman on methicillin for pneumonia; rash, fever, eosinophilia, creatinine up, WBC casts, 1+ protein, no blood", "a": "Acute interstitial nephritis."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Microscopic pathology of acute drug-induced interstitial nephritis", "a": "Edema; infiltrate of lymphocytes and macrophages, can have eosinophils and neutrophils; occasional granulomas."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Kodner and Kudrimoti (2003): reliability of fever, rash, arthralgias", "a": "May be absent in up to two thirds of patients. Clinical features are essentially those of acute renal failure from any cause; no specific history, exam or lab finding distinguishes it."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Gold standard for acute interstitial nephritis; limits of urine eosinophils and gallium 67 scan", "a": "Renal biopsy. Urine eosinophils and gallium scanning give suggestive evidence but cannot reliably confirm or exclude the diagnosis."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Epidemiology of acute interstitial nephritis", "a": "Up to 1% of renal biopsies for hematuria or proteinuria; up to 5–15% of people hospitalized for AKI."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Chronic tubulointerstitial nephritis: description, pathology, presentation", "a": "Chronic kidney disease from low-level (not acutely toxic) exposure to a substance over time. Interstitial inflammatory infiltrate, fibrosis, tubular atrophy. Gradual renal dysfunction."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Most common worldwide cause of chronic tubulointerstitial nephritis", "a": "Analgesic nephropathy: aspirin with phenacetin, caffeine, or acetaminophen."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Other etiologies of chronic tubulointerstitial nephritis", "a": "Immune-mediated (sarcoidosis); toxins (lead, cadmium); metabolic (hyperuricemia, hyperoxaluria, hypercalcemia, hypokalemia); multiple myeloma."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Cast/cast-like disorders (accumulations within renal tubules)", "a": "Hemolysis, rhabdomyolysis, multiple myeloma (casts often appear cracked), nephrocalcinosis."}, {"g": "Tubular and Interstitial Disease", "l": "Kemp Parts 1–2", "q": "Renal tubular acidosis (RTA) types Kemp lists", "a": "Distal tubular acidosis (type 1), proximal tubular acidosis (type 2), hyperkalemic tubular acidosis (type 4)."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "AKI definition (his slide) and the kidney functions he lists.", "a": "An <b>acute decrease in kidney function</b> that can be multifactorial in origin and involves complex pathophysiologic mechanisms; a <b>clinical syndrome</b>, not a single disease; \"not a moment in time\": prolonged AKI can lead to CKD.<br><b>Kidney functions (his list):</b> regulate water, electrolyte and acid-base balance; remove metabolic waste; remove drugs, drug metabolites and other bioactive substances."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Only three ways to treat ESRD; biggest causes.", "a": "Kidney transplant, hemodialysis, peritoneal dialysis. Biggest causes: <b>diabetes mellitus and hypertension</b>."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "KDIGO staging uses which two parameters?", "a": "<b>Serum creatinine and urine output</b>; meeting either puts the patient in that stage."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "KDIGO stage 1.", "a": "Creatinine 1.5-1.9 × baseline or ≥0.3 mg/dL increase; urine output &lt;0.5 mL/kg/h for 6-12 hours."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "KDIGO stage 2.", "a": "Creatinine 2.0-2.9 × baseline; urine output &lt;0.5 mL/kg/h for ≥12 hours."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "KDIGO stage 3.", "a": "3.0 × baseline or ≥4.0 mg/dL or start of renal replacement therapy (or eGFR &lt;35 if under 18); urine output &lt;0.3 mL/kg/h for ≥24 h or anuria ≥12 h."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Limits of KDIGO (his point).", "a": "Both inputs are variable: creatinine moves with hydration; urine output is hard to measure without a Foley. Dr. Kemp's lecture does not stage AKI."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "AKI risk factors: nonmodifiable (slide).", "a": "AIDS, CKD, chronic liver disease, CHF, diabetes, older age (≥65), PVD, prior kidney surgery, renal artery stenosis."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "AKI risk factors: modifiable (slide).", "a": "Anemia, hypercholesterolemia, hypertension, hypoalbuminemia, hyponatremia, mechanical ventilation, nephrotoxic drug use, rhabdomyolysis, sepsis."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Three buckets of AKI etiology.", "a": "<b>Pre-renal</b> (kidney not perfused), <b>intrinsic renal</b> (glomeruli or tubules; most common ATN), <b>post-renal</b> (obstruction: prostate, bladder, mass on ureters)."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Pre-renal causes (Table 3).", "a": "Intravascular volume depletion; peripheral vasodilation (sepsis, cirrhosis, anaphylaxis); reduced cardiac output; renal vasoconstriction (early sepsis, hepatorenal, hypercalcemia, contrast); increased intra-abdominal pressure (abdominal compartment syndrome)."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Intrinsic causes (Table 3).", "a": "Glomerular injury; microvasculature (malignant HTN, toxemia of pregnancy, scleroderma); tubular injury (endogenous: myoglobin, hemoglobin, uric acid; exogenous: antibiotics, chemo, contrast; ischemia); tubulointerstitial (allergic interstitial nephritis, infections); vascular."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Post-renal causes (Table 3).", "a": "Lower tract (bladder neck, neurogenic bladder, prostate, urethral); upper tract extrinsic (retroperitoneal tumors, fibrosis, ureteral ligation); upper tract intrinsic (nephrolithiasis, strictures, clots, sloughed papillae)."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Evaluation of AKI: most important element.", "a": "<b>History and physical</b> (no magic test). History: medications (toxic drugs). Physical: volume status, cardiovascular status. He stresses it is too often skipped."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Labs and imaging in AKI.", "a": "CBC, metabolic profile (BUN, creatinine), urinalysis, creatinine clearance. Ultrasound is limited: only to find obstruction or suggest CKD (<b>kidney length &lt;8 cm</b>); does not help pre-renal or intrinsic disease."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "AKI treatment objectives.", "a": "Treat the underlying cause; limit damage quickly; achieve normovolemia and hemodynamic stability; correct electrolytes; discontinue or adjust nephrotoxic drugs."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "AKI fluid and diuretics.", "a": "Isotonic crystalloids best (lactated Ringer's). Diuretics only if fluid overloaded (\"flogging a dead horse\" otherwise)."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "AKI vasoactive drug and MAP goal.", "a": "<b>Norepinephrine</b> shown best; keep MAP &gt;65 (ideal 65-75); kidney function suffers below 65."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "MAP formula and example.", "a": "MAP = diastolic + ⅓ (systolic − diastolic). 120/60 → pulse pressure 60 → MAP = 80."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Nephrotoxic drugs associated with ATN.", "a": "Aminoglycosides, NSAIDs, ACE inhibitors, ARBs, amphotericin, cisplatin, foscarnet, iodinated contrast, pentamidine, tenofovir, zoledronic acid."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Drugs needing dose adjustment in AKI.", "a": "Analgesics (morphine, meperidine, gabapentin, pregabalin), lamotrigine, acyclovir/ganciclovir, fluconazole, almost all antimicrobials, sulfonylureas, metformin, allopurinol, baclofen, colchicine, digoxin, lithium, LMWH, NOACs."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Management by cause.", "a": "Pre-renal: isotonic crystalloid, vasopressors. Intrinsic: consider biopsy, nephrology. Post-renal: ultrasound, relieve obstruction, urology."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Indications for nephrology consult.", "a": "Inadequate response to supportive care; no clear cause (biopsy); stage 3 or higher; preexisting stage 4 CKD; any need for renal replacement; any transplant patient."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "AKI prevention and follow-up.", "a": "Best-proven prevention: identify high-risk patients and correct problems early. Follow-up: return to baseline quickly (long recovery → higher ESRD risk); nephrology referral at 3 months has been recommended."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 1: AKI", "q": "Three take-homes (AKI).", "a": "History and physical; complete medication history; treat the cause and stabilize."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Nephrolithiasis definition and view.", "a": "Syndrome with solid crystalline masses in the urinary space; once a urologic illness, now a chronic medical condition (genetic, metabolic, environmental: hot, humid climates, dehydration). Stones are a post-renal cause of AKI."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "AKI and stone epidemiology: frequency and recurrence.", "a": "<b>AKI:</b> 5-7.5% of hospitalized patients; may reach <b>50-60%</b> in critically ill.<br><b>Stone frequency:</b> lifetime risk <b>1 in 11</b> (~10%); 3.2% (1976-80) → 8.8% (2014); male:female <b>2:1</b> (was 3:1); highest in men over 80; children: more females.<br><b>Recurrence:</b> <b>50% in 10 years, 75% in 20 years</b>; 15% new stone in first year; family history 2.5-fold.<br><b>Recurrence risk factors:</b> male sex; diabetes, hypertension, gout, metabolic syndrome; obesity; increased urine acidity (uric acid stones); low urine volume; infection."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Stone pathogenesis: supersaturation, inhibitors, promoters and Randall plaques.", "a": "Decreased urine volume and increased excretion of stone-forming components (<b>supersaturation</b> → nucleation → growth → aggregation).<br><b>Inhibitors:</b> <b>citrate</b>, uromodulin, magnesium, pyrophosphate, osteopontin. <b>Promoters:</b> high substrate concentration, slow urinary flow, salting out, Randall plaques/plugs, bacterial products, cell injury.<br><b>Randall plaque/plug:</b> a plaque (usually calcium) forms in the tubule and subtubular tissue, ruptures through the epithelium, and stone material aggregates on it."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Calcium oxalate stones.", "a": "<b>70-75%</b>; acidic urine; malabsorption (e.g., gastric bypass) raises risk."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Calcium phosphate stones.", "a": "~10%; <b>alkaline</b> urine; grow faster and bigger."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Uric acid stones.", "a": "8-10%; acidic urine; often bladder stones; gout."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Struvite stones.", "a": "Alkaline urine; <b>always associated with infection</b>: gram-negative, urea-splitting bacteria break urea into ammonia."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Cystine stones.", "a": "1-2%; familial genetic defect: tubules fail to reabsorb cystine, lysine, ornithine, arginine."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Stone presentation.", "a": "Can be asymptomatic; <b>colicky pain (renal colic)</b> most common; hematuria second (microscopic in ~95% day 1, ~65% by day 3-4); dysuria, urgency, nausea, vomiting."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Stone imaging: gold standard.", "a": "<b>Non-contrast CT</b>. KUB shows calcium stones and follows passage (strain urine); ultrasound not very accurate (~55% in ED) but <b>test of choice in pregnancy</b>; IVP much higher radiation."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Key contrast with AKI: imaging.", "a": "In AKI imaging is not very important (history and physical lead); in stones imaging is very important."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Stone workup labs.", "a": "Metabolic profile, serum uric acid, phosphate, PTH, urinalysis with microscopy (crystals, bacteria, blood), urine culture and sensitivity."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Differential diagnosis of renal colic.", "a": "Bleeding into the kidney (clot), pyelonephritis, ectopic pregnancy, ovarian torsion, dysmenorrhea, appendicitis, <b>aortic aneurysm</b>, biliary colic, mesenteric ischemia, costochondritis, lobar pneumonia."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Hydronephrosis of pregnancy.", "a": "Uterus rotates (dextrorotation) and lies on the right ureter → dilates ureter and kidney → colic (he adds this himself)."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Stone size and chance of passing.", "a": "&lt;5 mm &gt;60%: supportive, hydration, strain. 5-10 mm ~50%: + medical expulsive therapy. &gt;10 mm ~25%: urology."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Medical expulsive therapy.", "a": "Alpha blockers (tamsulosin) or calcium channel blockers (nifedipine); relax ureteral smooth muscle; more effective for distal stones."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Stone pain control.", "a": "NSAIDs work as well as opioids and avoid opioid-abuse risk. But NSAIDs are on the ATN drug list — think twice with AKI/obstruction."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Long-term stone care.", "a": "Dietary modification (hard to sustain; hallmark of long-term care) and a 24-hour urine."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "ESWL.", "a": "Treatment of choice for stones <b>10-25 mm</b>; water bath; repeatable."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Stone procedures and complications.", "a": "<b>Other procedures:</b> cystoscopy with stent (drains hydronephrosis); ureteroscopy with laser lithotripsy; <b>percutaneous nephrostomy</b> (bedside; useful in pregnancy); robotic pyelolithotomy (rare).<br><b>Complications:</b> AKI (post-renal), CKD if not treated, infection (blocked ureter), recurrence."}, {"g": "AKI and Nephrolithiasis: Clinical Approach", "l": "Bell Lecture 2: Nephrolithiasis", "q": "Hospital admission for stones.", "a": "Inadequate pain relief; cannot tolerate oral intake; <b>obstructed pyelonephritis</b> (stent/drainage + IV antibiotics); transplanted kidney; pyelonephritis/sepsis; intractable vomiting; fever, AKI or anuria → urgent urology."}, {"g": "Chronic Kidney Disease", "l": "eGFR, BUN & Uremia", "q": "CKD stage 3: GFR range and label.", "a": "<b>GFR 30–60</b> mL/min: mild–moderate CKD."}, {"g": "Chronic Kidney Disease", "l": "eGFR, BUN & Uremia", "q": "CKD stage 4: GFR range and label.", "a": "<b>GFR 15–30</b> mL/min: severe CKD."}, {"g": "Chronic Kidney Disease", "l": "eGFR, BUN & Uremia", "q": "CKD stage 5: GFR cut-off and label.", "a": "<b>GFR &lt;15</b> mL/min: kidney failure."}, {"g": "Chronic Kidney Disease", "l": "eGFR, BUN & Uremia", "q": "Azotemia vs uremia: which is which?", "a": "<b>Azotemia</b> = elevated BUN (e.g., \"prerenal azotemia\"). <b>Uremia</b> = azotemia that is clinically relevant (signs and symptoms). Normal BUN is ~15–20; symptoms typically appear at BUN ~100–110 or higher."}, {"g": "Chronic Kidney Disease", "l": "eGFR, BUN & Uremia", "q": "What is often the first uremic symptom (GI/nutrition)?", "a": "<b>Anorexia and weight loss</b> (often first), plus abnormal taste (\"sucking on a penny\"; meat feels unappealing) and nausea/vomiting."}, {"g": "Chronic Kidney Disease", "l": "Cause & Genetics", "q": "Interstitial nephritis: what is the classic triad?", "a": "<b>Fever, rash, eosinophilia.</b> Urine eosinophils are no longer favored clinically, but look for them in question stems."}, {"g": "Chronic Kidney Disease", "l": "Cause & Genetics", "q": "Most common cause of interstitial nephritis (and its share)?", "a": "<b>Drug-induced, ~75%</b>: antibiotics, NSAIDs, PPIs (most common)."}, {"g": "Chronic Kidney Disease", "l": "Cause & Genetics", "q": "ADPKD: genes, frequency and key associations.", "a": "<b>PKD1, PKD2.</b> Most common cause of polycystic kidneys (90%); 10% of kidney failure. Hypertension 70–80%, hepatic cysts &gt;90% over age 35, intracranial aneurysms 9–14%. ~50% need kidney replacement by ~62 y. <b>Next best step: screen for intracranial aneurysms</b> (coiling can save life). Imaging: kidneys replaced by innumerable cysts plus liver cysts."}, {"g": "Chronic Kidney Disease", "l": "Cause & Genetics", "q": "Tuberous sclerosis complex (TSC): genes and features.", "a": "<b>TSC1, TSC2</b> (inactivating, chromosome 9); encode hamartin and tuberin. Benign tumors of skin, brain and kidney; epilepsy, intellectual disability; <b>kidney angiomyolipomas</b>. Lifetime RCC risk 2–3%."}, {"g": "Chronic Kidney Disease", "l": "Cause & Genetics", "q": "Von Hippel-Lindau (VHL): inheritance, gene and features.", "a": "Autosomal dominant; <b>VHL tumor suppressor gene, chromosome 3</b>. Tumors of eyes, cerebellum, spinal cord, adrenals, epididymis, pancreas. Pheochromocytoma in 15–30% (episodic sweating, headache, palpitations). <b>Lifetime RCC risk 70%</b>."}, {"g": "Chronic Kidney Disease", "l": "Blood, Ca/Phos/PTH", "q": "What type of anemia occurs in CKD?", "a": "<b>Normocytic, normochromic anemia</b> with an inappropriately low reticulocyte response: falling EPO from the kidney's interstitial fibroblasts means the
