nical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Substances that raise BP.", "a": "NSAIDs, decongestants, TCAs, estrogen-containing contraceptives, excess caffeine, herbal supplements, cocaine, amphetamines."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Nonadherence: why and what to do?", "a": "Patients often feel no symptoms; simplify regimens, home BP monitoring, lifestyle changes."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "First-line for essential hypertension without compelling comorbidity.", "a": "Thiazide/thiazide-like diuretics, ACE inhibitors, ARBs, CCBs."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "CKD: preferred.", "a": "<b>ACEi/ARB</b> (↓ intraglomerular pressure via efferent dilation, ↓ proteinuria); thiazide early, loop in advanced CKD. Avoid NSAIDs, dual RAAS blockade. Monitor creatinine and K⁺."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "HFrEF: preferred and avoid.", "a": "ACEi/ARB/ARNI; β-blockers (carvedilol, metoprolol succinate, bisoprolol); MRA; loop for congestion; SGLT2i. Avoid non-DHP CCBs; start β-blockers only once euvolemic."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "HFpEF: preferred and avoid.", "a": "Diuretics for volume overload; ACEi/ARB/MRA if BP high; SGLT2i. Avoid excessive/rapid BP drop (impairs ventricular filling)."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Stable ischemic heart disease / post-MI.", "a": "β-blockers (angina, ↓ post-MI mortality; typically ≥3 years post-MI); ACEi/ARB; add DHP CCB if angina persists."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Diabetes: preferred and avoid.", "a": "ACEi/ARB (esp. albuminuria) ± thiazide or CCB. Avoid high-dose β-blocker/thiazide combos; clonidine not preferred; β-blocker masks hypoglycemia."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Hyperthyroidism.", "a": "β-blocker, esp. <b>propranolol</b> (↓ HR, tremor, anxiety; blocks peripheral T4→T3 conversion)."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Stroke/cerebrovascular disease.", "a": "Thiazide ± ACEi/ARB (↓ recurrence); avoid rapid BP reduction in acute ischemic stroke (cerebral hypoperfusion)."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Atrial fibrillation and sleep apnea.", "a": "AF: β-blocker or non-DHP CCB for rate control. OSA: RAAS inhibitor, β-blocker, diuretic + CPAP and weight loss."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Obesity/metabolic syndrome: avoid.", "a": "Nonselective β-blockers, clonidine, high-dose thiazides — agents worsening insulin resistance, glucose, lipids."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Guiding principle on comorbidity.", "a": "\"Treat the patient, not just the pressure\": comorbidity picks the class; BP stage sets the intensity."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Hypertension in pregnancy: frequency and goal.", "a": "5-10% of pregnancies; lower BP safely while maintaining uteroplacental perfusion."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Gestational hypertension vs preeclampsia vs eclampsia/HELLP.", "a": "Gestational: new BP elevation after 20 weeks, no proteinuria. Preeclampsia: hypertension + proteinuria/end-organ dysfunction. Eclampsia: seizures; HELLP: hemolysis, elevated liver enzymes, low platelets."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Severe range in pregnancy.", "a": "<b>Systolic ≥160 or diastolic ≥110 mmHg</b> → urgent treatment."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Chronic/mild-moderate hypertension in pregnancy: preferred.", "a": "<b>Methyldopa</b> (excellent fetal safety), <b>labetalol</b> (monitor liver function), <b>nifedipine ER</b>; diuretics only for volume overload."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Acute/severe hypertension in pregnancy: preferred.", "a": "IV hydralazine; IV labetalol; oral immediate-release nifedipine. Magnesium sulfate for seizure prophylaxis (not a substitute for antihypertensives)."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Avoid in pregnancy: ACEi/ARBs and aliskiren.", "a": "Teratogenic (2nd/3rd trimester): fetal renal dysgenesis, oligohydramnios, malformations."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Avoid in pregnancy: MRAs, nitroprusside, atenolol/propranolol.", "a": "MRAs: antiandrogenic (feminization of male fetus). Nitroprusside: fetal cyanide toxicity. Atenolol: IUGR; propranolol: impaired placental perfusion, fetal bradycardia, hypoglycemia."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Liver disease (cirrhosis) hypertension.", "a": "Hyperdynamic circulation (high CO, low SVR). Preferred: nonselective β-blocker (propranolol, nadolol: ↓ portal pressure, prevent variceal bleeding). Avoid ACEi/ARBs."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Elderly / ISH.", "a": "Arterial stiffening → isolated systolic hypertension; thiazides, CCBs; avoid α₁-blockers (orthostasis); gradual titration."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Black patients (no CKD/HF).", "a": "Often salt-sensitive, volume-dependent: <b>thiazides, DHP CCBs</b>; combinations often needed; ACEI/ARB monotherapy less effective."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Resistant hypertension: definition.", "a": "BP above target on <b>3 agents of different classes</b> (ideally including a diuretic); first confirm adherence, dosing, lifestyle, interfering drugs."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Resistant hypertension: preferred fourth-line.", "a": "<b>Spironolactone</b> (counters aldosterone-mediated Na⁺ retention); alternatives amiloride, eplerenone."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Comorbidities & Populations", "q": "Secondary hypertension: when to suspect and causes.", "a": "Onset &lt;30 years, resistant, sudden or atypical. Primary aldosteronism, renal artery stenosis, pheochromocytoma, Cushing, thyroid disorders. Treat the cause."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "Hypertensive urgency vs emergency.", "a": "Urgency: &gt;180/120 <b>without</b> acute target-organ injury; oral agents. Emergency: severe hypertension <b>with</b> acute organ dysfunction (stroke/encephalopathy, MI, pulmonary edema, renal impairment); IV agents."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "Goals of treatment: urgency vs emergency.", "a": "Urgency: gradual ↓ MAP over 24-48 h. Emergency: ↓ MAP by 20-25% in the first hour, then &lt;160/100 within 2-6 h."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "Hypertensive crisis is defined by:", "a": "<b>Organ injury, not a BP number</b>; rate of rise matters."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "Precipitants of hypertensive crisis.", "a": "Poorly controlled chronic hypertension or abrupt discontinuation; sympathomimetics (cocaine, amphetamines, decongestants, MAOIs); NSAIDs, glucocorticoids; withdrawal (clonidine, β-blockers, benzodiazepines, alcohol); secondary causes."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "<b>Labetalol</b> IV: mechanism, onset/duration, best use.", "a": "α₁ + nonselective β block → ↓ SVR without reflex tachycardia; 2-5 min / 2-4 h; <b>most emergencies, including pregnancy</b>. Caution: severe asthma, heart block, decompensated HF."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "<b>Nicardipine</b>: mechanism, best use.", "a": "DHP CCB, arteriolar dilation; 5-15 min / 4-6 h; <b>neurologic emergencies</b> (ischemic stroke, intracerebral hemorrhage), postoperative. Avoid in acute HF."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "<b>Clevidipine</b>.", "a": "Ultrashort DHP CCB hydrolyzed by plasma esterases; 1-2 min / 5-15 min; perioperative/ICU tight titration; avoid in soy or egg allergy, defective lipid metabolism."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "<b>Esmolol</b>.", "a": "Cardioselective β₁ blocker; plasma esterases (clearance independent of organ function); 1-2 min / 10-20 min; <b>aortic dissection</b>, perioperative, post-MI; avoid in severe LV dysfunction, bradycardia, asthma."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "<b>Fenoldopam</b>.", "a": "D₁ agonist: arteriolar dilation, ↑ renal blood flow, natriuresis; best for <b>AKI/CKD</b>; caution: glaucoma, reflex tachycardia, hypokalemia."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "<b>Nitroprusside</b>: mechanism, onset, toxicity.", "a": "NO donor: arterial + venous dilation; seconds / 1-2 min; potent, titratable; <b>cyanide/thiocyanate toxicity</b> (prolonged use, renal/hepatic dysfunction); avoid in stroke and coronary ischemia (steal); invasive BP monitoring."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "<b>Nitroglycerin</b>.", "a": "Venodilation &gt; arteriolar; 2-5 min / 5-10 min; ACS, pulmonary edema, HF; limited BP control."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "<b>Hydralazine</b> IV.", "a": "Direct arteriolar dilator, reflex sympathetic activation; 10-30 min / 2-6 h; <b>pregnancy-related emergencies</b>; unpredictable, prolonged: avoid in other emergencies."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "<b>Enalaprilat</b>.", "a": "IV ACE inhibitor; 15-30 min / 6-12 h; HF or high-renin states; avoid in pregnancy, bilateral renal artery stenosis, AKI."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "Choosing the IV agent: stroke/ICH vs aortic dissection vs AKI/CKD vs pulmonary edema.", "a": "Stroke/ICH → nicardipine (avoid nitroprusside). Aortic dissection → esmolol. AKI/CKD → fenoldopam. Pulmonary edema/ACS → nitroglycerin."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "Choosing the IV agent: pregnancy vs perioperative titration.", "a": "Most emergencies and pregnancy → labetalol (or hydralazine in preeclampsia/eclampsia). Tight perioperative titration → clevidipine."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "Three guiding principles.", "a": "1. Comorbidity first, BP profile second. 2. Combine complementary mechanisms. 3. Avoid overlapping toxicity or redundancy (ACEI + ARB; β-blocker + verapamil/diltiazem)."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Crisis & IV Agents", "q": "Take-home for pregnancy.", "a": "Labetalol or nifedipine ER, methyldopa alternative; avoid ACEI/ARB/aliskiren/MRA/nitroprusside."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Diuretic vs natriuretic vs aquaretic.", "a": "<b>Diuretic</b> increases urine volume; <b>natriuretic</b> increases Na⁺ excretion (↓ total body Na⁺, ECF volume, BP); <b>aquaretic</b> increases free-water clearance with minimal Na⁺ loss."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "What decides the effect and toxicity of every diuretic?", "a": "<b>Site of action in the nephron.</b>"}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "PCT: fraction reabsorbed and key transporters.", "a": "~65-70% of filtered Na⁺, Cl⁻, HCO₃⁻ and water; nearly all glucose and amino acids; NHE3, NBCe1, carbonic anhydrase, SGLT2."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Thick ascending limb: fraction and transporters.", "a": "~20-25% of filtered Na⁺; water-impermeable; <b>NKCC2</b>; ROMK recycles K⁺ → lumen-positive potential drives paracellular Ca²⁺ and Mg²⁺ reabsorption."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "DCT: fraction and transporters.", "a": "~5-10% of filtered Na⁺; <b>NCC</b>; Ca²⁺ enters via TRPV5, exits via Na⁺/Ca²⁺ exchanger and Ca²⁺-ATPase; PTH enhances Ca²⁺ reabsorption."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Collecting duct: principal cells, intercalated cells, ADH.", "a": "Principal: Na⁺ in via ENaC, K⁺ out; aldosterone raises ENaC and Na⁺/K⁺-ATPase. Intercalated: acid-base. ADH binds V₂ → cAMP → aquaporin-2 insertion."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Slide vs talk: TAL Na⁺ reabsorption.", "a": "Narration says 25-30%; slides/notes say ~20-25%."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Why does fraction reabsorbed predict power?", "a": "PCT 65-70% &gt; TAL 20-25% &gt; DCT 5-10% &gt; collecting duct. Loops strongest: TAL moves a large fraction and the medullary gradient collapses."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Everything downstream compensates: consequence.", "a": "More Na⁺ to the collecting duct → ↑ K⁺ and H⁺ loss (hypokalemia, metabolic alkalosis) — basis for sequential nephron blockade."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Core agents by class.", "a": "CA inhibitor: <b>acetazolamide</b>; osmotic: <b>mannitol</b>; loop: <b>furosemide</b>; thiazide: <b>hydrochlorothiazide, chlorthalidone, metolazone</b>; MR antagonist: <b>spironolactone</b>; ENaC: <b>amiloride</b>; ADH agonist: <b>desmopressin</b>."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Class-level agents by class.", "a": "Loops: bumetanide, torsemide, ethacrynic acid. Thiazide-like: indapamide, chlorothiazide (only parenteral). MRAs: eplerenone, finerenone. ENaC: triamterene. ADH: vasopressin; antagonists tolvaptan, conivaptan. SGLT2: gliflozins."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "<b>Acetazolamide</b>: mechanism.", "a": "Inhibits luminal and cytoplasmic CA → HCO₃⁻ cannot be reclaimed, intracellular H⁺ falls → less H⁺ to drive NHE3 → ↑ urinary Na⁺, HCO₃⁻."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Acetazolamide: effects on urine and acid-base, and why weak.", "a": "Alkaline urine; mild metabolic acidosis blunts diuretic effect after 2-3 days (self-limiting)."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Acetazolamide uses.", "a": "Glaucoma (↓ aqueous humor); acute mountain sickness (acidosis stimulates ventilation); metabolic alkalosis when volume expansion undesirable (HF); idiopathic intracranial hypertension, refractory seizures."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Acetazolamide adverse effects.", "a": "Metabolic acidosis, hypokalemia, paresthesias, fatigue; sulfonamide hypersensitivity (SJS); urine alkalinization: calcium phosphate stones, crystalluria, gout."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Acetazolamide: avoid in.", "a": "Cirrhosis (alkaline urine ↑ ammonia reabsorption → hepatic encephalopathy); severe COPD/chronic respiratory acidosis; hyponatremia, hypokalemia; sulfonamide allergy."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "<b>Mannitol</b>: mechanism.", "a": "Freely filtered, not reabsorbed → ↑ tubular osmolarity → water retained → ↑ flow, ↓ contact time → loss of Na⁺, K⁺, Ca²⁺, Mg²⁺, Cl⁻, HCO₃⁻, phosphate. IV only."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Mannitol: other effects and uses.", "a": "↑ ECF osmolarity → water leaves cells (↓ brain/eye swelling); ↑ RBF and GFR → flushes myoglobin/hemoglobin. Uses: ↑ intracranial pressure, acute glaucoma, nephrotoxin excretion."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Mannitol adverse effects.", "a": "Early: ECF expansion with dilutional hyponatremia (pulmonary edema); later: hypernatremia, dehydration, hyperosmolarity; hyperkalemia; accumulates in renal insufficiency."}, {"g": "Diuretics", "l": "Part 1: Nephron & CA/Osmotic", "q": "Mannitol contraindications.", "a": "Severe renal impairment, anuria, dehydration, active pulmonary edema."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "<b>Furosemide</b>: mechanism.", "a": "Blocks <b>NKCC2</b> in TAL → ↓ medullary gradient → marked natriuresis; loss of lumen-positive potential → ↑ Ca²⁺ and Mg²⁺ excretion; ↑ PGE₂ (blunted by NSAIDs); block at macula densa → ↑ renin."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Loop diuretics: \"high-ceiling\".", "a": "Most efficacious class: more diuresis than thiazides."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Loop uses.", "a": "Acute pulmonary edema, HF with volume overload, refractory edema (first line); hypercalcemia (with IV saline); toxic ingestion of bromide, fluoride, iodide; works in advanced renal impairment."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Furosemide half-life.", "a": "0.5-2 h normal kidneys; up to ~9 h in ESRD."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Loop adverse effects.", "a": "Hypovolemia, hyponatremia, hypokalemic metabolic alkalosis, hypomagnesemia, hyperuricemia, <b>ototoxicity</b>."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Loop cautions and interactions.", "a": "Sulfonamide allergy (except ethacrynic acid); aminoglycosides additive ototoxicity; hypokalemia potentiates digoxin; NSAIDs and probenecid reduce efficacy."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "<b>Thiazides</b>: mechanism.", "a": "Block NCC in the DCT → ↑ urinary Na⁺, Cl⁻, K⁺; modest natriuresis vs loops. Chlorthalidone long-acting (half-life ~47 h)."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Thiazides and calcium: two routes.", "a": "(1) mild ECF contraction → ↑ proximal Na⁺/water/Ca²⁺ reabsorption; (2) lower intracellular Na⁺ in DCT → stimulates Na⁺/Ca²⁺ exchanger."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Thiazide BP effect.", "a": "Short term: ↓ plasma volume and CO. Long term: ↓ peripheral vascular resistance, better endothelial function."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Thiazide uses.", "a": "First-line hypertension; mild HF; sequential nephron blockade with a loop; <b>prevent calcium kidney stones</b>; osteoporotic fracture protection; <b>nephrogenic diabetes insipidus</b>."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Thiazide adverse effects.", "a": "Hypokalemic metabolic alkalosis, hyponatremia, hyperuricemia/gout, hyperglycemia, hyperlipidemia, mild hypercalcemia, sexual dysfunction."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Thiazide caution: GFR.", "a": "Slide: effective in HF only if GFR &gt;30-40 mL/min."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "K⁺-sparing diuretics: shared mechanism.", "a": "Reduce Na⁺ entry through ENaC → blunt lumen-negative potential → ↓ K⁺ and H⁺ secretion. Value is K⁺ conservation (+ CV benefit for MRAs)."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "<b>Spironolactone</b>: mechanism.", "a": "Blocks aldosterone binding to the MR → ↓ ENaC and Na⁺/K⁺-ATPase; effect proportional to endogenous aldosterone (best in hyperaldosteronism)."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Spironolactone uses.", "a": "Prevent hypokalemia; HFrEF (mortality benefit, ↓ remodeling/fibrosis); <b>hyperaldosteronism (drug of choice)</b>; cirrhosis with ascites; refractory edema; acne, female-pattern hair loss. Finerenone: CKD with T2D."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Spironolactone adverse effects.", "a": "Hyperkalemia, mild metabolic acidosis; gynecomastia, impotence, menstrual irregularities."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "<b>Amiloride</b>: mechanism and uses.", "a": "Directly blocks ENaC in principal cells. Prevent hypokalemia; <b>Liddle syndrome</b> (gain-of-function ENaC); <b>lithium-induced nephrogenic DI</b> (lithium enters via ENaC)."}, {"g": "Diuretics", "l": "Part 2: Loops, Thiazides, K⁺-Sparing", "q": "Hyperkalemia stacking with K⁺-sparing diuretics.", "a": "Highest with renal insufficiency or other K⁺-retaining drugs: ACEi, ARBs, renin inhibitors, β-blockers, NSAIDs, K⁺ supplements."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "<b>Desmopressin</b>: mechanism, uses.", "a": "V₂ agonist → ↑ cAMP → aquaporin-2 insertion → water reabsorption; longer duration, minimal V₁ effect. Central DI; nocturnal enuresis."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Desmopressin adverse effects.", "a": "Hyponatremia (esp. if fluid intake not restricted), headache, dizziness; caution in HF and uncontrolled HTN; contraindicated in acute renal failure."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "ADH antagonists (aquaretics): mechanism and uses.", "a": "Tolvaptan, conivaptan block V₂ → no AQP2 insertion → free-water excretion. Euvolemic/hypervolemic hyponatremia (SIADH) when fluid restriction fails; tolvaptan slows ADPKD cyst growth."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "ADH antagonists adverse effects.", "a": "<b>Osmotic demyelination</b> if Na⁺ corrected too fast; hepatotoxicity; thirst, polyuria; duration-limited (conivaptan ≤4 days, tolvaptan ≤30 days per narration)."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "SGLT2 inhibitors as diuretics.", "a": "Block SGLT2 in PCT → glucosuria (osmotic diuresis) + modest natriuresis; ↓ HF hospitalization, slower CKD progression. GU infections, transient GFR dip, dehydration."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Acute HF with volume overload.", "a": "Loop = cornerstone; if response falls, add a thiazide (sequential nephron blockade)."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Chronic HFrEF diuretic approach.", "a": "MR antagonist (mild diuresis + mortality benefit); loop or thiazide as needed for euvolemia."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Cirrhosis with ascites.", "a": "<b>Aldosterone antagonist first</b> (hyperaldosteronism); add a loop if ascites persists."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Nephrotic syndrome edema.", "a": "Loop first (efficacy reduced by drug binding to urinary protein); loop + thiazide for resistant edema."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Hypertension: diuretic selection.", "a": "Thiazide first-line; loop if eGFR &lt;30 or resistant with volume overload; add K⁺-sparing to prevent hypokalemia."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Hypercalcemia vs recurrent Ca²⁺ stones.", "a": "Hypercalcemia: loop + IV saline. Stones: thiazide (↓ urinary calcium)."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Nephrogenic vs central DI.", "a": "Nephrogenic: thiazide (mild volume contraction → ↑ proximal reabsorption → ↓ urine output, paradoxical). Central: desmopressin."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Electrolyte pattern: loop vs thiazide calcium.", "a": "\"<b>Loops lose it, thiazides keep it</b>\": loop ↓ serum Ca²⁺ (↑ urinary); thiazide ↑ serum Ca²⁺."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Pattern to memorize: acid-base by class.", "a": "Loop and thiazide → contraction alkalosis; CA inhibitors and K⁺-sparing → acidosis; everything upstream of collecting duct → hypokalemia."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Monitoring by class.", "a": "Loop: K⁺, Mg²⁺, hearing. Thiazide: K⁺, Na⁺, uric acid, glucose, lipids. CA inhibitors: HCO₃⁻, pH. MRAs: K⁺, renal function. Osmotic: Na⁺, osmolarity. ADH agonist: Na⁺. ADH antagonists: Na⁺, liver enzymes. SGLT2i: volume, eGFR, infections."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "Sulfonamide-like diuretics.", "a": "Acetazolamide, loops (not ethacrynic acid), thiazides."}, {"g": "Diuretics", "l": "Part 3: Other Agents & Clinical Use", "q": "What blunts loops and thiazides?", "a": "NSAIDs and probenecid (organic anion transport; PGE₂ for loops)."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "RAAS: acute and chronic role; what does over-activation drive?", "a": "Acute: vascular tone and sodium handling. Chronic: cardiovascular remodeling and kidney function. Over-activation drives HTN, heart failure, diabetic nephropathy, MI. \"Every step of the cascade is a drug target.\""}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Step 1: renin release.", "a": "JG cells secrete renin; it cleaves liver-made angiotensinogen into <b>angiotensin I</b> (minimally active decapeptide). Drugs: aliskiren; beta-blockers reduce renin release."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "What stimulates renin release?", "a": "↓ renal perfusion pressure; ↓ NaCl delivery to the macula densa; ↑ sympathetic activity via <b>beta-1 receptors</b>."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Step 2: Ang I → Ang II.", "a": "ACE (vascular endothelium, lungs, kidney) makes Ang II and <b>degrades bradykinin</b>; chymase can also make Ang II."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Step 3: Ang II on the AT₁ receptor.", "a": "↑ vasoconstriction, ↑ proximal Na⁺/water reabsorption, ↑ aldosterone synthesis, ↑ sympathetic neurotransmission, ↓ Na⁺ excretion → ↑ BP."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Step 4: aldosterone.", "a": "Zona glomerulosa; acts on MRs in the distal nephron: ↑ ENaC and Na⁺/K⁺-ATPase → Na⁺ retention, K⁺ excretion, volume expansion."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Short loop feedback.", "a": "Ang II inhibits renin release via AT₁ on JG cells; ACEIs/ARBs remove this brake so plasma renin activity rises."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "What decreases vs increases renin?", "a": "Decrease: beta-blockers, NSAIDs. Increase: loop diuretics, vasodilators. Explains high renin and sharp first-dose BP drop in diuretic-treated/HF patients."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Counter-regulatory axis.", "a": "ACE2 converts Ang II to Ang-(1-7) → Mas receptor: vasodilation, natriuresis, antifibrotic. No widely used drug targets it yet."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Dr. Waterfall's Core Agents.", "a": "<b>Lisinopril, losartan, sacubitril/valsartan, spironolactone.</b>"}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Class-level ACEIs and ARBs.", "a": "ACEIs: enalapril, captopril, benazepril, ramipril, fosinopril, perindopril, trandolapril, enalaprilat. ARBs: valsartan, candesartan, irbesartan, olmesartan, telmisartan, azilsartan."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Naming pattern.", "a": "-pril = ACE inhibitor; -sartan = ARB; -lactone/-renone = MRA; -kiren = renin inhibitor; -olol = beta-blocker."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "<b>Lisinopril</b>: mechanism.", "a": "Inhibits ACE → ↓ Ang II (and ↑ bradykinin)."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Lisinopril effects.", "a": "Vasodilation; ↓ aldosterone; <b>efferent dilation → ↓ intraglomerular pressure → ↓ proteinuria</b>; ↓ preload and afterload; no reflex tachycardia; renin rises."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Lisinopril uses.", "a": "HTN first line (esp. diabetes, CKD, high-renin); HFrEF (fewer symptoms/hospitalizations, longer survival); post-MI (limit remodeling); CKD/diabetic nephropathy (benefit even in normotensive diabetics)."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "ACEI pharmacokinetics.", "a": "Most are prodrugs but <b>lisinopril and captopril are active as given</b>; renal elimination → adjust in CKD; enalaprilat IV (active form of enalapril); high renin: start low."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "ACEI adverse effects.", "a": "Hypotension (first dose); <b>dry cough</b> (up to 20%, bradykinin; switch to ARB); <b>angioedema</b> (rare, more common in people of African descent); hyperkalemia; AKI; transient creatinine rise."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "ACEI contraindications.", "a": "Pregnancy (2nd/3rd trimester); bilateral renal artery stenosis (or solitary kidney); prior ACEI angioedema (absolute)."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Creatinine rule after starting ACEI.", "a": "Rise of up to <b>~30%</b> expected and acceptable; larger or progressive rise suggests a problem (e.g., renal artery stenosis)."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Why does AKI happen with ACEI?", "a": "Ang II normally constricts the efferent arteriole to hold filtration pressure; with ACEI, efferent tone drops; if afferent supply is low (bilateral RAS, volume depletion, NSAID), filtration pressure collapses."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "ACEI interactions.", "a": "K⁺-sparing diuretics/K⁺ supplements → hyperkalemia; NSAIDs blunt BP effect and raise AKI risk; no dual RAAS blockade."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "<b>Losartan</b>: mechanism.", "a": "Selective, competitive AT₁ antagonist (&gt;10,000-fold selective over AT₂); does not affect bradykinin; unopposed AT₂ may add vasodilation and antifibrotic effects."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "Losartan special uses.", "a": "<b>Marfan syndrome</b> (blocks TGF-beta signaling, slows aortic root dilation); post-transplant erythrocytosis. Preferred when ACEI not tolerated."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "ARB adverse effects.", "a": "Hypotension, hyperkalemia, AKI; much lower risk of cough and angioedema."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 1: RAAS & ACEIs/ARBs", "q": "ACEI vs ARB in one line.", "a": "Same BP, heart and kidney benefits; ARBs avoid bradykinin side effects. ACEI cough → switch to ARB. ARBs usually second choice in HFrEF and post-MI."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "<b>Sacubitril/valsartan (Entresto)</b>: what is it?", "a": "The only <b>ARNI</b> in clinical use: valsartan blocks AT₁; sacubitril (prodrug) inhibits neprilysin."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "What does neprilysin normally degrade?", "a": "ANP, BNP, bradykinin, adrenomedullin, Ang I/II, endothelin-1 → inhibition ↑ vasodilatory and natriuretic peptides."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "ARNI uses and trial.", "a": "<b>HFrEF</b>: first-line in symptomatic patients (PARADIGM-HF: fewer CV deaths and HF hospitalizations than enalapril). May reduce hospitalizations in HFpEF."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "ARNI pharmacokinetics.", "a": "Oral, twice daily; sacubitril ~60% bioavailable, ~11 h half-life."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "ARNI adverse effects.", "a": "Hypotension (first dose), hyperkalemia, renal dysfunction; cough/angioedema possible but less than ACEI."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "ARNI contraindications.", "a": "Never with an ACEI, ARB or aliskiren; <b>36-hour washout</b> after stopping an ACEI; pregnancy; prior angioedema."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "ARNI rule.", "a": "Started <b>in place of, never in addition to</b>, an ACEI. 36 h: neprilysin inhibition + ACE inhibition both raise bradykinin → angioedema."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "<b>Spironolactone</b>: mechanism and effects.", "a": "Competitively blocks MRs in distal nephron and cardiovascular tissue; ↓ Na⁺/water reabsorption; ↓ K⁺ and H⁺ excretion; blocks aldosterone-driven cardiac fibrosis; survival benefit in HFrEF."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "Spironolactone uses.", "a": "HFrEF (persistent symptoms despite ACEI/ARB); primary aldosteronism; add-on for resistant HTN."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "Spironolactone adverse effects.", "a": "<b>Hyperkalemia</b>; antiandrogenic (binds androgen and progesterone receptors): gynecomastia, impotence, menstrual irregularities."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "Spironolactone contraindications.", "a": "Severe renal impairment (<b>eGFR &lt;30</b>), baseline hyperkalemia, Addison disease; no other K⁺-sparing diuretics."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "Spironolactone vs eplerenone.", "a": "Eplerenone (class-level): more selective for MR, fewer endocrine effects, shorter half-life, CYP3A4 substrate (ketoconazole, clarithromycin raise levels), more costly."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "<b>Aliskiren</b> (class-level).", "a": "Direct renin inhibitor; HTN only, rarely used; BP lowering equal to ACEI/ARB but no improvement in CV or renal outcomes; avoid with ACEI/ARB in diabetes or renal impairment; pregnancy."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "Beta-1 blockers as RAAS modulators.", "a": "Block beta-1 on heart and JG cells → ↓ renin release. Metoprolol, bisoprolol, carvedilol (non-selective with alpha-1 blockade). HFrEF cornerstone, post-MI. Bradycardia; bronchospasm; masks hypoglycemia."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 2: ARNI & MRAs", "q": "Distinguish beta-blockers from aliskiren.", "a": "Beta-blockers reduce renin <b>release</b> (JG cell, beta-1). Aliskiren inhibits renin <b>activity</b> (the enzyme). Both upstream."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "Hypertension: which RAAS agent?", "a": "ACEI or ARB first line (esp. diabetes or CKD); spironolactone is the add-on for resistant HTN."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "Post-MI with LV systolic dysfunction.", "a": "Start a RAAS inhibitor early, ideally within 24 h after stabilization; ACEI lowers mortality; ARB if ACEI not tolerated."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "HFrEF regimen.", "a": "ACEI/ARB reduce morbidity and mortality; <b>ARNI superior to ACEI</b> (36-h washout); beta-1 blocker + MRA complement. Full neurohormonal blockade: ACEI or ARNI + beta-1 blocker + MRA."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "CKD / diabetic nephropathy.", "a": "ACEI/ARB cornerstone: dilate efferent arteriole → ↓ intraglomerular pressure → ↓ proteinuria; most beneficial when albuminuria ≥300 mg/day; expect initial creatinine rise."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "Quick picks: primary aldosteronism, ACEI cough, Marfan.", "a": "Primary aldosteronism: spironolactone (or eplerenone). ACEI cough: switch to ARB. Marfan: losartan."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "Upstream vs downstream blockade.", "a": "Upstream: beta-1 blockers, aliskiren. Downstream: ACEIs, ARBs, ARNI, MRAs. Together: more complete inhibition in HFrEF (but never ACEI + ARB)."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "Adverse effects shared by all RAAS drugs.", "a": "Hyperkalemia, hypotension, kidney function decline. Highest risk: volume depletion, advanced CKD, bilateral renal artery stenosis (absolute contraindication)."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "Bradykinin effects: who causes them?", "a": "ACEI (most), ARNI (less); ARBs and aliskiren less likely."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "RAAS monitoring and counseling.", "a": "Creatinine, eGFR, K⁺ (after starting or raising dose); BP and volume status. Avoid potassium-rich salt substitutes and NSAIDs."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "Pregnancy and RAAS drugs.", "a": "Absolute contraindication (fetal kidney injury and death; teratogenic 2nd/3rd trimester) for ACEI, ARB, ARNI, aliskiren (and MRAs per her summary)."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "Dual RAAS blockade.", "a": "ACEI + ARB (or inappropriate aliskiren): more hyperkalemia, hypotension and AKI, no added benefit."}, {"g": "Renin-Angiotensin-Aldosterone System (RAAS) Modulators", "l": "Part 3: Choosing & Safety", "q": "Hyperkalemia ranking in her table.", "a": "Spironolactone +++; lisinopril, losartan, sacubitril/valsartan, aliskiren +."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "Sympathoplegics: two levels of action.", "a": "<b>Central</b> (↓ outflow: clonidine, methyldopa) or <b>target organ</b> (receptor blockade: β-blockers, α₁-blockers). Net: ↓ HR, ↓ contractility, ↓ renin release, ↓ vascular resistance → ↓ BP."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "α₁ receptor: location and effect.", "a": "Postsynaptic vascular smooth muscle; prostate and bladder neck → vasoconstriction, ↑ BP; smooth muscle contraction (urinary outflow obstruction). Blockers treat hypertension and BPH."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "α₂ receptor: location and effect.", "a": "Presynaptic autoreceptor: inhibits NE release → ↓ sympathetic tone, vascular resistance, HR. Postsynaptic vasoconstriction minor. Central α₂ agonists: clonidine, methyldopa, guanfacine."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "β₁ receptor: location and effect.", "a": "Heart and JG cells: ↑ HR, ↑ contractility, ↑ conduction velocity → ↑ CO; ↑ renin → RAAS → ↑ BP."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "β₂ receptor: location, effect, and why blocking it matters.", "a": "Bronchial smooth muscle, vascular smooth muscle, pancreatic β-cells, liver/skeletal muscle → bronchodilation, vasodilation, ↑ insulin, ↑ glycogenolysis. Nonselective blockers: <b>bronchospasm</b>, impaired recovery from hypoglycemia."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "Cardioselective blockers: caveat.", "a": "Spare β₂ effects; preferred in airway disease or diabetes; <b>no β-blocker is absolutely selective</b> — high doses can block β₂."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "Core β-blockers by subclass.", "a": "β₁-selective: <b>metoprolol, bisoprolol, atenolol, esmolol, nebivolol</b>. Nonselective: <b>propranolol</b>. Mixed α₁ + β: <b>carvedilol, labetalol</b>. Class-level: acebutolol, betaxolol; nadolol, timolol, carteolol, pindolol."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "β-blocker effects: heart and kidney.", "a": "Heart: ↓ HR, contractility, AV conduction → ↓ CO and myocardial O₂ demand. Kidney: ↓ renin → ↓ Ang II and aldosterone. Lipophilic agents (metoprolol, propranolol, carvedilol) may reduce central sympathetic outflow."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "Vasodilating β-blockers.", "a": "<b>Carvedilol, labetalol</b>: also block α₁ → vasodilation, ↓ afterload. <b>Nebivolol</b>: ↑ endothelial NO release."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "Intrinsic sympathomimetic activity (ISA).", "a": "Pindolol, acebutolol (class-level): partial agonists → less resting bradycardia; but weaker suppression and no mortality benefit → rarely used, <b>avoided after MI and in heart failure</b>."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "β-blocker uses.", "a": "Post-MI (↓ reinfarction, ↑ survival), stable angina, HFrEF (metoprolol succinate, bisoprolol, carvedilol ↓ mortality), AF rate control, hypertension, thyrotoxicosis, migraine prophylaxis, essential tremor, glaucoma, variceal bleeding, pheochromocytoma, infantile hemangioma."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "<b>Esmolol</b>, <b>labetalol</b>, <b>propranolol</b>: signature features.", "a": "Esmolol: ultrashort IV β₁ blocker (half-life ~10 min). Labetalol: hypertensive emergencies and pregnancy/preeclampsia (preserves uteroplacental perfusion). Propranolol: highly lipophilic, crosses blood-brain barrier."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "β-blocker adverse effects.", "a": "Bradycardia, AV block, fatigue, cold extremities, exercise intolerance, sexual dysfunction; bronchospasm (nonselective); worsen Raynaud; <b>mask hypoglycemia</b>; lipid changes; CNS effects (vivid dreams, depression) with propranolol."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "β-blocker abrupt withdrawal.", "a": "Rebound sympathetic activation: angina, MI, hypertensive crisis → <b>taper gradually</b>."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "β-blocker contraindications and key interaction.", "a": "Severe bradycardia, high-degree AV block, decompensated HF; nonselective in asthma/severe COPD. Verapamil/diltiazem → ↑ bradycardia/AV block; NSAIDs blunt effect."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "Receptor affinity (Katzung): mixed vs selective vs nonselective.", "a": "Mixed (labetalol, carvedilol): β₁ = β₂ ≥ α₁ &gt; α₂. β₁-selective: β₁ &gt;&gt;&gt; β₂. Nonselective (propranolol, nadolol, pindolol, timolol): β₁ = β₂."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: Receptors & β-Blockers", "q": "Choosing a β-blocker clinically.", "a": "Choose by β₁ selectivity (asthma/COPD: metoprolol, bisoprolol) and lipophilicity (atenolol: fewer CNS effects). Monitor HR and BP; do not stop abruptly."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "<b>Prazosin</b>: mechanism and why little reflex tachycardia.", "a": "Selective postsynaptic α₁ blockade → arteriolar and venous relaxation; <b>no presynaptic α₂ block</b>: no reflex NE release, minimal HR change. Doxazosin, terazosin: once-daily (longer half-lives)."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "α₁-blocker metabolic and urinary effects.", "a": "↓ LDL and triglycerides, slight ↑ HDL; relax bladder neck, prostate capsule, prostatic urethra → ↑ urinary outflow."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "α₁-blocker uses and limitation.", "a": "Hypertension (usually combination) and <b>BPH</b>; Raynaud, PTSD nightmares (prazosin). Not first-line for primary hypertension: inferior CV protection (heart failure prevention). Best when hypertension + BPH coexist."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "Prazosin kinetics.", "a": "Half-life ~3 h, duration 7-10 h; <b>bedtime dosing</b> minimizes orthostatic hypotension."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "α₁-blocker signature adverse effects.", "a": "<b>First-dose phenomenon</b>: marked orthostatic hypotension and syncope (start low, bedtime, titrate); dizziness, nasal congestion, priapism, reflex tachycardia; <b>intraoperative floppy iris syndrome</b> in cataract surgery."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "α₁-blocker interactions.", "a": "Additive hypotension with diuretics, ACE inhibitors, vasodilators and <b>PDE-5 inhibitors</b> (sildenafil, tadalafil)."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "Central α₂ agonists: place in therapy.", "a": "Lower BP by ↓ CNS sympathetic outflow. Reserved for resistant hypertension, pregnancy, adjunct; not first-line (less favorable long-term outcomes)."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "<b>Methyldopa</b>: mechanism.", "a": "Prodrug → <b>α-methylnorepinephrine</b> (\"false neurotransmitter\") in the CNS; stimulates medullary α₂; enters CNS by amino acid transporters."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "Methyldopa uses and renal safety.", "a": "First-line for gestational hypertension and preeclampsia (excellent pregnancy safety); preserves CO and renal perfusion → safe in CKD. Tolerance may develop over 2-3 months."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "Methyldopa adverse effects.", "a": "Sedation, dry mouth; <b>Coombs-positive hemolytic anemia</b>; hepatotoxicity; drug-induced lupus-like syndrome; edema; lactation (prolactin); rebound hypertension."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "Methyldopa monitoring and avoid.", "a": "Periodic CBC and liver function tests; avoid in acute liver disease or active hemolytic anemia; MAOIs."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "<b>Clonidine</b>: mechanism.", "a": "Direct α₂ agonist: central (↓ outflow) and presynaptic peripheral (↓ NE release); highly lipid soluble; transdermal patch lasts 7 days."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "Clonidine uses.", "a": "Resistant hypertension; hypertensive urgency/emergency (IV); opioid and alcohol withdrawal; ADHD (ER); pheochromocytoma; menopausal vasomotor symptoms; ↓ intraocular pressure."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "Clonidine abrupt discontinuation.", "a": "<b>Severe rebound hypertension</b>, hypertensive crisis, angina, tachyarrhythmias (adrenergic receptors up-regulated during chronic suppression) → never stop abruptly; taper."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "Clonidine: other adverse effects.", "a": "Sedation, dry mouth, bradycardia, depression; patch skin irritation; rapid high-dose IV → transient hypertensive spike (peripheral α₂B) — risky in CAD."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "<b>Guanfacine</b> (class-level).", "a": "Selective α₂A agonist; adjunct/second-line hypertension (clonidine not tolerated); ER for ADHD; half-life ~17 h; less sedation and rebound than clonidine; CYP3A4 interactions."}, {"g": "Sympathoplegics and Vasodilators", "l": "Sympatho: α₁ & Central α₂", "q": "Sympathoplegic take-homes.", "a": "β₁-selective when β₂ blockade is a concern. Labetalol: pregnancy and emergencies. Esmolol: ultrashort IV. α₁-blockers: BPH + hypertension, bedtime first dose. Clonidine: never stop abruptly. Methyldopa: pregnancy; watch liver and hemolysis."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "Vascular tone: balance.", "a": "Vasoconstrictors (sympathetic α₁, RAAS, endothelin-1) vs vasodilators (NO, prostacyclin; ↑ cAMP/cGMP and ↓ intracellular Ca²⁺ → relaxation). Vasodilators ↓ SVR and arterial pressure, ↑ CO and perfusion."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "Site of dilation: venous vs arteriolar vs balanced.", "a": "Venous (organic nitrates): ↓ preload. Arteriolar (DHP CCBs, hydralazine, minoxidil, diazoxide, fenoldopam): ↓ afterload. Balanced (nitroprusside): ↓ preload and afterload."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "Why site of action matters.", "a": "Predicts the compensatory response: arteriolar dilators → reflex tachycardia, RAAS activation, Na⁺/water retention (combine with β-blocker and diuretic)."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "Core vasodilators by class.", "a": "DHP CCBs: <b>amlodipine, nifedipine</b>. Non-DHP: <b>verapamil, diltiazem</b>. Nitrates: <b>nitroglycerin, isosorbide dinitrate</b>. NO donor: <b>nitroprusside</b>. <b>Hydralazine</b>. K⁺ channel opener: <b>minoxidil</b>. Class-level: fenoldopam, diazoxide, isosorbide mononitrate."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "CCB mechanism.", "a": "Inhibit L-type voltage-gated Ca²⁺ channels (α₁ subunit) → ↓ intracellular Ca²⁺ → ↓ contraction; vasodilation arterial &gt; venous. DHPs are vasoselective; non-DHPs are cardioselective."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "DHP effects and reflex.", "a": "Arteriolar vasodilation → ↓ SVR and BP; minimal effect on contractility/conduction; baroreceptor reflex intact → reflex tachycardia."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "Short-acting vs long-acting nifedipine.", "a": "IR nifedipine: abrupt BP fall → reflex tachycardia, may precipitate angina/MI; <b>not for chronic use</b>. Long-acting (amlodipine, ER nifedipine): gradual, stable; preferred."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "DHP uses.", "a": "First-line hypertension, esp. older adults and Black patients; ISH; stable angina; Prinzmetal angina; Raynaud; <b>nimodipine</b>: subarachnoid hemorrhage; nicardipine/clevidipine IV: hypertensive emergencies."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "Amlodipine pharmacokinetics.", "a": "High bioavailability, half-life <b>30-50 h</b>, once daily, slow onset (little reflex tachycardia); CYP3A4."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "DHP signature adverse effect: peripheral edema.", "a": "Arteriolar &gt; venous dilation ↑ capillary hydrostatic pressure; often non-pitting, <b>not diuretic-responsive</b>, may improve with ACEI/ARB. Also flushing, headache, dizziness."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "DHP interactions.", "a": "CYP3A4 inhibitors (erythromycin, ketoconazole, grapefruit juice) ↑ toxicity; inducers (phenytoin, rifampin) ↓ effect."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "<b>Verapamil</b> and <b>diltiazem</b>: effects.", "a": "Negative inotropic, chronotropic, dromotropic → ↓ HR, contractility, AV conduction. Verapamil more cardioselective; diltiazem balanced."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "Non-DHP uses.", "a": "Rate control in AF and SVT; stable angina; vasospastic angina (DHPs preferred); hypertension only if arrhythmia/angina coexists; verapamil off-label migraine prophylaxis."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "Non-DHP adverse effects and contraindications.", "a": "Bradycardia, AV block, HFrEF exacerbation; <b>constipation (verapamil, up to 25%)</b>; gingival hyperplasia. Contraindicated: 2°/3° AV block, severe bradycardia, HFrEF."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "Non-DHP interactions.", "a": "CYP3A4 and P-glycoprotein: ↑ digoxin, cyclosporine, simvastatin, lovastatin; β-blockers or amiodarone → bradycardia/AV block."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Tone & CCBs", "q": "DHP vs non-DHP: primary site and reflex tachycardia.", "a": "DHP: arterioles; reflex tachycardia common. Non-DHP: myocardium/AV node; reflex tachycardia less likely, bradycardia/AV block common."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Organic nitrates: mechanism.", "a": "NO → activates soluble guanylate cyclase → ↑ cGMP → myosin light-chain dephosphorylation → smooth muscle relaxation. Core: nitroglycerin, isosorbide dinitrate; class-level isosorbide mononitrate."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Nitrate effects.", "a": "Primarily <b>venous dilation</b> → ↓ preload, ↓ LV end-diastolic pressure and wall stress, ↓ O₂ demand; higher doses modest arteriolar dilation; coronary vasodilation."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Nitrate uses and routes.", "a": "Acute, stable, variant (Prinzmetal) angina; ACS adjunct; ADHF with volume overload; sublingual rapid; long-acting oral/transdermal prophylaxis; topical NTG for anal fissures."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Nitrate pharmacokinetics.", "a": "NTG and ISDN: extensive first-pass; ISMN: minimal first-pass; sublingual bypasses liver; parent half-life 2-8 min."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Nitrate adverse effects.", "a": "Headache, flushing, postural hypotension, reflex tachycardia; <b>tolerance</b> with chronic use → daily nitrate-free interval; abrupt stop → rebound ischemia."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Nitrate absolute contraindication.", "a": "<b>PDE-5 inhibitors</b> (sildenafil, tadalafil) and soluble guanylate cyclase stimulators (riociguat) → profound hypotension."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "<b>Nitroprusside</b>: mechanism and effect.", "a": "Releases NO directly → ↑ cGMP; <b>balanced</b> arterial and venous dilation; rapid ↓ SVR and BP; effects fade within minutes (precisely titratable)."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Nitroprusside uses and kinetics.", "a": "Hypertensive emergencies; ADHF with pulmonary edema; controlled hypotension in surgery. IV; onset seconds."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Nitroprusside toxicity.", "a": "Metabolized to <b>cyanide and thiocyanate</b> (renally excreted): accumulate with prolonged infusion, high dose, renal impairment → metabolic acidosis, altered mental status, seizures. Also ↑ intracranial pressure."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Nitroprusside monitoring.", "a": "Continuous BP and HR, fluid status, arterial oxygenation; cyanide/thiocyanate levels in prolonged infusions."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Direct arteriolar vasodilators: shared problem and fix.", "a": "Lower afterload with minimal venous effect; cause reflex sympathetic activation, RAAS activation, Na⁺/water retention. Fix: add <b>β-blocker</b> (tachycardia) and <b>diuretic</b> (loop with minoxidil)."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "<b>Hydralazine</b>: mechanism and uses.", "a": "Relaxes arterioles; likely endothelium-dependent NO release → ↑ cGMP. Resistant HTN; emergencies (preeclampsia/eclampsia, AKI); <b>HFrEF with isosorbide dinitrate</b> (esp. Black patients or ACEI/ARB intolerance)."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Hydralazine and acetylator status.", "a": "Slow acetylators: higher levels (more efficacy and adverse effects); rapid acetylators may need higher doses."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Hydralazine signature adverse effect.", "a": "<b>Drug-induced lupus-like syndrome</b> (slow acetylators, high dose, chronic use; arthralgia, myalgia, fever, positive ANA; resolves on stopping); also headache, palpitations, fluid retention, peripheral neuropathy."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "<b>Minoxidil</b>: mechanism and use.", "a": "Opens ATP-sensitive K⁺ channels → hyperpolarization → Ca²⁺ channels close → arteriolar relaxation. <b>Refractory hypertension only</b> (never first-line)."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Minoxidil signature adverse effects.", "a": "<b>Hypertrichosis</b> (hallmark; basis for topical use in alopecia); pronounced reflex tachycardia, fluid retention, rare pericardial effusion. Diazoxide (class-level): hyperinsulinemic hypoglycemia."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "<b>Fenoldopam</b> (class-level).", "a": "Selective D₁ agonist → ↑ cAMP; dilates renal, mesenteric, coronary arterioles; ↑ renal blood flow → natriuresis; hypertensive emergencies, esp. preserving renal function; avoid in glaucoma."}, {"g": "Sympathoplegics and Vasodilators", "l": "Vasodilators: Nitrates & Direct", "q": "Vasodilator selection by group.", "a": "Venodilators (nitrates): angina, volume-overloaded HF. Arteriolar (hydralazine, minoxidil, fenoldopam): resistant HTN/emergencies. Balanced (nitroprusside): emergencies, ADHF. DHP CCBs: HTN, angina. Non-DHP: SVT, angina."}],deck=[],i=0,st={};
var CATS={"Lower Urinary Tract Disorders":"Pathology (Kemp)","Renal Neoplasia":"Pathology (Kemp)","Renal Vascular Disease":"Pathology (Kemp)","Acute Kidney Injury and Nephrolithiasis":"Pathology (Kemp)","Tubular and Interstitial Disease":"Pathology (Kemp)","AKI and Nephrolithiasis: Clinical Approach":"Clinical","Chronic Kidney Disease":"Clinical","Hyponatremia &amp; Electrolyte Disorders":"Clinical","Hypertension":"Clinical","Acid-Base Disorders &amp; Arterial Blood Gases":"Clinical"};
function $(x){return document.getElementById(x)}
function build(){var G=[],gi={};ALL.forEach(function(c,k){if(!(c.g in gi)){gi[c.g]=G.length;G.push({g:c.g,parts:[],pi:{},n:0})}var o=G[gi[c.g]];if(!(c.l in o.pi)){o.pi[c.l]=o.parts.length;o.parts.push({l:c.l,n:0})}o.parts[o.pi[c.l]].n++;o.n++});
var h='',last='';G.forEach(function(o,gx){var cat=CATS[o.g]||'Pharmacology';if(cat!==last){h+='<div class="cat">'+cat+'</div>';last=cat}
h+='<div class="grp"><label class="lec g"><input type="checkbox" class="gc" data-g="'+gx+'" checked> '+o.g+'<span class="n">'+o.n+' cards</span></label>';
if(o.parts.length>1)o.parts.forEach(function(p){h+='<label class="lec p"><input type="checkbox" class="pc" data-g="'+gx+'" data-l="'+p.l.replace(/"/g,'&quot;')+'" checked> '+p.l+'<span class="n">'+p.n+'</span></label>'});
h+='</div>'});
$('lecs').innerHTML=h;window.G=G;
document.querySelectorAll('.gc').forEach(function(x){x.onchange=function(){var g=this.dataset.g,v=this.checked;document.querySelectorAll('.pc[data-g="'+g+'"]').forEach(function(p){p.checked=v});cnt()}});
document.querySelectorAll('.pc').forEach(function(x){x.onchange=function(){var g=this.dataset.g,ps=document.querySelectorAll('.pc[data-g="'+g+'"]'),any=false;ps.forEach(function(p){if(p.checked)any=true});document.querySelector('.gc[data-g="'+g+'"]').checked=any;cnt()}});cnt()}
function chosen(){var sel={};var gm=window.G;document.querySelectorAll('.gc').forEach(function(x){var g=gm[x.dataset.g];var ps=document.querySelectorAll('.pc[data-g="'+x.dataset.g+'"]');if(ps.length){ps.forEach(function(p){if(p.checked)sel[g.g+'||'+p.dataset.l]=1})}else if(x.checked){g.parts.forEach(function(p){sel[g.g+'||'+p.l]=1})}});return sel}
function cnt(){var s=chosen(),n=0;ALL.forEach(function(c){if(s[c.g+'||'+c.l])n++});$('sel').textContent=n+' cards selected'}
function show(){if(!deck.length){$('q').textContent='No cards in this deck.';$('a').textContent='';$('pos').textContent='';$('t1').textContent='';$('t2').textContent='';return}
var c=ALL[deck[i]],tag=c.g+' · '+c.l;$('card').classList.remove('flip');$('q').innerHTML=c.q;$('a').innerHTML=c.a;$('t1').innerHTML=tag;$('t2').innerHTML=tag;$('pos').textContent='Card '+(i+1)+' / '+deck.length;
var g=0,m=0;for(var k in st){st[k]?g++:m++}$('score').textContent='Got '+g+' · Missed '+m}
function go(d){if(!deck.length)return;i=(i+d+deck.length)%deck.length;show()}
function mark(v){if(!deck.length)return;st[deck[i]]=v;go(1)}
function start(){var s=chosen();deck=[];ALL.forEach(function(c,k){if(s[c.g+'||'+c.l])deck.push(k)});
if($('shufchk').checked){for(var j=deck.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1));var t=deck[j];deck[j]=deck[r];deck[r]=t}}
i=0;st={};$('study').style.display='block';show();$('study').scrollIntoView({behavior:'smooth'})}
$('start').onclick=start;$('rst').onclick=start;
$('all').onclick=function(){document.querySelectorAll('#lecs input').forEach(function(x){x.checked=true});cnt()};$('none').onclick=function(){document.querySelectorAll('#lecs input').forEach(function(x){x.checked=false});cnt()};
$('card').onclick=function(){this.classList.toggle('flip')};$('prev').onclick=function(){go(-1)};$('next').onclick=function(){go(1)};$('g').onclick=function(){mark(true)};$('m').onclick=function(){mark(false)};
$('rev').onclick=function(){deck=Object.keys(st).filter(function(k){return st[k]===false}).map(Number);i=0;st={};show()};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key===' '&&e.target.tagName!=='INPUT'){e.preventDefault();$('card').classList.toggle('flip')}});
$('tot').textContent=ALL.length+' cards · 15 guides';build();
