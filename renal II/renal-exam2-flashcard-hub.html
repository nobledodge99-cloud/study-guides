marrow is not stimulated."}, {"g": "Chronic Kidney Disease", "l": "Blood, Ca/Phos/PTH", "q": "CKD and vitamin D: what should you give?", "a": "<b>Calcitriol</b> (prescription, active form). Do not give vitamin D2/D3 (ergocalciferol/cholecalciferol): the kidney cannot activate them, and levels of the inactive form can be normal."}, {"g": "Chronic Kidney Disease", "l": "Blood, Ca/Phos/PTH", "q": "CKD-MBD, step 1: effect of low calcitriol.", "a": "<b>↓ Calcitriol</b> (less 1α-hydroxylase) → ↓ intestinal Ca²⁺ absorption → <b>hypocalcemia</b>. (↑ FGF23 rises early and suppresses 1α-hydroxylase, worsening the deficit.)"}, {"g": "Chronic Kidney Disease", "l": "Blood, Ca/Phos/PTH", "q": "CKD-MBD: why does hyperphosphatemia matter?", "a": "The failing kidney cannot excrete phosphate. Phosphate complexes with calcium (lowers ionized Ca²⁺) and suppresses calcitriol synthesis. <b>Ca–phos deposits calcify vessels</b> (\"PVC pipe\" aorta on CT) → cardiovascular disease."}, {"g": "Chronic Kidney Disease", "l": "Blood, Ca/Phos/PTH", "q": "What drives secondary hyperparathyroidism in CKD?", "a": "<b>Low Ca²⁺, high phosphate and low calcitriol</b> all stimulate PTH via the parathyroid calcium-sensing receptor (CaSR); loss of calcitriol also removes its negative feedback on PTH."}, {"g": "Chronic Kidney Disease", "l": "Blood, Ca/Phos/PTH", "q": "Continuously high PTH: how does it damage bone?", "a": "PTH makes osteoblasts produce <b>RANKL</b> → ↑ osteoclast activity → <b>osteitis fibrosa cystica</b> (bone resorption)."}, {"g": "Chronic Kidney Disease", "l": "Blood, Ca/Phos/PTH", "q": "Which bone disease results from low vitamin D in CKD?", "a": "<b>Osteomalacia.</b> (High PTH → osteitis fibrosa cystica.)"}, {"g": "Chronic Kidney Disease", "l": "Acidosis, K⁺ & Uremic", "q": "Why does hyperkalemia occur in CKD with acidosis?", "a": "<b>Hyperkalemia:</b> acidemia shifts K⁺ out of cells (extracellular) and the kidney cannot excrete it. Often the driver for starting bicarbonate."}, {"g": "Chronic Kidney Disease", "l": "Acidosis, K⁺ & Uremic", "q": "Hyperkalemia ECG at K⁺ 6–7 mmol/L?", "a": "<b>Peaked T waves</b> (tall, &gt;~50% of QRS height, pointed enough that you could not sit on it)."}, {"g": "Chronic Kidney Disease", "l": "Acidosis, K⁺ & Uremic", "q": "Hyperkalemia ECG at K⁺ &gt;9 mmol/L?", "a": "<b>Sine wave pattern</b>, then ventricular fibrillation/PEA arrest. A sine-wave patient can still be awake and talking, unlike VT/VF."}, {"g": "Chronic Kidney Disease", "l": "Acidosis, K⁺ & Uremic", "q": "C-BIG-K: what does the \"C\" (calcium) do?", "a": "<b>Calcium stabilizes the cardiac membrane; it does not lower K⁺.</b> Given first for ECG changes; it buys time."}, {"g": "Chronic Kidney Disease", "l": "Acidosis, K⁺ & Uremic", "q": "Uremic bleeding: treatment?", "a": "<b>Desmopressin (DDAVP)</b>, a synthetic ADH, releases extra vWF and factor VIII. Use it for uremic bleeding (nosebleed, GI bleed) instead of platelet transfusion or clotting factors."}, {"g": "Chronic Kidney Disease", "l": "Dialysis, Transplant, Drugs", "q": "Dialysis indications: which four did he mark in red?", "a": "<b>1.</b> Unresponsive hyperkalemia (diet and bicarbonate fail; potatoes matter more than bananas)<br><b>2.</b> Persistent volume overload despite diuretics<br><b>3.</b> Acidosis refractory to bicarbonate<br><b>4.</b> Bleeding diathesis (uremic platelets)"}, {"g": "Chronic Kidney Disease", "l": "Dialysis, Transplant, Drugs", "q": "Heavily tested: which toxins are removed by hemodialysis?", "a": "<b>Aspirin (ASA), lithium, ethylene glycol, methanol, isopropyl alcohol.</b> He emphasizes lithium, methanol and aspirin for overdose questions."}, {"g": "Chronic Kidney Disease", "l": "Dialysis, Transplant, Drugs", "q": "Metformin in renal failure: what is the risk and his cut-off?", "a": "<b>Metformin-associated lactic acidosis.</b> His cut-off: creatinine &gt;1.5 contraindicated. Lactate can reach mid-teens to &gt;20 (sepsis is usually 4–6); dialysis if lactate &gt;20. Stop the drug and give supportive care."}, {"g": "Chronic Kidney Disease", "l": "Dialysis, Transplant, Drugs", "q": "Gabapentin/pregabalin in AKI/CKD: what happens?", "a": "They <b>accumulate and cause altered mental status</b>. Example: max dose falls from 1200 mg three times daily to 100 mg three times daily in significant AKI."}, {"g": "Chronic Kidney Disease", "l": "Dialysis, Transplant, Drugs", "q": "Morphine in renal failure: what is the problem and the alternative?", "a": "A toxic metabolite is renally excreted and causes <b>myoclonic jerking (mimics seizures)</b>, not respiratory depression. <b>Prefer fentanyl or hydromorphone</b> in renal failure."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Equations & Volume", "q": "Serum osmolality: normal range and her advice.", "a": "<b>275-295 mOsm/kg</b> — she says commit this to memory. Calculated: 2Na⁺ + glucose/18 + BUN/2.8."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Equations & Volume", "q": "Corrected sodium for glucose.", "a": "Na⁺ falls ~<b>2.4</b> per 100 mg/dL rise in glucose (used to be 1.6)."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Equations & Volume", "q": "FENa formula, mnemonic and cut-offs.", "a": "(SCr × UNa) / (SNa × UCr) × 100 — mnemonic <b>\"screw over saucer\"</b>. &lt;1% prerenal; &gt;2% acute tubular necrosis (ATN)."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Equations & Volume", "q": "Osmolal gap: normal and meaning.", "a": "Measured − calculated; normal &lt;10; larger suggests a toxic alcohol."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Equations & Volume", "q": "Dehydration vs ECF volume depletion: what is lost?", "a": "Dehydration = pure water (total body water); ECF volume depletion = salt and water."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Equations & Volume", "q": "Dehydration: serum Na⁺, body response, fluid of choice.", "a": "Na⁺ rises (hypertonic); ↑ osmoreceptor signal → thirst and ADH; <b>free water (D5W)</b>."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Equations & Volume", "q": "ECF volume depletion: body response and fluid of choice.", "a": "↓ BP and renal perfusion → ADH, RAAS, norepinephrine; ↓ ANP; <b>isotonic saline (0.9% NaCl)</b>."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Equations & Volume", "q": "All sodium disorder evaluations start with:", "a": "Volume status: <b>wet, dry or normal</b>."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hypernatremia with pure water loss: cell effects and treatment limit.", "a": "Extracellular water leaves cells by osmosis → cells shrink, osmolality rises. Treat with water but correct <b>no more than 10 mEq/L per 24 h</b>; rapid correction → cerebral edema (and seizures)."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Free water deficit.", "a": "TBW × (Na⁺ − 140)/140; TBW = weight (kg) × 0.6 (men) or 0.5 (women); elderly 0.5 / 0.45. \"Do not memorize it.\""}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hypernatremia correction rates: acute vs chronic (slide 14).", "a": "Acute (&lt;48 h) symptomatic: 2-3 mmol/L/h, max 12/day. Chronic (&gt;48 h): 0.5 mmol/L/h, max 8-10/day."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hypernatremia fluid by volume state.", "a": "Hypovolemic: balanced crystalloid then D5W/half-isotonic; euvolemic: D5W ± loop; hypervolemic: D5W + loop diuretic."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Central vs nephrogenic DI (AVP-D vs AVP-R).", "a": "Central = pituitary does not make/release ADH, <b>responds to exogenous vasopressin</b>. Nephrogenic = kidney does not respond, <b>no response</b>."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hyponatremia definition and step 1.", "a": "Na⁺ &lt;135 mEq/L. Step 1: <b>serum osmolality</b>."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Normal osmolality hyponatremia (isotonic).", "a": "<b>Pseudohyponatremia</b> (artifact from extra fat/protein): hyperproteinemia (myeloma), hyperlipidemia (chylomicrons, triglycerides)."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "High osmolality (&gt;295) hyponatremia: causes.", "a": "Hypertonic (extra osmoles pull water out): hyperglycemia; mannitol, sorbitol, glycerol, maltose; radiocontrast; ethylene glycol, methanol."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Low osmolality (&lt;280) hyponatremia.", "a": "Hypotonic (true dilution: too much water) — needs volume status and urine Na⁺."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hypovolemic exam and labs.", "a": "Low JVP (&lt;5 cm), no edema, dry axilla, dry under tongue, tachycardia, orthostasis; UNa &lt;20, FENa &lt;1%, FEUrea &lt;35%."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hypervolemic exam.", "a": "Pitting edema, crackles (bases), high JVP, ascites, pulmonary edema."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Why does thiazide cause hyponatremia?", "a": "Most notorious diuretic: acts in the cortical distal tubule and spares medullary ADH-dependent water retention while wasting Na⁺ and K⁺. Check a BMP after starting."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hypotonic hyponatremia: hypovolemic extrarenal vs renal.", "a": "Extrarenal (UNa &lt;10-20): dehydration, vomiting, diarrhea, third spacing (burns, trauma). Renal (&gt;20): diuretics, ACE inhibitors, Addison, cerebral salt wasting, type IV RTA."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Euvolemic hypotonic hyponatremia: causes.", "a": "<b>SIADH</b> (urine osm &gt;200), psychogenic polydipsia (urine osm &lt;100), hypothyroidism, <b>beer potomania</b> (&lt;100), drugs (thiazides, ACEi, NSAIDs, SSRIs), endurance exercise, ACTH deficiency, stress, HIV."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hypervolemic hyponatremia: causes and urine Na⁺.", "a": "CHF, liver disease, nephrotic syndrome, advanced kidney disease; UNa &lt;10 (&gt;20 in renal failure)."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Key concept: beer potomania / tea-and-toast.", "a": "The kidney needs a minimum solute load to excrete each liter of urine; water intake exceeding available solutes → water retained."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "How do NSAIDs and SSRIs cause hyponatremia?", "a": "NSAIDs inhibit prostaglandins (↑ ADH effect); increased serotonin (SSRIs) ↑ ADH."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Adrenal insufficiency and hyponatremia.", "a": "Low aldosterone and cortisol: orthostasis, hyponatremia, hypokalemia, mild metabolic acidosis."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hyponatremia symptoms.", "a": "Cerebral edema: earliest nausea and malaise; then headache, lethargy, obtundation; seizures, coma and respiratory arrest (Na⁺ &lt;115-120)."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hyponatremia correction limit and complication.", "a": "<b>No more than 12 mEq/L per 24 h</b>; too fast → central pontine myelinolysis (osmotic demyelination): spastic tetraparesis, pseudobulbar paralysis, locked-in syndrome."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Hyper-/Hyponatremia", "q": "Hyponatremia treatment by cause.", "a": "Hypovolemic → isotonic saline; SIADH/primary polydipsia/reset osmostat → fluid restriction; hypervolemic → diuresis + fluid and sodium restriction; renal failure → restriction, dialysis."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Potassium", "q": "Potassium: the \"minor cation\" — what promotes uptake into cells?", "a": "Alkalosis, β-agonists, insulin (→ hypokalemia). Acidosis, α-agonists, β-blockers reduce uptake (→ hyperkalemia)."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Potassium", "q": "Acid-base and potassium links.", "a": "Metabolic alkalosis → hypokalemia; acidosis → hyperkalemia. Hypokalemia → metabolic alkalosis (↑ renal H⁺ secretion); hyperkalemia → metabolic acidosis."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Potassium", "q": "Hypokalemia: key question and cut-off.", "a": "<b>24 h urinary K⁺ &lt;15 mmol/day</b> = kidneys conserving; &gt;15 = renal wasting → check <b>TTKG</b> (&gt;4 aldosterone effect present; &lt;4 absent)."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Potassium", "q": "Liddle syndrome.", "a": "ENaC gain of function; severe hypertension with hypokalemia and metabolic alkalosis; <b>low aldosterone and renin</b> (pseudohyperaldosteronism)."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Potassium", "q": "Hyperkalemia ECG progression.", "a": "Peaked T waves and short QT (first) → lengthening PR/QRS → loss of P waves, QRS widening into sine waves → V fib or asystole."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Potassium", "q": "Aldosterone and K⁺.", "a": "Increases K⁺ secretion in the late distal tubule and cortical collecting duct; anything ↑ aldosterone lowers K⁺."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Potassium", "q": "Causes of ↓ aldosterone release or action (↑ K⁺).", "a": "Type 4 RTA; Addison; K⁺-sparing diuretics; ACEi/ARBs; NSAIDs; heparins."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Potassium", "q": "Hyperkalemia treatment: K⁺ &gt;6.5 vs &lt;6.5.", "a": "&gt;6.5: insulin + glucose, β-agonists (albuterol), NaHCO₃ if acidotic, then loop diuretic. &lt;6.5: loop diuretic and dietary restriction. Refractory: dialysis."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Mg²⁺, Phos & Cobalt", "q": "Hypomagnesemia causes.", "a": "Decreased intake/absorption (alcoholism, TPN, PPIs); GI loss; renal loss (diuretics, hyperaldosteronism, hypercalcemia); diabetes, hungry bone syndrome."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Mg²⁺, Phos & Cobalt", "q": "Mg²⁺ and K⁺ link.", "a": "Low magnesium exacerbates potassium wasting; <b>you cannot correct hypokalemia unless Mg²⁺ is repleted first</b>."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Mg²⁺, Phos & Cobalt", "q": "Very low Mg²⁺ and PTH.", "a": "Paradoxically <b>blocks PTH secretion</b> → hypocalcemia."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Mg²⁺, Phos & Cobalt", "q": "Hypermagnesemia: features, causes, treatment.", "a": "N/V, hypotension, flushing, loss of deep tendon reflexes (Mg infusion for eclampsia). Excessive intake, renal failure, lithium, milk-alkali. Stop source; loop; glucose + insulin; <b>calcium gluconate</b>."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Mg²⁺, Phos & Cobalt", "q": "Fanconi syndrome.", "a": "Not Fanconi anemia. <b>Proximal tubule defect</b>: poor reabsorption of phosphate, bicarbonate and others → acidosis, dehydration, rickets, osteomalacia, growth failure."}, {"g": "Hyponatremia &amp; Electrolyte Disorders", "l": "Mg²⁺, Phos & Cobalt", "q": "Hyperphosphatemia: classic board question.", "a": "True, normal kidney function: <b>magnesium deficiency</b>; also insulin deficiency, hypoparathyroidism, FGF-23 deficiency, pseudohypoparathyroidism, bisphosphonates."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Approach to the patient at risk: history and next steps.", "a": "Prior CVD; first-degree relatives with CVD; tobacco; then ROS, exam, labs; calculate <b>10- and 30-year CVD risk</b>; discuss lifestyle."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Hypertension damages which organs (ROS targets)?", "a": "<b>Brain, eye, heart and kidney.</b>"}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Baseline labs at diagnosis (then at least yearly).", "a": "CBC, CMP, fasting lipids, urinalysis, 12-lead ECG (silent infarction, HF, LVH), fasting glucose or HbA1c, TSH."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Urine albumin:creatinine ratio (uACR): why a ratio, and cut-offs.", "a": "Albumin is large and poorly filtered; creatinine excreted at a steady rate so the ratio corrects for urine concentration. &lt;30 normal; 30-300 elevated (microalbuminuria); &gt;300 severe kidney disease."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Who gets a uACR?", "a": "People at high kidney risk: hypertension, diabetes, CVD, family history of kidney disease. Unreliable after vigorous exercise or extreme diets."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "How to measure BP: arms and standing.", "a": "Both arms at first visit, use the higher arm; &gt;20 mm Hg difference needs investigation. Standing BP at first visit in elderly, diabetics, syncope risk; measure at <b>1 and 3 minutes</b>."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Unattended automated office BP.", "a": "Several readings, patient alone; removes some white-coat effect and may be more accurate."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Diagnosis requires:", "a": "An average of <b>2 or more readings on 2 or more occasions</b>."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "2025 AHA/ACC/ASH BP categories.", "a": "Normal &lt;120 and &lt;80; Elevated 120-129 and &lt;80; Stage 1 130-139 or 80-89; Stage 2 ≥140 or ≥90; markedly elevated ≥180 or ≥120."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Above 180/120: asymptomatic vs organ damage.", "a": "Without organ damage = markedly elevated (severe asymptomatic, formerly \"urgency\"); with organ damage = <b>hypertensive emergency</b>. The distinction changes treatment."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "2025 guideline preference for BP measurement.", "a": "<b>Out-of-office BP</b>: home readings or 24-hour ambulatory BP monitoring (ABPM); more reproducible, track organ damage better, find white-coat and masked hypertension."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "ABPM: gold standard and when to get it.", "a": "Worn ≥24 h. Suspected white-coat/masked HTN; resistant HTN; unreliable readings; nocturnal HTN. Not needed when BP extremely high or clear organ damage (treat first)."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "White-coat hypertension.", "a": "Office elevated (&gt;130/80), home/ambulatory &lt;125/75; short-lived adrenergic response; incidence 15-30%; minimal added CVD risk; <b>no treatment</b> or dose change."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Masked hypertension.", "a": "Office normal, home/ambulatory elevated; daily stressors drive sympathetic response; <b>same CVD risk as sustained HTN</b>; prevalence ~12%."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "Clinical pearl: home BP high but office BP normal.", "a": "Believe them first; confirm technique, then consider ABPM. \"Masked hypertension is real.\""}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "2025 treatment: normal and elevated BP.", "a": "Normal: lifestyle, reassess 1 year. Elevated 120-129/&lt;80: intensify lifestyle, recheck 3-6 months."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "2025 treatment: stage 1.", "a": "Lifestyle for everyone. Start medication if <b>PREVENT 10-year total CVD risk ≥7.5%</b>, or CVD, CKD or diabetes. Otherwise recheck 3-6 months; treat if still ≥130/80."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "2025 treatment: stage 2.", "a": "Medication plus lifestyle; follow-up in 1 month to titrate."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "BP goal.", "a": "<b>&lt;130/80</b> for most adults, confirmed with out-of-office readings, balanced against tolerability, comorbidity, orthostasis and falls."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "PREVENT vs old ASCVD estimator.", "a": "PREVENT: total CVD, ASCVD and heart failure at 10 and 30 years; <b>race removed</b> (optional zip-code social deprivation index); includes eGFR, optional uACR and HbA1c; primary prevention age 30-79. Old: 10-year ASCVD only, race an input."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "PREVENT: when not to use.", "a": "Known CVD, known inherited CVD variants, EF &lt;40% (slide says \"&lt;4%\"), high coronary calcium, prior stroke."}, {"g": "Hypertension", "l": "Part 1a: Diagnosis & 2025 Guideline", "q": "PREVENT 10-year total CVD risk categories.", "a": "&lt;5% low; 5-7.4% borderline; 7.5-19.9% intermediate (medication threshold in stage 1); ≥20% high."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Modifiable vs relatively fixed risk factors.", "a": "Modifiable: smoking, prediabetes/diabetes, dyslipidemia, obesity, inactivity, unhealthy diet. Fixed: low SES/education, male sex (to 65), OSA, known CVD, psychosocial stress, CKD, family history, age."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Lifestyle recommendations (table).", "a": "DASH-type diet; sodium &lt;1500 mg/day (or cut 1000 mg); 90-150 min/week aerobic or dynamic resistance; BMI &lt;25 (5-10% helps); alcohol ≤2/day men, ≤1/day women; tobacco cessation, stress, sleep."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Key message: \"I feel fine\".", "a": "Primary hypertension usually causes no symptoms; \"I feel fine\" is not evidence of control. Most CV events occur in adults with BP &lt;140/90, before hypertension is diagnosed. Systolic is the stronger risk determinant in middle/older age."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Hypertension-mediated organ damage (HMOD): organs.", "a": "Brain: stroke, encephalopathy. Eye: retinopathy. Heart: HF, MI, unstable angina, aortic dissection. Kidney: AKI and CKD."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Hypertension and the kidney: treatment.", "a": "Treat if ≥140/90 to &lt;130/80 (&lt;140/80 elderly). First line <b>ACEI or ARB</b> (↓ albuminuria); add CCB or diuretic (loop if eGFR &lt;30). Monitor eGFR, uACR, electrolytes."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Hypertensive retinopathy.", "a": "Most common initial organ finding; always do a fundus exam in new patients; arteriolar narrowing, AV nicking, copper wiring, cotton-wool spots, flame/blot hemorrhages, exudates, disc edema. Retinopathy at first visit = longer duration than suspected."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Severe hypertension: markedly elevated vs emergency.", "a": "&gt;180 and/or &gt;120 (or MAP &gt;135). Asymptomatic: restart or intensify oral drugs; follow up ~2 weeks. Emergency: organ damage → ICU, IV agents, controlled lowering."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "COPD, HIV, children, hyperparathyroidism and CAH: what to know about hypertension in each.", "a": "<b>COPD:</b> most frequent comorbidity; ARB + CCB ± diuretic; cardioselective β-blockers only with compelling indications (CAD, HF); smoking cessation mandatory.<br><b>HIV:</b> higher CV risk; avoid calcium-channel blockers (antiretroviral interactions).<br><b>Children:</b> any hypertension warrants secondary cause workup; upper limits age 3 100/61, age 8 108/71, age 12 116/75, age 15 120/78.<br><b>Hyperparathyroidism:</b> rare; fatigue, weakness, bone pain, fractures, confusion; hypertension from arterial stiffening; labs calcium, PTH, phosphorus.<br><b>CAH:</b> autosomal recessive. Hypertensive forms: <b>11β-hydroxylase and 17α-hydroxylase</b> deficiency (excess mineralocorticoid). 21-hydroxylase: salt-wasting (hyponatremia, hyperkalemia, hypoglycemia)."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Pregnancy: chronic vs gestational vs preeclampsia vs eclampsia.", "a": "Chronic: before pregnancy or &lt;20 weeks, persists &gt;6 weeks postpartum. Gestational: after 20 weeks, resolves within 6 weeks. Preeclampsia: HTN + proteinuria (&gt;300 mg/24 h). Eclampsia: + seizures. HELLP."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Eclampsia, severe preeclampsia, HELLP: management.", "a": "Treat immediately and <b>deliver</b>; magnesium sulfate + labetalol or nicardipine. Pregnancy drugs: labetalol, hydralazine, methyldopa (category B), nifedipine; avoid ACEI/ARBs."}, {"g": "Hypertension", "l": "Part 1b: Essential HTN & Organ Damage", "q": "Hypertension populations: first-line.", "a": "CKD/diabetes with albuminuria: ACEI/ARB. Black adults without CKD/diabetes: thiazide or CCB. First-line classes: thiazide-type (chlorthalidone preferred), ACEI/ARBs, CCBs. Frail elderly target &lt;140/80."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Secondary hypertension: how common, when suspect?", "a": "Bimodal: 70-85% of hypertension in children &lt;12; ~17% in adults &gt;64. Suspect: age &lt;25 or &gt;65 new/sudden; diastolic HTN after 65; drug-resistant (3+ agents); bruits; unprovoked hypokalemia; initial severe HTN (&gt;160/120)."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Pseudoresistant hypertension: fix these.", "a": "Ineffective regimen, heavy arterial calcification, nonadherence, <b>pressor substances</b>: NSAIDs, calcineurin inhibitors, glucocorticoids, herbs (yohimbine, St John's wort), sympathomimetics, antipsychotics, antidepressants (venlafaxine, fluoxetine), buspirone."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Truly resistant hypertension: workup.", "a": "Primary aldosteronism, CKD, obesity, OSA, pheochromocytoma, Cushing, atherosclerotic RAS, FMD, coarctation, thyroid/parathyroid, severe essential HTN."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Cause → prevalence and clue (her table): OSA, renovascular, aldosteronism.", "a": "OSA 25-50%: snoring, somnolence, obesity. Renovascular 5-34%: continuous abdominal bruit, asymmetric kidneys. Primary aldosteronism 8-20%: hypokalemia."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Cause → clue: pheochromocytoma, coarctation, Cushing, hyperparathyroidism.", "a": "Pheo (0.1-0.6%): labile HTN, pallor, MEN2. Coarctation (0.1%): lower BP in legs, absent femoral pulses. Cushing: moon facies, striae, bruising. Hyperparathyroidism: hypercalcemia."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Mnemonic <b>ABC2DE</b>.", "a": "<b>A</b>pnea, <b>B</b>ruits (RAS, FMD), <b>C</b>atecholamines (pheo), <b>C</b>KD, <b>D</b>rugs (OCPs, NSAIDs, pseudoephedrine, cocaine, caffeine, amphetamines, steroids), <b>E</b>ndocrine."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Atherosclerotic renal artery stenosis: who and why.", "a": "Most common renovascular cause, older (often male); reduced renal flow → RAAS → Ang II and aldosterone → volume and resistance rise."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "RAS: suspect and exam.", "a": "New HTN with other atherosclerosis, <b>flash pulmonary edema</b>, recurrent HF, ischemic nephropathy, refractory HTN. Abdominal bruit ~40% (specific); hypokalemia ~50%; elevated creatinine."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "RAS testing.", "a": "Renal artery duplex, CT or MR angiography, invasive angiography. Sharp creatinine rise after ACEI/ARB suggests bilateral RAS."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Fibromuscular dysplasia (FMD).", "a": "Young to middle-aged women; non-atherosclerotic, non-inflammatory smooth-muscle overgrowth; renal and carotid arteries; <b>\"string of beads\"</b>; good response to angioplasty."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Atherosclerotic RAS vs FMD (age, sex, bilateral, angioplasty).", "a": "Atherosclerotic: &gt;50, male, bilateral 33%, progressive +++, angioplasty +. FMD: &lt;40, female, bilateral 60%, progressive +, angioplasty +++."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "CKD and hypertension.", "a": "Cause and consequence; silent until CV event; CKD diagnosed with uACR &gt;300 regardless of eGFR; treat with ACEI/ARB; on dialysis tight BP control not warranted (inter-dialytic SBP &lt;90 symptomatic)."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Liddle syndrome.", "a": "Increased ENaC activity → Na⁺/water retention, K⁺ excretion → hypertension, hypokalemia, metabolic alkalosis, <b>low renin and low aldosterone</b> (&lt;5). Treat with <b>amiloride</b> + low salt; spironolactone does not work."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Coarctation of the aorta: anatomy and associations.", "a": "Narrowing near the left subclavian; 0.4% of live births; bicuspid aortic valve in 50-75%."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Coarctation exam and imaging.", "a": "Brachial-femoral delay, upper-extremity systolic HTN, low leg BP, weak leg pulses; systolic murmur left upper sternal border; continuous posterior murmur between scapulae; <b>inferior rib notching</b> on CXR; MRA, TEE."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Primary aldosteronism: causes.", "a": "Aldosterone-producing adenoma (70%) or bilateral adrenal hyperplasia (25%)."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Primary aldosteronism: suspect and labs.", "a": "New/severe/refractory HTN with unexplained hypokalemia (present in &lt;40%) and suppressed renin. Correct K to ≥3.5; early-morning aldosterone and renin; <b>aldosterone/renin ratio &gt;20</b>; pursue if aldosterone &gt;10 or renin low."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Primary aldosteronism: imaging and treatment.", "a": "Adrenal CT; adrenal vein sampling if surgery planned. Unilateral adenoma/age &lt;35 → laparoscopic adrenalectomy (cures HTN in only ~50%). Medical: sodium &lt;1500, spironolactone/eplerenone, amiloride, thiazide-like."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Hyperthyroidism vs hypothyroidism and BP.", "a": "Hyper: β-receptors more sensitive → systolic hypertension, tachycardia. Hypo: <b>isolated diastolic hypertension</b> (↑ peripheral resistance, low output). Screen with TSH."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Cushing syndrome: mechanism of hypertension.", "a": "Cortisol acts like aldosterone (Na⁺/water retention), more Ang II receptors, more catecholamine effect, less nitric oxide → higher SVR."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Cushing: signs and causes.", "a": "Central obesity, purple abdominal striae, easy bruising, buffalo hump, moon facies, proximal weakness. Pituitary adenoma, adrenal adenoma, or exogenous glucocorticoids."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Cushing: diagnosis and treatment.", "a": "Late-night salivary cortisol or overnight dexamethasone suppression test; MRI brain/adrenal CT. Pituitary surgery 78% remission; ketoconazole (rapid), <b>mifepristone</b> (preferred with diabetes)."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Pheochromocytoma: what is it and where?", "a": "Catecholamine-secreting neuroendocrine tumor; 98% intra-abdominal (adrenal), 2% neck/thorax (paraganglioma). Test-favorite. 10% malignant; 40% familial."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Pheochromocytoma: clinical picture.", "a": "Difficult-to-control HTN with paroxysmal spells ~20 min: tachycardia, tremor, sweating, flushing, headache, pallor; mistaken for anxiety/panic. May cause orthostatic hypotension."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Pheochromocytoma: who to suspect.", "a": "Hyperadrenergic spells, resistant HTN, MEN2, neurofibromatosis 1, von Hippel-Lindau, family history, pressor response during anesthesia, onset before 20, idiopathic dilated cardiomyopathy."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Pheochromocytoma: diagnosis and treatment.", "a": "Plasma free metanephrines (&gt;3× upper limit usually diagnostic); confirm with 24-hour urine fractionated metanephrines; CT/MRI. Surgery after <b>α- then β-blockade</b> (unopposed alpha can precipitate crisis)."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Obstructive sleep apnea and hypertension.", "a": "25-50% of hypertensives; sympathetic drive ↑ CO and resistance; nocturnal and non-dipping HTN; CPAP lowers BP only slightly; weight loss best."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Drugs that cause hypertension: estrogen and NSAIDs.", "a": "Estrogen: hepatic angiotensinogen ↑, aldosterone-mediated Na⁺/water retention. NSAIDs (esp. COX-2): less vasodilating prostaglandin, less Na⁺/water excretion, RAAS activation."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Drugs that cause hypertension: others.", "a": "Alpha-agonists (pseudoephedrine, phenylephrine); cocaine, amphetamines; calcineurin inhibitors (cyclosporine &gt; tacrolimus), VEGF inhibitors, PARP/BTK/mTOR inhibitors; chronic glucocorticoids."}, {"g": "Hypertension", "l": "Part 2: Secondary HTN", "q": "Neurogenic hypertension (mimics pheochromocytoma).", "a": "Sympathomimetics (cocaine, methamphetamine), untreated OSA, <b>baroreflex failure</b> (prior head/neck surgery or radiation)."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Etiologies of acid-base disorders: name the four primary disorders.", "a": "Respiratory acidosis, metabolic acidosis, respiratory alkalosis, metabolic alkalosis."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Etiologies tree: how is metabolic acidosis divided?", "a": "<b>High AG (anion gap) acidosis</b> (MUDPILES) and <b>Normal AG acidosis</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Henderson-Hasselbach equation.", "a": "<b>pH = 6.1 + log (HCO3⁻ / (0.03 × pCO2))</b>"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Three ways metabolic acidosis arises.", "a": "1. Over-production or accumulation of acid<br>2. Loss of base (HCO3⁻)<br>3. Under-excretion of acid"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Two ways metabolic alkalosis arises.", "a": "Loss of acid; under-excretion of base."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Compensation: how fast is metabolic compensation by the kidneys?", "a": "Within <b>2-3 days</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Boston Method, <b>acute respiratory acidosis</b>: rule and expected HCO3⁻.", "a": "For every 10 mmHg increase in PaCO2, HCO3⁻ rises by <b>1</b> mmol/L.<br>Expected HCO3⁻ = 24 + ((PaCO2 − 40) / 10)"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Boston Method, <b>chronic respiratory acidosis</b>: rule and expected HCO3⁻.", "a": "For every 10 mmHg increase in PaCO2, HCO3⁻ rises by <b>4</b> mmol/L.<br>Expected HCO3⁻ = 24 + (4 × (PaCO2 − 40) / 10)"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Boston Method, <b>acute respiratory alkalosis</b>: rule and expected HCO3⁻.", "a": "For every 10 mmHg decrease in PaCO2, HCO3⁻ falls by <b>2</b> mmol/L.<br>Expected HCO3⁻ = 24 − (2 × (40 − PaCO2) / 10)"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Boston Method, <b>chronic respiratory alkalosis</b>: rule and expected HCO3⁻.", "a": "For every 10 mmHg decrease in PaCO2, HCO3⁻ falls by <b>5</b> mmol/L.<br>Expected HCO3⁻ = 24 − (5 × (40 − PaCO2) / 10)"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Metabolic acidosis: Winters Formula.", "a": "For complete compensation, <b>PaCO2 = (1.5 × HCO3⁻) + 8</b>"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Metabolic alkalosis: the \"point 7 + 20 rule\".", "a": "For complete compensation, <b>PaCO2 = (0.7 × HCO3⁻) + 20</b>"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Interpreting an ABG: the 6 steps (Dr. Kinder).", "a": "<b>1.</b> pH: acidemia (&lt;7.4) vs alkalemia (&gt;7.4).<br><b>2.</b> HCO3⁻ and PCO2: is the primary process metabolic or respiratory?<br><b>3.</b> Compensated (chronic), uncompensated (acute) or partially compensated?<br><b>4.</b> Calculate the anion gap to classify a metabolic acidosis or find a mixed disorder; calculate the delta ratio if an anion gap exists.<br><b>5.</b> If metabolic, look at pCO2 for an additional respiratory process.<br><b>6.</b> Go back to the clinical picture: do the calculations make sense?"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Delta Ratio (intro slide).", "a": "(change in anion gap)/(change in bicarbonate) = (measured anion gap − normal anion gap)/(normal bicarb − measured bicarb) = <b>(measured anion gap − 12) / (24 − measured bicarb)</b>"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Worked: HCO3⁻ is 10 in a metabolic acidosis. Complete-compensation PaCO2?", "a": "1.5 × 10 + 8 = <b>23</b> mmHg."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Worked: PaCO2 rises to 60 mmHg. Expected HCO3⁻, acute vs chronic respiratory acidosis?", "a": "Acute: 24 + (20/10) = <b>26</b>.<br>Chronic: 24 + 4 × (20/10) = <b>32</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Intro", "q": "Worked: HCO3⁻ is 40 in a metabolic alkalosis. Complete-compensation PaCO2?", "a": "0.7 × 40 + 20 = <b>48</b> mmHg."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Define high anion gap metabolic acidosis (Part 1 slide).", "a": "Gain of either ingested or body-produced <b>nonvolatile acids</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "The two mnemonics for high anion gap metabolic acidosis.", "a": "<b>MUDPILES</b> and <b>GOLDMARK</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "MUDPILES.", "a": "<b>M</b>ethanol (ethanol) and <b>M</b>etformin<br><b>U</b>remia (acute or chronic renal failure)<br><b>D</b>iabetic Ketoacidosis (DKA)<br><b>P</b>ropylene glycol<br><b>I</b>soniazid (INH)/iron<br><b>L</b>actic acidosis<br><b>E</b>thylene glycol<br><b>S</b>alicylates (late)"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "GOLDMARK.", "a": "<b>G</b>lycols (ethylene and propylene)<br><b>O</b>xoproline (5-oxoproline)<br><b>L</b>-Lactic acid<br><b>D</b>-Lactic acid<br><b>M</b>ethanol and <b>M</b>etformin<br><b>A</b>spirin<br><b>R</b>enal failure<br><b>K</b>etoacidosis (diabetic and alcoholic)"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Ingested ethylene glycol: acid, explanation, clues.", "a": "Oxalic acid; metabolized to oxalate by <b>alcohol dehydrogenase</b>.<br>Clues: <b>urine oxalate crystals</b>, high serum osmolar gap."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Ingested methanol: acid, explanation, clues.", "a": "Formic acid; methanol metabolized to formic acid by alcohol dehydrogenase.<br>Clues: <b>blindness</b>, renal failure, high serum osmolar gap."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Which enzyme metabolizes ethylene glycol, propylene glycol and methanol to acids?", "a": "Alcohol dehydrogenase."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Clue → cause: urine oxalate crystals, high serum osmolar gap.", "a": "Ingested <b>ethylene glycol</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Clue → cause: blindness, renal failure, high serum osmolar gap.", "a": "Ingested <b>methanol</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Clue → cause: hypotension, high serum osmolar gap.", "a": "Ingested <b>propylene glycol</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Clue → cause: history of ethanol abuse, abdominal pain, low-normal serum glucose.", "a": "<b>Alcoholic ketoacidosis</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Clue → cause: liver toxicity, seizures.", "a": "<b>Isoniazid toxicity</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Clue → cause: confusion, headache after surgery (small bowel resection).", "a": "<b>D-lactic acidosis</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Clue → cause: malnourished women, after acetaminophen/paracetamol.", "a": "<b>5-Oxoproline</b> (pyroglutamic acid)."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Clue → cause: concurrent respiratory alkalosis, tinnitus, GI bleeding.", "a": "<b>Salicylates (aspirin)</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Osmolal gap: formula.", "a": "<b>Measured osmolality − (2 × Na + BUN/2.8 + glucose/18)</b>"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Osmolal gap: what does a gap of more than 10 mOsm/kg suggest?", "a": "Abnormal; suggests the presence of an abnormal (ingested) osmole like <b>ethanol or ethylene glycol</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Anion gap formula and normal value; what value does Dr. Kinder use?", "a": "Anion Gap = Serum Sodium − (Serum Chloride + Serum Bicarbonate).<br>Normal = 8.0-10.0 mEq/L ± 2 mEq/L; \"I will use <b>12</b> mEq/L as a normal anion gap in acid-base problems.\""}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Albumin-corrected anion gap (and normal albumin).", "a": "<b>Anion Gap + 2.5 × (Normal Albumin − Measured Albumin)</b>; normal albumin 4.0 g/dL."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "If the corrected anion gap is increased, what should be assessed?", "a": "Patients should be assessed for a <b>coexistent normal anion gap acidosis or metabolic alkalosis</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Δ-Δ ratio (Part 1 slide).", "a": "(Δ anion gap) / (Δ bicarbonate) = <b>(anion gap − 12) / (25 − bicarbonate)</b>"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Δ-Δ ratio &lt;0.5 to 1 means:", "a": "May reflect concurrent <b>normal anion gap metabolic acidosis</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Δ-Δ ratio between 1-2 means:", "a": "Generally confirms the <b>primary high anion gap metabolic acidosis</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Δ-Δ ratio &gt;2 means:", "a": "May indicate the presence of <b>metabolic alkalosis</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Question 1: 45 y/o, alcohol use disorder, fruity odor, Na 140, Cl 102, HCO3 10, pH 7.25, pCO2 22, glucose 450, ketones positive.", "a": "Metabolic acidosis with respiratory compensation. AG = 140 − (102 + 10) = <b>28</b>. ΔAG 16, ΔHCO3 15 → Δ-Δ ≅ <b>1.1</b>: <b>pure high anion gap metabolic acidosis</b> (A)."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Question 2: 58 y/o woman, CKD, Na 135, Cl 105, HCO3 12, pH 7.29, pCO2 26, lactate 6.", "a": "AG = <b>18</b>; ΔAG 6, ΔHCO3 13 → Δ-Δ ≅ <b>0.5</b>: <b>mixed high anion gap and non anion gap metabolic acidosis</b> (C)."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 1", "q": "Question 3: 32 y/o, peptic ulcer disease, NSAIDs, vomiting; Na 140, Cl 90, HCO3 22, pH 7.35, pCO2 40, lactate 4.", "a": "AG = <b>28</b>; ΔAG 16, ΔHCO3 3 → Δ-Δ ≅ <b>5.3</b> (&gt;2): <b>mixed high anion gap metabolic acidosis and metabolic alkalosis</b> (C)."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Non-anion gap metabolic acidosis: most often results from (3).", "a": "1. Gastrointestinal bicarbonate losses (diarrhea)<br>2. Kidney bicarbonate loss (type 2 renal tubular acidosis)<br>3. Inability of the kidney to adequately excrete acid (type 1 and type 4 RTA; chronic kidney disease)"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "What may help narrow down the etiology of a non-anion gap metabolic acidosis?", "a": "The <b>Urine Anion Gap</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Urine anion gap: how should the kidneys respond to acidemia?", "a": "Increase acid excretion — by increasing tubular production of <b>ammonia (NH3)</b> and secretion of protons, resulting in increased <b>urine ammonium (NH4⁺)</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Urine Anion Gap formula.", "a": "<b>(Urine Sodium + Urine Potassium) − Urine Chloride</b>"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Gastrointestinal bicarbonate loss (diarrhea; laxative abuse): urinary findings.", "a": "Increased ammonium excretion; less excretion of sodium and potassium; chloride excretion continues to match ammonium excretion to maintain electrical neutrality."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "GI bicarbonate loss: UAG, urine pH, serum potassium.", "a": "Urine anion gap <b>negative</b>; urine pH <b>&lt; 5.5</b>; serum potassium <b>normal or decreased</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Type 4 (hyperkalemic distal) RTA: UAG, serum K, urine pH.", "a": "<b>Positive</b> urine anion gap; <b>increased</b> serum potassium; urine pH <b>&lt; 5.5</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Type 1 (hypokalemic distal) RTA: UAG, serum K, urine pH.", "a": "<b>Positive</b> urine anion gap; <b>decreased</b> serum potassium; urine pH <b>&gt; 5.5</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Type 2 (proximal) RTA: UAG, serum K, urine pH.", "a": "<b>Negative</b> urine anion gap; <b>decreased</b> serum potassium; <b>variable</b> urine pH."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Type 4 RTA is caused by:", "a": "<b>Aldosterone deficiency or resistance</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Type I (hypokalemic distal) RTA: the defect.", "a": "Distal tubular defect → impaired excretion of hydrogen ions by the distal nephron → low urine ammonium and positive urine anion gap, with inability to acidify urine below a pH of <b>6.0</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Type II (proximal) RTA: primary defect.", "a": "Failure of the proximal tubule to adequately absorb filtered bicarbonate, resulting in bicarbonate loss and acidosis."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Fanconi syndrome components.", "a": "Glycosuria, phosphaturia, aminoaciduria, hypouricemia."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Type II RTA: where does serum bicarbonate stabilize?", "a": "Around <b>12-14 mEq/L</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Question 1: 30 y/o woman, fatigue, muscle weakness, recurrent kidney stones; Na 140, Cl 113, HCO3 15, K 3.0, pH 7.32, pCO2 32, urine pH 6.5.", "a": "Metabolic acidosis with respiratory compensation; AG = 140 − (113 + 15) = <b>12</b> (normal 8-12) → non-anion gap. Elevated urine pH, hypokalemia and kidney stones → <b>Type I (Distal) RTA</b> (C)."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 2", "q": "Question 2: 50 y/o, 3-day watery diarrhea; Na 138, Cl 110, HCO3 17, pH 7.33, pCO2 33, K 3.5, UNa 45, UK 25, UCl 100.", "a": "AG = <b>11</b> → non-anion gap. UAG = (45 + 25) − 100 = <b>−30</b> → <b>diarrhea-induced acidosis</b> (D)."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Define metabolic alkalosis.", "a": "<b>Blood pH &gt; 7.45</b> and <b>elevated serum bicarbonate</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "The two categories of metabolic alkalosis.", "a": "<b>Chloride-Responsive</b> and <b>Chloride-Resistant</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Chloride-responsive: gastrointestinal loss of acid.", "a": "Lose acid and retain bicarbonate — <b>vomiting, NG-tube suctioning</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Chloride-responsive: diuretic-induced loss of acid in the kidney.", "a": "Common with <b>loop diuretics</b>; volume depletion."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Diuretic-induced metabolic alkalosis: the mechanism chain.", "a": "Volume depletion → ↑ aldosterone → <b>α-intercalated cells</b> secrete H⁺ into the collecting duct lumen. ↑ Na⁺ delivery to the collecting duct → Na⁺ enters principal cells via <b>ENaC</b> → the added positive charge pushes K⁺ out into the lumen. This stimulates the apical H⁺-K⁺ ATPase, so adjacent intercalated cells secrete more H⁺ → alkalosis."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Chloride-resistant metabolic alkalosis: typically secondary to?", "a": "An <b>endocrine or renal tubular abnormality</b> leading to hydrogen ion loss and metabolic alkalosis."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Hyperaldosteronism: mechanism and accompanying findings.", "a": "Stimulates hydrogen ion secretion by the intercalated cells of the collecting duct → metabolic alkalosis. <b>Hypokalemia and hypertension</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Congenital tubular abnormalities causing chloride-resistant alkalosis.", "a": "<b>Bartter, Liddle, and Gitelman syndromes</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "What maintains metabolic alkalosis: volume depletion and hypokalemia?", "a": "<b>Volume depletion:</b> proximal tubule retains Na⁺ driven by <b>angiotensin II</b>; bicarbonate is retained with the sodium; chloride depletion also helps maintain the alkalosis.<br><b>Hypokalemia:</b> intracellular K⁺ shifts out and H⁺ shifts into cells (raising blood pH); in the kidney it directly inhibits bicarbonate excretion and stimulates the luminal H⁺/K⁺-ATPase in the collecting duct, increasing H⁺ secretion."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Testing: urine chloride cut-offs.", "a": "<b>&lt;10 mEq/L</b> → chloride-responsive.<br><b>&gt;20 mEq/L</b> → chloride-resistant.<br>(Rationale slide: saline responsive = low urine chloride &lt;15.)"}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Treatment of chloride-responsive metabolic alkalosis.", "a": "<b>Normal saline</b>; discontinue diuretics; correct potassium if low."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Treatment of chloride-resistant metabolic alkalosis.", "a": "Replace potassium; <b>aldosterone antagonists</b> for hyperaldosteronism; <b>ENaC blockers</b> for Liddle syndrome; <b>cortisol</b> for 17-hydroxylase deficiency."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Treatment → disease: ENaC blockers.", "a": "<b>Liddle syndrome</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Treatment → disease: cortisol.", "a": "<b>17-hydroxylase deficiency</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Treatment → disease: aldosterone antagonists.", "a": "<b>Hyperaldosteronism</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Question: 33 y/o female, weakness and muscle cramping, BP 120/72, BMI 36; Na 135, K 2.4, Cl 79, HCO3 44, pH 7.61, pCO2 45, urine Cl 3.", "a": "<b>Surreptitious vomiting</b> (D)."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Rationale: Bartter and Gitelman syndromes.", "a": "Autosomal recessive disorders involving renal sodium and chloride transporters that mimic <b>loop diuretic</b> (Bartter) and <b>thiazide diuretic</b> (Gitelman) use; hypokalemic alkalosis with urine chloride <b>&gt; 15 mEq/L</b>."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Rationale: hypertension + metabolic alkalosis + hypokalemia is consistent with:", "a": "Elevated aldosterone (<b>Cushing syndrome and Primary Aldosteronism</b>). A low urine chloride rules these out."}, {"g": "Acid-Base Disorders &amp; Arterial Blood Gases", "l": "Part 3", "q": "Rationale: whom should you evaluate for Cushing/primary aldosteronism?", "a": "Patients with <b>high urine chloride, elevated blood pressure, and hypokalemia</b>."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Afferent vs efferent arteriole tone.", "a": "Afferent tone controls blood entering; efferent tone controls <b>pressure held within the glomerulus</b>."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Efferent constriction (moderate): RBF, intraglomerular pressure, GFR.", "a": "RBF ↓; intraglomerular pressure ↑; GFR maintained/↑ (marked constriction eventually ↓ GFR)."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Efferent dilation: effect on intraglomerular pressure and GFR.", "a": "Intraglomerular pressure ↓; GFR initial ↓."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Angiotensin II in the glomerulus.", "a": "<b>Preferentially constricts the efferent arteriole</b> to preserve intraglomerular pressure and GFR."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Chronic RAAS overactivity: consequence.", "a": "Persistent intraglomerular hypertension; excess MR signaling promotes inflammation and fibrosis."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Hyperfiltration cycle.", "a": "Fewer nephrons → survivors raise single-nephron GFR, flow and pressure → podocyte injury, ↑ permeability, albuminuria, glomerulosclerosis → further nephron loss (self-perpetuating)."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Albuminuria categories A1 / A2 / A3 (UACR).", "a": "A1 &lt;30 mg/g; A2 30-300 mg/g; A3 &gt;300 mg/g."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Why does albuminuria matter?", "a": "Marks glomerular damage and predicts progression, kidney failure and cardiovascular events, even with preserved eGFR. Lower albuminuria = lower progression risk."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Tubuloglomerular feedback (TGF).", "a": "Macula densa senses NaCl: high NaCl → afferent constriction (↓ GFR); low NaCl → afferent dilation, ↑ renin, efferent constriction."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Diabetes and hyperfiltration.", "a": "More filtered glucose → more proximal Na⁺/glucose reabsorption via SGLT2 → less NaCl at macula densa → relative afferent dilation + RAAS → ↑ intraglomerular pressure."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Physiology→pharmacology link: early creatinine rise.", "a": "Drugs that lower intraglomerular pressure cause an early dip in GFR / rise in creatinine; a modest early change is the intended hemodynamic effect."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "<b>Lisinopril</b> (CORE): mechanism and adverse effects.", "a": "ACE inhibitor: ↓ angiotensin II → efferent dilation → ↓ intraglomerular pressure and albuminuria. Hyperkalemia; initial ↑ SCr; hypotension; cough/angioedema (bradykinin); bilateral renal artery stenosis; contraindicated in pregnancy."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "<b>Losartan</b> (CORE): how differs from ACE inhibitors.", "a": "ARB — blocks AT₁ receptor; same efferent dilation; <b>no significant bradykinin effect so cough is much less common</b>; avoid in pregnancy."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "<b>Empagliflozin</b> (CORE): mechanism and adverse effects.", "a": "SGLT2 inhibitor: blocks proximal Na⁺/glucose cotransport → ↑ NaCl to macula densa → restores TGF → relative afferent constriction → ↓ hyperfiltration. Volume depletion, genital mycotic infections, <b>euglycemic ketoacidosis</b>, small early eGFR dip. Works with or without diabetes."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "<b>Finerenone</b> (CORE): mechanism and key adverse effect.", "a": "Nonsteroidal MR antagonist: ↓ proinflammatory/profibrotic signaling; benefit from less inflammation/fibrosis, not hemodynamics or diuresis. More MR-selective than spironolactone. <b>Hyperkalemia</b> is most important."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "One-line mechanisms: ACEi/ARB vs SGLT2i vs finerenone.", "a": "ACEi/ARB: ↓ efferent tone → ↓ intraglomerular pressure. SGLT2i: restores TGF → ↓ hyperfiltration. Finerenone: ↓ MR-mediated inflammation and fibrosis."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Class-level agents (recognition): ACEi/ARBs/SGLT2i beyond the CORE agents.", "a": "ACEi: ramipril, enalapril, benazepril, captopril. ARBs: valsartan, irbesartan, candesartan, olmesartan. SGLT2i: dapagliflozin, canagliflozin."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "NSAIDs + ACEi/ARB.", "a": "NSAIDs constrict the afferent arteriole, lowering glomerular pressure further; adding to an ACEi/ARB (esp. with volume depletion or diuretics) raises AKI risk."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "When is an ACE inhibitor/ARB recommended?", "a": "A3 without diabetes; A2 or A3 with diabetes. Suggested: A2 without diabetes. A1: still used for hypertension/HFrEF. Titrate to the highest tolerated dose."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Never combine?", "a": "An ACEi with an ARB or direct renin inhibitor (more harm, no kidney benefit)."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "When is an SGLT2 inhibitor recommended?", "a": "T2D + CKD + eGFR ≥20; or CKD with eGFR ≥20 and UACR ≥200 regardless of diabetes; or heart failure. Suggested: eGFR 20-45 with UACR &lt;200. Usually stopped when dialysis starts."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "When is finerenone used?", "a": "T2D, eGFR &gt;25, K⁺ in range, persistent UACR &gt;30 mg/g despite maximum tolerated ACEi/ARB. Guidelines apply only to T2D CKD."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "ACEi/ARB monitoring.", "a": "SCr/eGFR and K⁺ within <b>2-4 weeks</b> of start or dose increase; BP."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "ACEi/ARB: SCr rise threshold to look for a cause.", "a": "<b>&gt;30% within 4 weeks</b>: search for volume depletion, hypotension, NSAIDs, diuretics, renal artery stenosis. Continue despite modest rise, even if eGFR later &lt;30."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "ACEi/ARB: when to reduce/stop.", "a": "Symptomatic hypotension, uncontrolled hyperkalemia despite treatment, or eGFR &lt;15 with uremic symptoms; avoid in pregnancy. Treat hyperkalemia first."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "SGLT2 inhibitor: when to hold.", "a": "Temporarily hold for prolonged fasting, surgery, critical illness (ketosis risk), significant volume depletion/hypotension; stop at dialysis or intolerance. Watch for ketoacidosis symptoms even with normal glucose."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part A: Progression", "q": "Finerenone potassium rules.", "a": "Start only if K⁺ ≤4.8. ≤4.8 continue; 4.9-5.5 continue with monitoring; &gt;5.5 hold; restart when ≤5.0."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "K⁺ secretion: where and how?", "a": "Principal cells of the late distal tubule/cortical collecting duct via basolateral Na⁺/K⁺-ATPase then apical ROMK and BK channels; Na⁺ entry through ENaC makes the lumen negative."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "What increases K⁺ secretion?", "a": "↑ plasma K⁺, ↑ aldosterone, ↑ distal Na⁺ delivery and flow. High K⁺ directly stimulates aldosterone."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Why CKD predisposes to hyperkalemia.", "a": "Fewer nephrons; often needs extra contributors: RAAS blockade, MR antagonists, low distal Na⁺ delivery, AKI, metabolic acidosis, increased K⁺ load."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Hyperkalemia membrane effect.", "a": "Depolarizes cells; severe or sustained depolarization inactivates Na⁺ channels → weakness, conduction abnormalities, ventricular arrhythmias, cardiac arrest."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Hyperkalemia key concept: Stabilize → Shift → Remove.", "a": "IV calcium stabilizes the myocardium; insulin, β₂-agonists, (selectively) bicarbonate shift K⁺ into cells; diuretics, binders, dialysis remove K⁺. <b>A fall in serum K⁺ does not mean K⁺ was removed.</b>"}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Calcium gluconate</b> (CORE).", "a": "Stabilize: raises cardiac myocyte threshold potential; severe hyperkalemia with ECG changes; <b>does not lower K⁺</b>, buys time. Gluconate less irritating; chloride gives more elemental calcium but irritating (class-level)."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Regular insulin + dextrose</b> (CORE).", "a": "Shift: activates Na⁺/K⁺-ATPase; rapid, temporary. Hypoglycemia, <b>prolonged in CKD</b> (reduced insulin clearance); K⁺ may rebound."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Albuterol</b> (CORE) in hyperkalemia.", "a": "Shift: β₂ activation of Na⁺/K⁺-ATPase; additive with insulin; tachycardia, tremor; not sole therapy."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Sodium bicarbonate in hyperkalemia (class-level).", "a": "Shifts K⁺ by correcting acidosis; inconsistent without significant metabolic acidosis; sodium load."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Furosemide</b> (CORE) in hyperkalemia.", "a": "Remove (kidney): ↑ distal Na⁺ delivery and flow → ↑ K⁺ excretion; needs residual function and urine output; weak in oliguria/anuria."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Patiromer</b> (CORE).", "a": "Remove (gut): non-absorbed polymer; binds K⁺ in exchange for Ca²⁺; delayed onset; chronic; helps continue RAAS inhibitors. Constipation; <b>hypomagnesemia</b>."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Sodium zirconium cyclosilicate</b> (CORE).", "a": "Remove (gut): inorganic; selectively binds K⁺ for Na⁺ and H⁺; <b>rapid onset (hours)</b>. Edema (sodium load)."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Sodium polystyrene sulfonate (class-level).", "a": "Older resin; slow, unpredictable; GI effects, serious intestinal injury."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Dialysis for hyperkalemia.", "a": "Definitive; severe/refractory or markedly impaired excretion (oliguria, anuria); always for severe hyperkalemia in HD patients."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Hyperkalemia and ACEi/ARBs (KDIGO).", "a": "Should not automatically stop them: lower K⁺ first; reduce or stop only if uncontrolled despite treatment."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "EPO: source and stimulus.", "a": "Renal interstitial cells in response to hypoxia (HIF stabilization → EPO gene transcription); damaged CKD kidney makes too little → hypoproliferative anemia."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Absolute vs functional iron deficiency.", "a": "Absolute: low stores (blood loss, phlebotomy, HD losses). Functional: stores adequate but unavailable because inflammation and reduced renal clearance raise <b>hepcidin</b>, inhibiting ferroportin."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Ferrous sulfate</b> (CORE).", "a": "Oral iron; absorbed proximal small intestine; vitamin C aids absorption; reasonable in CKD not on hemodialysis. Nausea, constipation/diarrhea, dark stools."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Iron sucrose</b> (CORE).", "a": "IV iron; bypasses absorption; for oral intolerance/inadequate response; <b>preferred in hemodialysis</b>. Infusion/hypersensitivity reactions, iron overload."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Folate vs B12 in CKD anemia.", "a": "Correct when deficient; folate can fix the anemia of B12 deficiency without correcting neurologic damage, so do not miss B12."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Epoetin alfa</b> and <b>darbepoetin alfa</b> (CORE): ESAs.", "a": "Activate EPO receptors → ↑ erythropoiesis; IV or SC; darbepoetin has longer half-life. Needs adequate iron. HTN, thrombotic/CV events and stroke, rare <b>pure red cell aplasia</b>."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Vadadustat (class-level).", "a": "HIF-PH inhibitor; oral; prevents HIF degradation → ↑ endogenous EPO; adults on dialysis ≥3 months. KDIGO 2026: ESAs preferred first-line."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Anemia evaluation labs.", "a": "CBC, reticulocytes, <b>ferritin</b> (stores), <b>TSAT</b> (circulating iron). Ferritin &lt;45: consider bleeding source."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Start iron: non-dialysis/PD vs hemodialysis.", "a": "Non-dialysis/PD: ferritin &lt;100 and TSAT &lt;40%, or ferritin 100-&lt;300 and TSAT &lt;25%. Hemodialysis: ferritin ≤500 and TSAT ≤30%."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "When to hold routine iron.", "a": "Ferritin &gt;700 or TSAT ≥40%; consider pausing during systemic infection."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "ESA thresholds.", "a": "Hemodialysis: consider starting when Hb ≤9-10. <b>Do not maintain Hb ≥11.5</b>; lowest effective dose; if Hb rises &gt;1 g/dL in 2-4 weeks, reduce dose 25-50%."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "ESA principles.", "a": "Fix iron and reversible causes first; ESAs improve anemia, they do not normalize Hb; avoid rapid or excessive correction."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "CKD-MBD regulators and what each does.", "a": "PTH: ↑ Ca²⁺, ↑ phosphate excretion, ↑ calcitriol. FGF23: ↑ phosphate excretion, ↓ calcitriol. Calcitriol: ↑ gut Ca²⁺ and phosphate absorption, ↓ PTH."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "CKD-MBD: what happens in CKD?", "a": "Phosphate retention → ↑ FGF23 and PTH (compensation fails → hyperphosphatemia); ↓ calcitriol → low calcium and secondary hyperparathyroidism."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "CKD-MBD harm both ways.", "a": "Persistent high PTH → high-turnover bone disease, fractures; over-suppressed PTH → <b>low-turnover (adynamic) bone disease</b>; high Ca and phosphate → vascular calcification."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Calcium acetate</b> (CORE) binder.", "a": "Calcium-based; given with meals; hypercalcemia, vascular/soft tissue calcification, constipation. Calcium carbonate is class-level."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Sevelamer</b> (CORE).", "a": "Non-absorbed polymer, no calcium load; carbonate preferred over hydrochloride (less metabolic acidosis); GI intolerance."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Class-level phosphate binders.", "a": "Lanthanum carbonate; ferric citrate (iron, diarrhea); sucroferric oxyhydroxide (iron-based, stool discoloration)."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Cholecalciferol (D₃)</b> (CORE) vs ergocalciferol (class-level).", "a": "Nutritional vitamin D: replenish 25(OH)D stores; need liver and kidney activation; <b>not interchangeable with active vitamin D</b>."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Calcitriol</b> (CORE) and class-level paricalcitol, doxercalciferol.", "a": "Active vitamin D: activates VDR → ↓ PTH; ↑ gut Ca²⁺ and phosphate. Hypercalcemia, hyperphosphatemia. Paricalcitol/doxercalciferol suppress PTH with less tendency to raise Ca²⁺."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "<b>Cinacalcet</b> (CORE) and etelcalcetide (class-level, IV).", "a": "Calcimimetics: activate parathyroid CaSR → ↓ PTH; do not raise gut Ca²⁺ or phosphate; dialysis patients. Hypocalcemia, nausea/vomiting."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Key contrast: active vitamin D vs calcimimetics.", "a": "Active vitamin D: ↓ PTH but can ↑ Ca²⁺ and phosphate. Calcimimetics: ↓ PTH and tend to ↓ Ca²⁺."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Non-dialysis CKD with modest PTH elevation.", "a": "Do <b>not</b> routinely use active vitamin D (no clear benefit, more hypercalcemia); correct contributors; consider in G4-G5 with severe, progressive secondary hyperparathyroidism."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Dialysis (G5D) PTH target (KDIGO).", "a": "<b>About 2-9× the assay upper limit</b>: control, not normalization."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Dialysis pattern: high Ca and/or phosphate vs low calcium.", "a": "High Ca/phosphate → <b>calcimimetic</b>. Low calcium (phosphate not significantly high) → <b>active vitamin D</b>."}, {"g": "Pharmacotherapy of CKD: Progression &amp; Complications", "l": "Part B: Complications", "q": "Phosphate management approach.", "a": "Treat progressive or persistent hyperphosphatemia, not prophylactically; dietary restriction (processed-food additives highly absorbable) ± binders; limit calcium-based binder dose; dialysis removes phosphate."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "BP & Goals", "q": "Blood pressure determinants.", "a": "<b>BP = cardiac output (CO) × systemic vascular resistance (SVR)</b>; CO = HR × stroke volume; SVR set mainly by arteriolar tone; both depend on blood volume (renal Na⁺/water, RAAS, natriuretic peptides, vasopressin)."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "BP & Goals", "q": "BP regulation: short term, long term, local.", "a": "Short term (neural): baroreceptor reflexes. Long term (renal): <b>pressure-natriuresis</b>. Local (endothelial): NO, prostacyclin, endothelin-1."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "BP & Goals", "q": "How hypertension develops: four dysregulations.", "a": "↑ sympathetic tone; inappropriate RAAS activation; impaired pressure-natriuresis; endothelial dysfunction → raise the arterial pressure \"set point\"."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "BP & Goals", "q": "BP determinant → drug classes.", "a": "Vascular tone (SVR/afterload): CCBs, α₁-blockers, direct vasodilators. Intravascular volume: diuretics, RAAS inhibitors. Cardiac output: β-blockers, non-DHP CCBs (and central sympatholytics)."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "BP & Goals", "q": "Goal of therapy and target.", "a": "Lower BP to the level with least CV morbidity/mortality; ↓ MI, stroke, HF, CKD progression. Target <b>&lt;130/80 mmHg</b> in most adults."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "BP & Goals", "q": "Targets: frail older adults vs diabetes/CKD/ASCVD.", "a": "Frail/orthostatic: more conservative. Diabetes, CKD, ASCVD: stricter."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "BP & Goals", "q": "Lifestyle measures and effects.", "a": "Sodium &lt;1.5-2.3 g/day; aerobic ~30 min most days (↓ SBP 5-8); weight loss ~1 mmHg per kg; DASH diet; limit alcohol, stop smoking."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "BP & Goals", "q": "Lifestyle in hypertension: how far does it go?", "a": "Cornerstone at every stage but may normalize BP only in some stage 1 patients; most need drugs."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "<b>Thiazides</b>: mechanism and preferred use.", "a": "DCT: ↓ Na⁺ reabsorption → ↓ ECV and CO; later ↓ peripheral resistance. <b>First-line for most primary uncomplicated hypertension</b>; best in older adults with ISH; generally safe in pregnancy."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Thiazide adverse effects.", "a": "Hyponatremia, hypokalemia, hyperuricemia, mild metabolic changes. Efficacy persists after volume normalizes (vascular adaptation, not persistent diuresis)."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Loop diuretics in hypertension.", "a": "Not first-line; for volume overload, CKD, HF."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "β-blockers: mechanism, uses, cautions.", "a": "↓ CO, ↓ renin. Post-MI, chronic stable angina, arrhythmias, hyperthyroidism. Caution in asthma, bradyarrhythmias, advanced AV block."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Central α₂ agonists.", "a": "Clonidine, methyldopa, guanfacine: ↓ sympathetic outflow and SVR. <b>Methyldopa: pregnancy</b>; clonidine: resistant. Sedation; <b>rebound hypertension</b> with abrupt clonidine withdrawal."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "α₁-blockers.", "a": "Doxazosin, prazosin, terazosin; resistant hypertension, BPH; orthostatic hypotension, reflex tachycardia, fluid retention: limit first-line use."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "DHP CCBs vs non-DHP CCBs.", "a": "DHP (amlodipine, nifedipine): arteriolar relaxation; ISH/salt-sensitive; peripheral edema. Non-DHP (verapamil, diltiazem): ↓ HR and contractility; AF rate control; contraindicated in HFrEF; bradycardia."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Direct vasodilators.", "a": "Hydralazine, minoxidil: relax arteriolar smooth muscle; reflex tachycardia, Na⁺/water retention (combine with β-blocker + diuretic); minoxidil: hirsutism, pericardial effusion; hydralazine in pregnancy."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "RAAS modulators: uses and contraindications.", "a": "ACEi, ARBs, aliskiren: diabetes, CKD, post-MI; slow diabetic nephropathy. Contraindicated: <b>pregnancy, bilateral renal artery stenosis, severe hyperkalemia</b>."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Monotherapy vs combination: when?", "a": "Monotherapy: stage 1 without comorbidities. Combination: stage 2, or BP &gt;20/10 above goal. Rule: comorbidity first, BP profile second."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Why combine complementary mechanisms?", "a": "Different determinants (tone, CO, volume) → additive/synergistic effect and fewer compensatory responses; improves efficacy, adherence and tolerability vs dose escalation."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Recommended combinations.", "a": "Thiazide + ACEi/ARB (RAAS blocks renin rise); CCB + ACEi/ARB (less edema); thiazide + CCB (volume + vascular relaxation)."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Combinations to avoid.", "a": "ACEi + ARB (or aliskiren): ↑ renal dysfunction, hyperkalemia, hypotension. β-blocker + verapamil/diltiazem: bradycardia/AV block. High-dose thiazide + nonselective β-blocker in diabetes/metabolic."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Direct vasodilator + β-blocker + diuretic: why?", "a": "Offsets reflex tachycardia and fluid retention."}, {"g": "Clinical Pharmacology of Antihypertensive Agents", "l": "Classes & Combinations", "q": "Loop + thiazide.", "a": "Sequential nephron blockade for edema/volume states; K⁺-sparing added to prevent hypokalemia."}, {"g": "Cli
